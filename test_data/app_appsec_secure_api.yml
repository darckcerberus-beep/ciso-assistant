# ==============================================================================
# Application: App-AppSec-Secure-API
# Profile: Modern Cloud-Native Payment API (Secret / SaaS Cloud / 100% Compliant)
# ==============================================================================
# This profile represents a production-grade, cloud-native microservices platform
# handling sensitive payment and customer financial data. It demonstrates comprehensive
# AppSec compliance with secure architecture, DevSecOps automation, cryptographic controls,
# and operational resilience aligned with OWASP ASVS and NIST SP 800-53 standards.
# ==============================================================================

application:
  order: 13
  id: "app_appsec_secure_api"
  name: "App-AppSec-Secure-API"
  label: "App-AppSec-Secure-API (Secret / SaaS Cloud / 100% Compliant / Low Risk)"
  description: "High-security payment processing microservices API on AWS cloud; comprehensive AppSec controls, DevSecOps automation, and robust SaaS governance."
  classification: "Secret"
  hosting: "SaaS"
  compliance_target: "100%"
  expected_risk: "Low"
  framework_ref: "appsec"
  framework_name: "Application Security Assessment Framework (AppSec)"
  framework_yaml: "YML/appsec.yml"
  user:
    email: "david.secure@example-paymentapi.com"
    first_name: "David"
    last_name: "SecureCloud"
  tprm:
    criticality: 4
    maturity: 4
    trust: 4
    conclusion: "ok"

answers:
  # ============================================================================
  # CHAPTER 1: APPLICATION INFORMATION & GOVERNANCE
  # ============================================================================

  - requirement: "stakeholder_identification"
    question: "Is there a designated business contact?"
    answer: "Yes"
    result: "compliant"
    observation: "VP of Payments & Revenue Operations designated as primary business contact; updated in LeanIX Q3 2026."

  - requirement: "stakeholder_identification"
    question: "Is there a designated IT contact?"
    answer: "Yes"
    result: "compliant"
    observation: "Principal Architect (Cloud Platforms) designated as IT contact with backup secondary contact."

  - requirement: "stakeholder_identification"
    question: "Is there a designated data owner?"
    answer: "Yes"
    result: "compliant"
    observation: "Chief Data Officer holds formal data ownership charter for payment records."

  - requirement: "stakeholder_identification"
    question: "Is the information about stakeholders updated in LeanIX / CMDB?"
    answer: "Yes"
    result: "compliant"
    observation: "All stakeholder records synchronized with LeanIX; monthly audit trail maintained."

  - requirement: "data_classification"
    question: "What is the maximum classification level handled?"
    answer: "Secret"
    result: "compliant"
    observation: "Processes Secret-level payment authorization tokens, customer PII, and financial transaction records. Impact Level 4."

  - requirement: "hosting"
    question: "What is the hosting model?"
    answer: "SaaS"
    result: "compliant"
    observation: "Cloud-native microservices on Amazon Web Services (AWS) managed multi-tenant SaaS infrastructure with strict tenant segregation."

  # ============================================================================
  # CHAPTER 2: IDENTITY, AUTHENTICATION & ACCESS CONTROL
  # ============================================================================

  - requirement: "authentication_and_mfa"
    question: "Is Multi-Factor Authentication (MFA) enforced for all administrative and privileged access?"
    answer: "Yes"
    result: "compliant"
    observation: "Mandatory hardware security key (FIDO2/WebAuthn) or TOTP MFA enforced for all AWS, Kubernetes, and CI/CD access."

  - requirement: "authentication_and_mfa"
    question: "Are strong password policies and brute-force lockout protections implemented?"
    answer: "Yes"
    result: "compliant"
    observation: "Minimum 16-character passphrases, breached password dictionary checks, and automated IP rate-limiting lockout after 5 failed attempts."

  - requirement: "federation_and_sso"
    question: "Is user authentication delegated to a centralized enterprise Identity Provider (SSO / SAML 2.0 / OIDC)?"
    answer: "Yes"
    result: "compliant"
    observation: "Enterprise Okta IdP configured with OpenID Connect (OIDC) and PKCE flow for all user and developer authentication."

  - requirement: "access_control_and_rbac"
    question: "Is access controlled via granular roles (RBAC/ABAC) enforcing least privilege across all business functions and APIs?"
    answer: "Yes"
    result: "compliant"
    observation: "Fine-grained RBAC/ABAC enforced via Open Policy Agent (OPA) with least privilege principles applied across all endpoints."

  - requirement: "access_control_and_rbac"
    question: "Is the application integrated with the enterprise Identity Governance and Administration (IGA) solution (such as SailPoint) for centralized user lifecycle, role management, and automated provisioning/deprovisioning?"
    answer: "Yes"
    result: "compliant"
    observation: "Onboarded into enterprise SailPoint IdentityIQ for automated JML provisioning and role governance."

  - requirement: "access_control_and_rbac"
    question: "Are user entitlements and privileged permissions reviewed and recertified on a periodic basis via formal recertification campaigns (e.g., SailPoint certification campaigns at least annually for standard users, biannually for privileged accounts)?"
    answer: "Yes"
    result: "compliant"
    observation: "Quarterly User Access Review (UAR) recertification campaigns executed and certified in SailPoint by business data owners."

  - requirement: "session_management"
    question: "Are session tokens securely generated, transmitted with secure cookie flags (HttpOnly, Secure, SameSite), and invalidated on logout or inactivity?"
    answer: "Yes"
    result: "compliant"
    observation: "Cryptographically secure JWTs with RS256 signature, 15-minute expiration, SameSite=Strict, Secure, and HttpOnly cookie flags."

  # ============================================================================
  # CHAPTER 3: APPLICATION VULNERABILITY DEFENSE & CODE HYGIENE
  # ============================================================================

  - requirement: "owasp_top_10_defenses"
    question: "Do you apply coding guidelines against OWASP Top 10 vulnerabilities (including input validation, parameterized queries, output encoding, and secure error handling)?"
    answer: "Yes"
    result: "compliant"
    observation: "Development teams strictly enforce secure coding guidelines adhering to OWASP Top 10 standards across all in-house services."

  - requirement: "ssrf_and_cloud_metadata_defense"
    question: "Are outbound HTTP requests initiated by the application strictly validated using destination allow-lists with connections to RFC 1918 private subnets and localhost blocked?"
    answer: "Yes"
    result: "compliant"
    observation: "Outbound API calls restricted via strict egress gateway allow-list; RFC 1918 and loopback blocked."

  - requirement: "ssrf_and_cloud_metadata_defense"
    question: "Are cloud instance metadata protections enforced"
    answer: "Yes"
    result: "compliant"
    observation: "AWS IMDSv2 enforced with hop-limit=1 across all ECS tasks and EKS pods."

  - requirement: "file_upload_security"
    question: "Are uploaded files validated via server-side magic byte inspection"
    answer: "Yes"
    result: "compliant"
    observation: "Magic-byte inspection enforced; uploaded receipt attachments given UUID filenames."

  - requirement: "file_upload_security"
    question: "Are uploaded files scanned for malware"
    answer: "Yes"
    result: "compliant"
    observation: "GuardDuty S3 Malware Protection and ClamAV scanning in place; private S3 buckets accessed only via presigned URLs."

  - requirement: "secrets_management"
    question: "Are application credentials, API keys, and cryptographic secrets stored exclusively in a dedicated secrets manager rather than in code or configuration files?"
    answer: "Yes"
    result: "compliant"
    observation: "All secrets managed in HashiCorp Vault with automated 90-day key rotation and TruffleHog pre-commit blocking."

  # ============================================================================
  # CHAPTER 4: CRYPTOGRAPHY & DATA PROTECTION
  # ============================================================================

  - requirement: "data_in_transit"
    question: "Is data encrypted during transit?"
    answer: "Yes"
    result: "compliant"
    observation: "Enforced TLS 1.3 with forward secrecy for all external connections and internal Istio service-to-service mTLS."


  # ============================================================================
  # CHAPTER 5: SECURE SDLC & DEVSECOPS
  # ============================================================================

  - requirement: "automated_security_testing"
    question: "Is automated Static Application Security Testing (SAST) integrated into the CI/CD pipeline with blocking quality gates?"
    answer: "Yes"
    result: "compliant"
    observation: "Semgrep and Snyk SAST run on every pull request; blocking quality gates prevent merges on Critical and High findings."

  - requirement: "automated_security_testing"
    question: "Is Dynamic Application Security Testing (DAST) or API security scanning performed prior to release?"
    answer: "Yes"
    result: "compliant"
    observation: "Automated OWASP ZAP and Postman API security scans execute against staging environment prior to production promotion."

  - requirement: "supply_chain_and_dependencies"
    question: "Is Software Composition Analysis (SCA) automated to detect known vulnerabilities in open-source dependencies and packages?"
    answer: "Yes"
    result: "compliant"
    observation: "Snyk SCA scans third-party libraries continuously with automated Dependabot pull requests."

  - requirement: "supply_chain_and_dependencies"
    question: "Is an accurate Software Bill of Materials (SBOM) maintained and audited for all released application artifacts?"
    answer: "Yes"
    result: "compliant"
    observation: "CycloneDX SBOM generated at build time for every container image and verified via Sigstore Cosign signatures."

  - requirement: "code_review_and_ci_cd_integrity"
    question: "Are mandatory peer code reviews and branch protection rules enforced before any merge into deployment branches?"
    answer: "Yes"
    result: "compliant"
    observation: "GitHub branch protection mandates 2 peer approvals, passing CI status checks, and signed commits."


  # ============================================================================
  # CHAPTER 8: SECURITY LOGGING, MONITORING & INCIDENT RESPONSE
  # ============================================================================

  - requirement: "security_event_logging"
    question: "Does the application log key security events (failed logins, privilege escalation, administrative changes, access to sensitive assets)?"
    answer: "Yes"
    result: "compliant"
    observation: "Structured JSON logging records all authentication, authorization, and administrative actions."

  - requirement: "security_event_logging"
    question: "Are sensitive data fields (passwords, payment cards, tokens, PII) systematically sanitized/masked from log outputs?"
    answer: "Yes"
    result: "compliant"
    observation: "Automated log redaction filter masks credit card numbers, passwords, and PII prior to log ingestion."

  - requirement: "centralized_monitoring_and_alerting"
    question: "Are application logs forwarded in near-real-time to a central SIEM/SOC platform with alerting rules for suspicious activities?"
    answer: "Yes"
    result: "compliant"
    observation: "Logs streamed to Datadog SIEM with real-time SOC alerting and automated PagerDuty incident routing."

  # ============================================================================
  # CHAPTER 9: TESTING, PATCHING & RESILIENCE
  # ============================================================================

  - requirement: "saas_penetration_testing_and_vulnerability_management"
    question: "How is independent penetration testing governed and performed on the SaaS platform?"
    answer: "The SaaS vendor does the pentest (contract mandates that the vendor undergoes annual independent penetration tests and provides audit reports/attestations)"
    result: "compliant"
    observation: "Annual external penetration test completed by CREST-accredited vendor in May 2026."

  - requirement: "saas_penetration_testing_and_vulnerability_management"
    question: "Does the SaaS contract commit the provider to formal vulnerability remediation SLAs (e.g. Critical within 7 days, High within 30 days)?"
    answer: "Yes"
    result: "compliant"
    observation: "Strict remediation SLA enforced: Critical within 48 hours, High within 14 days; 100% SLA compliance achieved in 2026."

  - requirement: "backup_and_disaster_recovery"
    question: "Are automated and encrypted backups maintained for application state and databases, with restoration tests performed at least annually?"
    answer: "Yes"
    result: "compliant"
    observation: "Continuous automated backups with point-in-time recovery (PITR) replicated cross-region; bi-annual disaster recovery drills verified."

  # ============================================================================
  # CHAPTER 10: THIRD-PARTY SAAS GOVERNANCE
  # ============================================================================

  - requirement: "saas_contract_compliance"
    question: "Is there a signed SaaS contract and binding Security Schedule?"
    answer: "Yes"
    result: "compliant"
    observation: "Signed enterprise SaaS master service agreement with cloud provider and binding Security Schedule."

# ==============================================================================
# Expected Risk Scenarios & Evaluation (AppSec Framework)
# ==============================================================================
# SaaS Application -> All 16 scenarios evaluated.
# Impact Level: 4 (Secret). All likelihoods: 1 (Unlikely, 100% compliance).
# Grid[0][3] (Likelihood 1, Impact 4) = 1 (Low Risk, Level 2) -> Priority 3 (Medium)
# ==============================================================================
expected_evaluation:
  impact_level: 4
  confidentiality_impact: 4
  availability_impact: 4
  integrity_impact: 4
  scenario_count: 11
  excluded_scenarios:
    - "Third-party data leakage"
    - "Exposure of unencrypted data at rest"
    - "Disclosure of production data in non-production environments"
    - "Excessive retention of sensitive data"
    - "API abuse and denial of service"

