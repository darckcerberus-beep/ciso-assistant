# ==============================================================================
# Application: App-AppSec-Secure-API
# Profile: Certified SaaS Payment Platform (Secret / SaaS Cloud / 100% Compliant)
# ==============================================================================
# This profile represents a production-grade, ISO 27001 & SOC 2 Type II certified
# SaaS payment platform handling sensitive payment and customer financial data.
# It demonstrates 100% compliance across the active Implementation Groups
# (info, baseline, saas_app) with enterprise SSO, SailPoint IGA integration,
# and comprehensive contractual and technical SaaS safeguards.
# ==============================================================================

application:
  order: 13
  id: "app_appsec_secure_api"
  name: "App-AppSec-Secure-API"
  label: "App-AppSec-Secure-API (Secret / SaaS Cloud / 100% Compliant / Low Risk)"
  description: "High-security ISO 27001 & SOC 2 certified payment processing SaaS platform; comprehensive baseline IAM and SaaS governance."
  classification: "Secret"
  hosting: "SaaS"
  compliance_target: "100%"
  expected_risk: "Low"
  framework_ref: "appsec"
  framework_name: "Application Security Assessment Framework (AppSec)"
  framework_yaml: "YML/appsec.yml"
  user:
    email: "david.secure@example-paymentapi.com"
    first_name: "David"
    last_name: "SecureCloud"
  tprm:
    criticality: 4
    maturity: 4
    trust: 4
    conclusion: "ok"

answers:
  # ============================================================================
  # CHAPTER 1: APPLICATION INFORMATION & GOVERNANCE (IG: info)
  # ============================================================================

  - requirement: "application_description"
    question: "What is the primary functional domain and business purpose of the application?"
    answer: "Integration Middleware & Core APIs (API gateways, message brokers, microservices hub)"
    result: "compliant"
    observation: "High-security ISO 27001 & SOC 2 certified payment processing SaaS platform exposing core REST APIs for transactional billing."

  - requirement: "application_description"
    question: "Who are the primary intended users or consumers of the application?"
    answer: "Automated systems / Machine-to-Machine clients only (APIs, daemons, backend services)"
    result: "compliant"
    observation: "Core payment API consumed by automated microservices and server-to-server transaction daemons."

  - requirement: "stakeholder_identification"
    question: "Is there a designated business contact? (Designated business owner or product sponsor accountable for business processes, functionality, and risk acceptance)"
    answer: "Yes"
    result: "compliant"
    observation: "VP of Payments & Revenue Operations designated as primary business contact; updated in LeanIX Q3 2026."

  - requirement: "stakeholder_identification"
    question: "Is there a designated IT contact? (Technical lead or engineer responsible for maintenance, infrastructure, deployment, and operational support)"
    answer: "Yes"
    result: "compliant"
    observation: "Principal Architect (Cloud Platforms) designated as IT contact with backup secondary contact."

  - requirement: "stakeholder_identification"
    question: "Is there a designated data owner? (Data steward or governance officer responsible for information classification, access authorization, and regulatory compliance)"
    answer: "Yes"
    result: "compliant"
    observation: "Chief Data Officer holds formal data ownership charter for payment records."

  - requirement: "stakeholder_identification"
    question: "Is the information about stakeholders updated in LeanIX / CMDB? (Stakeholder assignments registered and kept current in the enterprise inventory or service catalog)"
    answer: "Yes"
    result: "compliant"
    observation: "All stakeholder records synchronized with LeanIX; monthly audit trail maintained."

  - requirement: "data_classification"
    question: "What primary category of retail, commercial, or operational data is handled by the application?"
    answer: "Critical financial assets, secrets, or anti-fraud algorithms (e.g. customer payment cardholder data [PCI-DSS], refund bank accounts, production root credentials / API keys, fraud-detection evasion rules & thresholds)"
    result: "compliant"
    observation: "Processes Secret-level payment authorization tokens, customer PII, and financial transaction records."

  - requirement: "data_classification"
    question: "What would be the estimated business, legal, or operational impact if the application's data were exposed, breached, or leaked?"
    answer: "Catastrophic or existential impact (Direct financial theft, payment card brand sanctions/fines, critical legal liability, systemic loss of customer trust, or severe statutory penalties)"
    result: "compliant"
    observation: "Breach would cause direct financial theft, severe PCI-DSS penalties, and catastrophic reputational compromise."
  - requirement: "data_classification"
    question: "What category of personal data is processed by the application under GDPR?"
    answer: "HR and financial details about employees and customer payment data"
    result: "compliant"
    observation: "Processes customer payment card data, payment authorization tokens, and bank account numbers."

  - requirement: "data_classification"
    question: "What is the volume of data subjects (individuals) whose personal data is processed?"
    answer: "High volume / Large scale processing under GDPR (More than 100,000 individuals, or systemic nationwide monitoring)"
    result: "compliant"
    observation: "Core payment processing pipeline servicing over 500,000 consumer customer accounts."

  - requirement: "hosting"
    question: "What is the delivery and hosting model of the application?"
    answer: "SaaS (Third-party software hosted and operated by a vendor)"
    result: "compliant"
    observation: "Multi-tenant SaaS payment platform operated by a certified third-party vendor."

  - requirement: "hosting"
    question: "Is the SaaS vendor ISO/IEC 27001 or SOC 2 Type II certified?"
    answer: "Yes - The SaaS vendor holds an active ISO/IEC 27001 certification or SOC 2 Type II report"
    result: "compliant"
    observation: "Vendor holds active ISO/IEC 27001:2022 certification and annual SOC 2 Type II report."

  # ============================================================================
  # CHAPTER 2: IDENTITY, AUTHENTICATION & ACCESS CONTROL (IG: baseline)
  # ============================================================================

  - requirement: "authentication_and_mfa"
    question: "How do users authenticate to the application?"
    answer: "Enterprise SSO exclusively (SAML 2.0 / OIDC federated IdP, with no local accounts)"
    result: "compliant"
    observation: "Enterprise Okta IdP configured with OpenID Connect (OIDC) and hardware FIDO2 MFA for all user authentication."

  - requirement: "access_control_and_rbac"
    question: "Have you defined roles and permissions for the application? (Is access controlled via granular roles (RBAC/ABAC) enforcing least privilege across all business functions and APIs?)"
    answer: "Yes"
    result: "compliant"
    observation: "Fine-grained RBAC/ABAC enforced with least privilege principles applied across all endpoints."

  - requirement: "access_control_and_rbac"
    question: "Is the application integrated with the enterprise Identity Governance and Administration (IGA) solution (such as SailPoint) for centralized user lifecycle, role management, and automated provisioning/deprovisioning?"
    answer: "Yes"
    result: "compliant"
    observation: "Onboarded into enterprise SailPoint IdentityIQ for automated JML provisioning and role governance."

  - requirement: "access_control_and_rbac"
    question: "Are user entitlements and privileged permissions reviewed and recertified on a periodic basis via formal recertification campaigns (e.g., SailPoint certification campaigns at least annually for standard users, biannually for privileged accounts)?"
    answer: "Yes"
    result: "compliant"
    observation: "Quarterly User Access Review (UAR) recertification campaigns executed and certified in SailPoint by business data owners."

  # ============================================================================
  # CHAPTER 10: THIRD-PARTY SAAS GOVERNANCE (IG: saas_app)
  # ============================================================================

  - requirement: "saas_contract_compliance"
    question: "Is there a signed SaaS contract and binding Security Schedule? (e.g., legally executed Master Services Agreement / MSA and Security Exhibit with the provider)"
    answer: "Yes"
    result: "compliant"
    observation: "Signed enterprise SaaS Master Services Agreement (MSA), DPA, and binding Security Schedule."

  - requirement: "saas_confidentiality_and_data_protection"
    question: "Does the contract require vendor personnel to sign confidentiality agreements (NDAs) and restrict access to customer data (e.g. requiring client approval before vendor support or engineering can access tenant data)?"
    answer: "Yes"
    result: "compliant"
    observation: "Contract mandates individual staff NDAs and explicit customer approval before any vendor support access to tenant data."

  - requirement: "saas_confidentiality_and_data_protection"
    question: "Does the contract mandate data encryption for all customer data, both in transit (e.g. TLS/HTTPS) and at rest (e.g. AES-256)?"
    answer: "Yes"
    result: "compliant"
    observation: "Security Schedule mandates TLS 1.3 in transit and AES-256-GCM encryption at rest with customer-managed KMS keys (BYOK)."

  - requirement: "saas_iam"
    question: "Does root, administrative, and break-glass access to the SaaS tenant management console strictly enforce Multi-Factor Authentication (MFA) independently of standard user SSO?"
    answer: "Yes"
    result: "compliant"
    observation: "Phishing-resistant FIDO2/WebAuthn MFA strictly enforced for all tenant administrative and break-glass accounts."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the contract mandate that all customer data (including primary databases, processing pipelines, and backups) be hosted primarily within the European Union (EU) or European Economic Area (EEA)?"
    answer: "Yes"
    result: "compliant"
    observation: "Contractual data residency addendum guarantees primary hosting and disaster recovery exclusively within EU regions (Frankfurt and Dublin)."

  - requirement: "saas_data_hosting_and_residency"
    question: "Is a formal Data Processing Agreement (DPA) executed with the vendor that incorporates all mandatory GDPR Article 28 clauses (processing only on documented instructions, personnel confidentiality commitments, and statutory security measures)?"
    answer: "Yes"
    result: "compliant"
    observation: "Executed Data Processing Addendum (DPA) incorporating all mandatory GDPR Article 28 requirements."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the contract mandate prior written authorization or advance notice before engaging or replacing sub-processors, granting the customer a legally enforceable right to object or terminate?"
    answer: "Yes"
    result: "compliant"
    observation: "Vendor is contractually obligated to provide 30-day advance notice for any sub-processor change with customer objection and contract termination rights."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the contract or DPA establish a binding obligation for the vendor to notify the customer without undue delay (within 24 to 48 hours maximum) following the discovery of a suspected or confirmed personal data breach?"
    answer: "Yes"
    result: "compliant"
    observation: "Binding contractual commitment to notify customer security operations within 24 to 48 hours of any suspected or confirmed breach."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the vendor provide technical mechanisms or contractual commitments to assist the customer in fulfilling Data Subject Rights (access, rectification, erasure, portability) and ensure complete data deletion or return upon contract termination?"
    answer: "Yes"
    result: "compliant"
    observation: "Platform includes self-service GDPR export and erasure tools, with contractual commitment to certify data deletion upon termination."

  - requirement: "saas_audit_and_compliance"
    question: "Does the contract legally grant the client (or an authorized independent third party) the right to audit the provider and obtain compliance evidence to verify adherence to contractual security obligations?"
    answer: "Yes"
    result: "compliant"
    observation: "Enterprise agreement includes explicit Right to Audit and annual compliance evidence delivery."

  - requirement: "saas_audit_and_compliance"
    question: "How is independent penetration testing governed and performed on the SaaS platform?"
    answer: "The SaaS vendor does the pentest (contract mandates that the vendor undergoes annual independent penetration tests and provides audit reports/attestations)"
    result: "compliant"
    observation: "Annual external penetration test completed by CREST-accredited vendor in May 2026."

  - requirement: "saas_pci_dss"
    question: "Is the application or service in scope for PCI DSS? (e.g., processes, stores, or transmits cardholder data, connects to the Cardholder Data Environment, or can impact the security of the CDE)"
    answer: "Yes - In scope for PCI DSS"
    result: "compliant"
    observation: "Platform processes payment authorization tokens and cardholder transaction payloads."

  - requirement: "saas_pci_dss"
    question: "If in scope for PCI DSS, is the SaaS vendor PCI DSS certified (with a valid annual Attestation of Compliance / AOC covering the service)?"
    answer: "Yes"
    result: "compliant"
    observation: "Vendor holds valid PCI DSS v4.0 Level 1 Service Provider Attestation of Compliance (AOC)."

  - requirement: "saas_pci_dss"
    question: "If in scope for PCI DSS, does the contract require the provider to maintain active PCI DSS certification, provide an annual AOC, and enforce dedicated payment incident procedures with immediate notification?"
    answer: "Yes"
    result: "compliant"
    observation: "PCI DSS Responsibility Matrix and annual AOC delivery obligation incorporated into the MSA Security Schedule."

  - requirement: "saas_non_conformity_remediation"
    question: "Does the contract mandate formal remediation plans and compensatory measures for identified security gaps, with explicit rights to suspend access or terminate for repeated breaches?"
    answer: "Yes"
    result: "compliant"
    observation: "Contract includes binding SLA remediation timelines, financial service credits, and termination-for-cause rights."

# ==============================================================================
# Expected Risk Scenarios & Evaluation (AppSec Framework)
# ==============================================================================
# Certified SaaS Application (IGs: info, baseline, saas_app) -> 7 in-scope scenarios.
# Impact Level: 4 (Secret). All likelihoods: 1 (Unlikely, 100% compliance).
# Grid[0][3] (Likelihood 1, Impact 4) = 1 (Low Risk, Level 2) -> Priority 3 (Medium)
# ==============================================================================
expected_evaluation:
  impact_level: 4
  confidentiality_impact: 4
  availability_impact: 4
  integrity_impact: 4
  scenario_count: 10
  excluded_scenarios:
  - API abuse and denial of service
  - Application compromise via injection attack
  - Application or storage compromise via unrestricted file upload
  - Catastrophic data loss due to unverified backups
  - Compromise of CI/CD pipeline integrity and unreviewed code deployment
  - Compromise of customer data via unmanaged mobile devices
  - Compromise via unhardened or End-of-Life (EOL) COTS deployment
  - Credential leakage via hardcoded secrets
  - Deployment of undetected code vulnerabilities due to missing security testing
  - Deployment of vulnerable commercial software due to unverified vendor SDLC
  - Disclosure of production data in non-production environments
  - Excessive retention of sensitive data
  - Exploitation of unpatched SaaS vulnerability
  - Exploitation of unpatched vulnerability
  - Exposure of unencrypted data at rest
  - Exposure of unencrypted data in transit
  - Fourth-party vendor and sub-processor supply chain breach
  - Host or OS compromise via unpatched system vulnerabilities
  - Phishing and social engineering compromise of SaaS personnel
  - Physical unauthorized access and datacenter hardware tampering
  - SaaS application exploitation via unverified vendor SDLC
  - SaaS endpoint compromise and administrative credential theft
  - SaaS operational security compromise due to missing governance policies
  - SaaS service disruption and catastrophic data loss
  - SaaS tenant isolation breach and cross-border leakage
  - SaaS tenant network perimeter breach and unauthorized egress
  - SaaS vendor privilege abuse and sub-processor leakage
  - SaaS web application transport and session exploitation
  - Sensitive data exposure in logs or missing forensic audit trail
  - Session hijacking and token replay
  - Supply chain compromise via vulnerable dependency
  - Third-party data leakage
  - Undetected breach due to missing security logging
  - Unmonitored SaaS security incidents and delayed breach detection
expected_risk_scenarios:
- scenario: Account takeover via weak authentication
  likelihood_requirement: authentication_and_mfa
  likelihood_score: 100
  scaled_likelihood: 1
  scaled_impact: 4
  matrix_risk_id: 1
  risk_level: 2
  control_priority: 3
