application:
  order: 18
  id: app_manual_cots_internal
  name: App-Manual-COTS-Internal
  label: 'App-Manual-COTS-Internal (Case 3: COTS + Internal / Confidential / 100%
    Compliant)'
  description: Commercial off-the-shelf software deployed on internal servers; demonstrates
    Case 3 conditional IG scoping (info, baseline, cots_app, infra).
  classification: Confidential
  hosting: On-Premise
  compliance_target: 100%
  expected_risk: Low
  framework_ref: appsec_manual
  framework_name: Application Security Assessment Framework (AppSec - Manual IG)
  framework_yaml: YML/appsec_manual.yml
  user:
    email: marcus.cots@example-cots.internal
    first_name: Marcus
    last_name: Package
  tprm:
    criticality: 3
    maturity: 4
    trust: 4
    conclusion: ok
  expected_implementation_groups:
  - info
  - baseline
  - cots_app
  - infra
answers:
- requirement: application_description
  question: What is the primary functional domain and business purpose of the application?
  answer: Internal Operations & Enterprise Management (ERP, CRM, HR, finance, supply chain, intranet)
  result: compliant
  observation: Commercial off-the-shelf software package deployed on corporate internal servers for internal enterprise workflow management.
- requirement: application_description
  question: Who are the primary intended users or consumers of the application?
  answer: Internal workforce (employees, internal contractors)
  result: compliant
  observation: Used exclusively by corporate employees and internal operational teams.
- requirement: stakeholder_identification
  question: Is there a designated business contact? (Designated business owner or
    product sponsor accountable for business processes, functionality, and risk acceptance)
  answer: 'Yes'
  result: compliant
  observation: Head of Enterprise Supply Chain designated as business owner.
- requirement: stakeholder_identification
  question: Is there a designated IT contact? (Technical lead or engineer responsible
    for maintenance, infrastructure, deployment, and operational support)
  answer: 'Yes'
  result: compliant
  observation: Senior ERP Systems Administrator designated as IT lead.
- requirement: stakeholder_identification
  question: Is there a designated data owner? (Data steward or governance officer
    responsible for information classification, access authorization, and regulatory
    compliance)
  answer: 'Yes'
  result: compliant
  observation: Corporate Comptroller designated as data steward for inventory ledgers.
- requirement: stakeholder_identification
  question: Is the information about stakeholders updated in LeanIX / CMDB? (Stakeholder
    assignments registered and kept current in the enterprise inventory or service
    catalog)
  answer: 'Yes'
  result: compliant
  observation: Documented in enterprise CMDB under internal ERP software tier.
- requirement: data_classification
  question: What is the maximum classification level handled? (Public, Internal, Confidential,
    or Secret according to organizational data classification policy)
  answer: Confidential
  result: compliant
  observation: Confidential supply chain contracts and warehouse inventory valuation
    records.
- requirement: data_classification
  question: What category of personal data is processed by the application under GDPR?
  answer: Contact and order details about customers
  result: compliant
  observation: Processes confidential employee records, staff operational history, and contractor assignments.
- requirement: data_classification
  question: What is the volume of data subjects (individuals) whose personal data is processed?
  answer: Medium volume (1,000 to 100,000 individuals / data subjects)
  result: compliant
  observation: Internal enterprise deployment covering approximately 5,000 workforce members.
- requirement: hosting
  question: What is the delivery and hosting model of the application?
  answer: Bought software deployed by my teams (COTS / Vendor package)
  result: compliant
  observation: Bought commercial software (COTS) package deployed and operated on
    internal servers.
- requirement: hosting
  question: What is the network exposure of the application?
  answer: Internal / Restricted Network only
  result: compliant
  observation: Internal restricted warehouse VLAN; no public exposure.
- requirement: authentication_and_mfa
  question: How do users authenticate to the application?
  answer: Enterprise SSO exclusively (SAML 2.0 / OIDC federated IdP, with no local accounts)
  result: compliant
  observation: Federated with corporate Active Directory / Entra ID via SAML 2.0.
- requirement: access_control_and_rbac
  question: Have you defined roles and permissions for the application? (Is access
    controlled via granular roles (RBAC/ABAC) enforcing least privilege across all
    business functions and APIs?)
  answer: 'Yes'
  result: compliant
  observation: COTS role templates tailored to enforce warehouse vs accounting segregation.
- requirement: access_control_and_rbac
  question: Is the application integrated with the enterprise Identity Governance
    and Administration (IGA) solution (such as SailPoint) for centralized user lifecycle,
    role management, and automated provisioning/deprovisioning?
  answer: 'Yes'
  result: compliant
  observation: Automated role provisioning synced with corporate IGA directory.
- requirement: access_control_and_rbac
  question: Are user entitlements and privileged permissions reviewed and recertified
    on a periodic basis via formal recertification campaigns (e.g., SailPoint certification
    campaigns at least annually for standard users, biannually for privileged accounts)?
  answer: 'Yes'
  result: compliant
  observation: Annual user access reviews conducted by logistics management.
- requirement: vendor_secure_development
  question: Does the third-party COTS software vendor adhere to recognized secure
    coding standards and software development security guidelines (e.g., OWASP, ISO/IEC
    27034, NIST SSDF)?
  answer: 'Yes'
  result: compliant
  observation: COTS vendor adheres to ISO 27034 and provides quarterly security bulletins.
- requirement: cots_deployment_hardening
  question: Are default vendor credentials changed, sample modules removed, and configuration
    hardened against vendor or CIS benchmarks?
  answer: 'Yes'
  result: compliant
  observation: Default admin accounts disabled, sample datasets purged, CIS benchmarks
    applied.
- requirement: cots_deployment_hardening
  question: Does the COTS software actively receive security patches and vulnerability
    updates from the vendor (under an active maintenance/support contract, not End-of-Life
    / EOL or End-of-Support / EOS)?
  answer: 'Yes'
  result: compliant
  observation: Active vendor enterprise support and software maintenance agreement
    through 2029.
- requirement: cots_deployment_hardening
  question: Are published vendor security patches, hotfixes, and critical vulnerability
    updates deployed within formal SLAs (Critical <= 14 days)?
  answer: 'Yes'
  result: compliant
  observation: Vendor security rollups deployed during monthly scheduled maintenance
    windows.
- requirement: data_exchange
  question: 'Does the application exchange data externally? (e.g., B2B transfers,
    automated API integrations, webhooks, or network communications with external
    partners, third-party vendors, or external services; Note: this excludes B2C interactions,
    as customers do not receive data the same way B2B partners do)'
  answer: 'Yes'
  result: compliant
  observation: Automated EDI order exchanges with logistics carriers.
- requirement: data_exchange
  question: Is there a data exchange contract with the appropriate confidentiality
    clauses? (e.g., formal Data Processing Agreement / DPA, Data Transfer Agreement
    / DTA, or NDA)
  answer: 'Yes'
  result: compliant
  observation: Standard EDI Data Transfer Agreements with confidentiality clauses
    in place.
- requirement: non_prod_data
  question: Are real production data records, live customer databases, or personal
    data utilized in non-production environments? (e.g., development/staging environments
    or QA databases)
  answer: Yes - Production data is copied or utilized for testing/staging
  result: compliant
  observation: Test staging environment utilizes masked production backups.
- requirement: non_prod_data
  question: 'How do you protect them? (Which sanitization or protection method is
    applied: cryptographic hashing, pseudonymisation, data masking / anonymization,
    or field-level encryption prior to ingestion)'
  answer: Masking / Anonymization
  result: compliant
  observation: Automated database anonymizer masks vendor names and financial account
    numbers.
- requirement: non_prod_data
  question: Do you clean the prod data after use in non-prod? (e.g., securely purging,
    sanitizing, or deleting production data once testing or troubleshooting activities
    conclude in non-production environments)
  answer: 'Yes'
  result: compliant
  observation: Staging databases are destroyed and re-seeded after user acceptance
    testing cycles.
- requirement: data_destruction
  question: Is there a data destruction process for this application? (e.g., documented
    data retention schedule and end-of-life purging procedures for self-hosted systems)
  answer: 'Yes'
  result: compliant
  observation: Documented 7-year statutory financial data retention and disposal procedure.
- requirement: data_destruction
  question: Is the process compliant with the policy (responsibilities, methods, reporting)?
    (e.g., defined stakeholder roles, approved cryptographic erasure or disposal methods,
    and verification certificates)
  answer: 'Yes'
  result: compliant
  observation: Compliant with corporate records management policy; audit log generated.
- requirement: secrets_management
  question: Are application credentials, API keys, and cryptographic secrets stored
    exclusively in a dedicated secrets manager rather than in code or configuration
    files?
  answer: 'Yes'
  result: compliant
  observation: COTS service accounts and DB credentials managed via CyberArk PAM vault.
- requirement: data_in_transit
  question: 'Is data encrypted during transit across external and internal network
    boundaries? (Specify protocols, algorithms and methods: e.g., TLS 1.2 / TLS 1.3
    with AES-GCM or ChaCha20, HTTPS with HSTS, mTLS for service APIs, SSHv2, or IPsec)'
  answer: 'Yes'
  result: compliant
  observation: TLS 1.2+ mandatory across all internal web consoles and database connections.
- requirement: data_at_rest
  question: 'Is data encrypted at rest? (Specify algorithms and key management: e.g.,
    AES-256 / AES-GCM across databases, object storage, file systems, disk volumes,
    and backups with centralized KMS, HSM, or TDE)'
  answer: 'Yes'
  result: compliant
  observation: SAN storage volumes encrypted with AES-256 and centralized key management.
- requirement: security_event_logging
  question: Does the application log key security events (failed logins, privilege
    escalation, administrative changes, access to sensitive assets)?
  answer: 'Yes'
  result: compliant
  observation: Syslog export of COTS security events, administrative logins, and batch
    jobs.
- requirement: security_event_logging
  question: Are sensitive data fields (passwords, payment cards, tokens, PII) systematically
    sanitized/masked from log outputs?
  answer: 'Yes'
  result: compliant
  observation: Log parsers sanitize any accidental sensitive fields before ingestion.
- requirement: centralized_monitoring_and_alerting
  question: Are application logs forwarded in near-real-time to a central SIEM/SOC
    platform with alerting rules for suspicious activities?
  answer: 'Yes'
  result: compliant
  observation: Events forwarded to internal SIEM with threshold alerts for repeated
    login failures.
- requirement: backup_and_disaster_recovery
  question: "Are automated and encrypted backups maintained for application state and databases?"
  answer: 'Yes'
  result: compliant
  observation: Nightly encrypted Veeam VM backups of application state and databases.
- requirement: backup_and_disaster_recovery
  question: "Are backup restoration and disaster recovery drills tested at least annually against documented RTO/RPO targets?"
  answer: 'Yes'
  result: compliant
  observation: Bi-annual disaster recovery restore drills validated against documented RTO and RPO targets.
- requirement: os_patching
  question: Are operating system (OS) security patches, kernel updates, and host/container
    security updates applied automatically within formal SLAs? (e.g. Critical <= 14
    days, High <= 30 days)
  answer: No - OS patching is not automatic
  result: compliant
  observation: Underlying Linux OS patched through monthly Ansible maintenance automation.
- requirement: os_patching
  question: If OS patching is not automatic, is there a formal patching schedule compliant
    with requirements? (e.g. documented recurring maintenance windows adhering to
    Critical <= 14 days, High <= 30 days)
  answer: 'Yes'
  result: compliant
  observation: Formal patching schedule complies with Critical <= 14 days and High
    <= 30 days.
- requirement: os_patching
  question: Does the application and infrastructure architecture allow no-downtime
    patching from a business perspective? (e.g., high-availability clusters, rolling
    updates, or blue-green deployments preventing business downtime during maintenance)
  answer: 'Yes'
  result: compliant
  observation: High-availability active-passive cluster allows rolling maintenance
    without downtime.
expected_evaluation:
  impact_level: 3
  confidentiality_impact: 3
  availability_impact: 3
  integrity_impact: 3
  scenario_count: 15
  excluded_scenarios:
  - API abuse and denial of service
  - Application compromise via injection attack
  - Application or storage compromise via unrestricted file upload
  - Compromise of CI/CD pipeline integrity and unreviewed code deployment
  - Compromise of cardholder data environment in SaaS service
  - Compromise of customer data via unmanaged mobile devices
  - Deployment of undetected code vulnerabilities due to missing security testing
  - Exploitation of unpatched SaaS vulnerability
  - Exploitation of unpatched vulnerability
  - Fourth-party vendor and sub-processor supply chain breach
  - Phishing and social engineering compromise of SaaS personnel
  - Physical unauthorized access and datacenter hardware tampering
  - Reliance on unverified SaaS security posture
  - SaaS application exploitation via unverified vendor SDLC
  - SaaS customer data exposure due to missing encryption or NDA safeguards
  - SaaS endpoint compromise and administrative credential theft
  - SaaS operational security compromise due to missing governance policies
  - SaaS provider data leakage
  - SaaS service disruption and catastrophic data loss
  - SaaS tenant isolation breach and cross-border leakage
  - SaaS tenant network perimeter breach and unauthorized egress
  - SaaS tenant takeover via unprotected administrative console
  - SaaS vendor privilege abuse and sub-processor leakage
  - SaaS web application transport and session exploitation
  - Session hijacking and token replay
  - Supply chain compromise via vulnerable dependency
  - Unlawful cross-border data transfer and residency non-compliance
  - Unmonitored SaaS security incidents and delayed breach detection
  - Unremediated SaaS security non-conformity and contractual remedy gap
