# ==============================================================================
# Application: App-Internal-Tool
# Profile: Developer Collaboration & Build Tool (Internal / Mixed Compliance)
# ==============================================================================
# This profile represents an internally-accessible developer tooling platform (e.g. Jenkins/Jira).
# It processes Internal-level memos and employee directory data with mixed compliance:
# strong transit encryption & non-prod hashing, but gaps in disk encryption and NDA.
# ==============================================================================

application:
  order: 3
  id: "app_internal_tool"
  name: "App-Internal-Tool"
  label: "App-Internal-Tool (Internal / Mixed Compliance)"
  description: "Medium classification (Internal) + Mixed compliance -> Scenario-dependent Risks"
  classification: "Internal"
  hosting: "SaaS"
  compliance_target: "Mixed"
  expected_risk: "Medium (Scenario-dependent)"
  framework_ref: "mls"
  framework_name: "Multi-level DPP"
  framework_yaml: "YML/newDPP.yml"
  user:
    email: "ian.internal@example-tool.com"
    first_name: "Ian"
    last_name: "Internal"
  tprm:
    criticality: 2
    maturity: 2
    trust: 2
    conclusion: "warning"

answers:
  # ----------------------------------------------------------------------------
  # Governance & Context
  # ----------------------------------------------------------------------------
  - requirement: "data_classification"
    question: "What is the maximum classification level handled?"
    answer: "Internal"
    result: "compliant"
    observation: "Internal company memos and employee directory"
    # Rationale: Internal classification (Impact Level 2) caps risk exposure at Medium.

  - requirement: "hosting"
    question: "What is the hosting model?"
    answer: "SaaS"
    result: "not_applicable"
    observation: "Enterprise SaaS vendor"

  # ----------------------------------------------------------------------------
  # Stakeholder Accountability
  # ----------------------------------------------------------------------------
  - requirement: "stakeholder_identification"
    question: "Is there a designated business contact?"
    answer: "Yes"
    result: "compliant"
    observation: "Product manager assigned"

  - requirement: "stakeholder_identification"
    question: "Is there a designated IT contact?"
    answer: "Yes"
    result: "compliant"
    observation: "DevOps engineer assigned"

  - requirement: "stakeholder_identification"
    question: "Is there a designated data owner?"
    answer: "No"
    result: "partially_compliant"
    observation: "Data owner not yet formalized"

  - requirement: "stakeholder_identification"
    question: "Is the information about stakeholders updated in LeanIX?"
    answer: "No"
    result: "partially_compliant"
    observation: "Pending LeanIX sync"
    # Score: 50% -> Likelihood 3 (Likely) -> Risk: Medium.

  # ----------------------------------------------------------------------------
  # Third-Party SaaS Contractual Governance
  # ----------------------------------------------------------------------------
  - requirement: "saas_contract_compliance"
    question: "Is there a signed SaaS contract?"
    answer: "Yes"
    result: "compliant"
    observation: "Standard enterprise agreement"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include an Audit clause?"
    answer: "No"
    result: "partially_compliant"
    observation: "SOC 2 report provided instead of direct audit"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include an Incident Notification process?"
    answer: "Yes"
    result: "compliant"
    observation: "72h breach notice"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include Strong IAM requirements?"
    answer: "Yes"
    result: "compliant"
    observation: "SSO with Okta"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include a Confidentiality agreement (NDA)?"
    answer: "No"
    result: "partially_compliant"
    observation: "Standard NDA not yet executed"
    # Score: 60% (3/5 clauses) -> Likelihood 2 (Rather unlikely) -> Risk: Low.

# ==============================================================================
# Expected Control Statuses (newDPP Framework)
# ==============================================================================
# Controls with score >= 100% -> active; score < 100% -> to_do
# ==============================================================================
expected_controls:
  - control: "Designate stakeholders"
    reference_control: "stakeholder_designation"
    requirement: "stakeholder_identification"
    score: 50
    status: "to_do" # 2/4 questions Yes (50%) -> to_do
    rationale: "Data owner and LeanIX synchronization missing."

  - control: "Identify the data classification level"
    reference_control: "identify_data_classification"
    requirement: "data_classification"
    score: 0
    status: "to_do"
    rationale: "Data classification registered as Internal."

  - control: "Sign a contract with the SaaS provider with all the adequate clauses"
    reference_control: "saas_contract"
    requirement: "saas_contract_compliance"
    score: 60
    status: "to_do" # 3/5 clauses (60%) -> to_do
    rationale: "SaaS agreement signed with IAM & Incident notice, but Audit and NDA missing."

# ==============================================================================
# Expected Risk Scenarios (newDPP Framework)
# ==============================================================================
# Only 2 in-scope scenarios evaluated for Internal SaaS tool.
# Impact Level: 2 (Internal). Out-of-scope Chapter 2 scenarios are omitted.
# ==============================================================================
expected_evaluation:
  impact_level: 2
  confidentiality_impact: 2
  availability_impact: 2
  scenario_count: 2
  excluded_scenarios:
    - "Exposure of unencrypted data in transit"
    - "Exposure of unencrypted data at rest"
    - "Disclosure of production data in non-production environments"
    - "Third-party data leakage"
    - "Excessive retention of sensitive data"

expected_risk_scenarios:
  - scenario: "SaaS provider data leakage"
    likelihood_requirement: "saas_contract_compliance"
    likelihood_score: 60
    scaled_likelihood: 2 # 2 - Rather unlikely
    scaled_impact: 2 # 2 - Significant (Internal)
    matrix_risk_id: 1 # 2 - Low
    risk_level: 2
    control_priority: 3 # 3 (Medium)

  - scenario: "Missing application stakeholders"
    likelihood_requirement: "stakeholder_identification"
    likelihood_score: 50
    scaled_likelihood: 3 # 3 - Likely
    scaled_impact: 2 # 2 - Significant (Internal)
    matrix_risk_id: 1 # 2 - Low
    risk_level: 2
    control_priority: 3 # 3 (Medium)

