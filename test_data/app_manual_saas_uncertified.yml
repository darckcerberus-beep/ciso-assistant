application:
  order: 21
  id: app_manual_saas_uncertified
  name: App-Manual-SaaS-Uncertified
  label: 'App-Manual-SaaS-Uncertified (Case 6: Uncertified SaaS / Secret / 100% Compliant)'
  description: Uncertified SaaS analytics provider evaluated via detailed contractual
    security track; demonstrates Case 6 conditional IG scoping (info, baseline, saas_app,
    saas_uncertified).
  classification: Secret
  hosting: SaaS
  compliance_target: 100%
  expected_risk: Low
  framework_ref: appsec_manual
  framework_name: Application Security Assessment Framework (AppSec - Manual IG)
  framework_yaml: YML/appsec_manual.yml
  user:
    email: viktor.uncert@example-saasuncert.cloud
    first_name: Viktor
    last_name: Vendor
  tprm:
    criticality: 4
    maturity: 4
    trust: 4
    conclusion: ok
  expected_implementation_groups:
  - info
  - baseline
  - saas_app
  - saas_uncertified
answers:
- requirement: application_description
  question: What is the primary functional domain and business purpose of the application?
  answer: Data Analytics, AI & Business Intelligence (data warehouse, ETL pipelines, reporting, ML models)
  result: compliant
  observation: Third-party cloud SaaS analytics service providing custom data analysis and reporting dashboards.
- requirement: application_description
  question: Who are the primary intended users or consumers of the application?
  answer: Internal workforce (employees, internal contractors)
  result: compliant
  observation: Internal operational and marketing analysts accessing vendor-hosted analytics portal.
- requirement: stakeholder_identification
  question: Is there a designated business contact? (Designated business owner or
    product sponsor accountable for business processes, functionality, and risk acceptance)
  answer: 'Yes'
  result: compliant
  observation: Chief Marketing Officer designated as business owner.
- requirement: stakeholder_identification
  question: Is there a designated IT contact? (Technical lead or engineer responsible
    for maintenance, infrastructure, deployment, and operational support)
  answer: 'Yes'
  result: compliant
  observation: Enterprise Vendor Risk Manager designated as technical contact.
- requirement: stakeholder_identification
  question: Is there a designated data owner? (Data steward or governance officer
    responsible for information classification, access authorization, and regulatory
    compliance)
  answer: 'Yes'
  result: compliant
  observation: Head of Regulatory & Privacy Compliance designated as data owner.
- requirement: stakeholder_identification
  question: Is the information about stakeholders updated in LeanIX / CMDB? (Stakeholder
    assignments registered and kept current in the enterprise inventory or service
    catalog)
  answer: 'Yes'
  result: compliant
  observation: Registered in LeanIX and third-party risk management register.
- requirement: data_classification
  question: What primary category of retail, commercial, or operational data is handled by the application?
  answer: Critical financial assets, secrets, or anti-fraud algorithms (e.g. customer payment cardholder data [PCI-DSS], refund bank accounts, production root credentials / API keys, fraud-detection evasion rules & thresholds)
  result: compliant
  observation: Secret market strategy data, proprietary customer demographics, and financial models.
- requirement: data_classification
  question: What would be the estimated business, legal, or operational impact if the application's data were exposed, breached, or leaked?
  answer: Catastrophic or existential impact (Direct financial theft, payment card brand sanctions/fines, critical legal liability, systemic loss of customer trust, or severe statutory penalties)
  result: compliant
  observation: Exposure causes existential financial loss and severe regulatory sanctions.
- requirement: data_classification
  question: What category of personal data is processed by the application under GDPR?
  answer: HR and financial details about employees and customer payment data
  result: compliant
  observation: Processes customer demographic profiles, financial accounts, and commercial transaction records.
- requirement: data_classification
  question: What is the volume of data subjects (individuals) whose personal data is processed?
  answer: High volume / Large scale processing under GDPR (More than 100,000 individuals, or systemic nationwide monitoring)
  result: compliant
  observation: Enterprise customer analytics covering over 150,000 active customer accounts.
- requirement: hosting
  question: What is the delivery and hosting model of the application?
  answer: SaaS (Third-party software hosted and operated by a vendor)
  result: compliant
  observation: Third-party cloud hosted SaaS analytics platform.
- requirement: hosting
  question: Is the SaaS vendor ISO/IEC 27001 or SOC 2 Type II certified?
  answer: No - The SaaS vendor is not ISO/IEC 27001 or SOC 2 Type II certified
  result: compliant
  observation: SaaS startup vendor is not ISO 27001 or SOC 2 Type II certified; requires
    detailed contractual assessment.
- requirement: authentication_and_mfa
  question: How do users authenticate to the application?
  answer: "Hybrid: Enterprise SSO for users, with local admin / break-glass or external accounts"
  result: compliant
  observation: "Hybrid authentication: Enterprise SSO for tenant users with break-glass admin accounts."
- requirement: authentication_and_mfa
  question: If direct or hybrid authentication is used, are strong password policies and brute-force lockout protections implemented for local accounts?
  answer: 'Yes'
  result: compliant
  observation: 16-character minimum password policy, lockout after 5 consecutive failures.
- requirement: authentication_and_mfa
  question: If direct or hybrid authentication is used, is Multi-Factor Authentication (MFA) enforced for all administrative, privileged, and break-glass access?
  answer: 'Yes'
  result: compliant
  observation: MFA enforced for all user accounts and administrative roles.
- requirement: access_control_and_rbac
  question: Have you defined roles and permissions for the application? (Is access
    controlled via granular roles (RBAC/ABAC) enforcing least privilege across all
    business functions and APIs?)
  answer: 'Yes'
  result: compliant
  observation: Granular roles within SaaS tenant enforcing strict least privilege.
- requirement: access_control_and_rbac
  question: Is the application integrated with the enterprise Identity Governance
    and Administration (IGA) solution (such as SailPoint) for centralized user lifecycle,
    role management, and automated provisioning/deprovisioning?
  answer: 'Yes'
  result: compliant
  observation: Integrated with enterprise directory for automated user provisioning.
- requirement: access_control_and_rbac
  question: Are user entitlements and privileged permissions reviewed and recertified
    on a periodic basis via formal recertification campaigns (e.g., SailPoint certification
    campaigns at least annually for standard users, biannually for privileged accounts)?
  answer: 'Yes'
  result: compliant
  observation: Quarterly user entitlement review executed by corporate security team.
- requirement: saas_contract_compliance
  question: Is there a signed SaaS contract and binding Security Schedule? (e.g.,
    legally executed Master Services Agreement / MSA and Security Exhibit with the
    provider)
  answer: 'Yes'
  result: compliant
  observation: Legally executed Master Services Agreement and custom detailed Security
    Schedule.
- requirement: saas_confidentiality_and_data_protection
  question: Does the contract require vendor personnel to sign confidentiality agreements
    (NDAs) and restrict access to customer data (e.g. requiring client approval before
    vendor support or engineering can access tenant data)?
  answer: 'Yes'
  result: compliant
  observation: Strict confidentiality clauses and NDAs covering all vendor personnel.
- requirement: saas_confidentiality_and_data_protection
  question: Does the contract mandate data encryption for all customer data, both
    in transit (e.g. TLS/HTTPS) and at rest (e.g. AES-256)?
  answer: 'Yes'
  result: compliant
  observation: Contract mandates AES-256 encryption at rest and TLS 1.3 in transit.
- requirement: saas_iam
  question: Does root, administrative, and break-glass access to the SaaS tenant management
    console strictly enforce Multi-Factor Authentication (MFA) independently of standard
    user SSO?
  answer: 'Yes'
  result: compliant
  observation: SaaS console enforces hardware token MFA for all administrative access.
- requirement: saas_data_hosting_and_residency
  question: Does the contract mandate that all customer data (including primary databases,
    processing pipelines, and backups) be hosted primarily within the European Union
    (EU) or European Economic Area (EEA)?
  answer: 'Yes'
  result: compliant
  observation: Contract legally binds data residency exclusively to EU datacenter
    regions.
- requirement: saas_data_hosting_and_residency
  question: Is a formal Data Processing Agreement (DPA) executed with the vendor that incorporates all mandatory GDPR Article 28 clauses (processing only on documented instructions, personnel confidentiality commitments, and statutory security measures)?
  answer: 'Yes'
  result: compliant
  observation: Executed Data Processing Addendum (DPA) incorporating all mandatory GDPR Article 28 requirements.
- requirement: saas_data_hosting_and_residency
  question: Does the contract mandate prior written authorization or advance notice before engaging or replacing sub-processors, granting the customer a legally enforceable right to object or terminate?
  answer: 'Yes'
  result: compliant
  observation: Vendor is contractually obligated to provide 30-day advance notice for any sub-processor change with customer objection and contract termination rights.
- requirement: saas_data_hosting_and_residency
  question: Does the contract or DPA establish a binding obligation for the vendor to notify the customer without undue delay (within 24 to 48 hours maximum) following the discovery of a suspected or confirmed personal data breach?
  answer: 'Yes'
  result: compliant
  observation: Binding contractual commitment to notify customer security operations within 24 to 48 hours of any suspected or confirmed breach.
- requirement: saas_data_hosting_and_residency
  question: Does the vendor provide technical mechanisms or contractual commitments to assist the customer in fulfilling Data Subject Rights (access, rectification, erasure, portability) and ensure complete data deletion or return upon contract termination?
  answer: 'Yes'
  result: compliant
  observation: Platform includes self-service GDPR export and erasure tools, with contractual commitment to certify data deletion upon termination.
- requirement: saas_audit_and_compliance
  question: Does the contract legally grant the client (or an authorized independent
    third party) the right to audit the provider and obtain compliance evidence to
    verify adherence to contractual security obligations?
  answer: 'Yes'
  result: compliant
  observation: Contract explicitly grants customer right to conduct on-site or remote
    security audits.
- requirement: saas_audit_and_compliance
  question: How is independent penetration testing governed and performed on the SaaS
    platform?
  answer: We are allowed to pentest (SaaS contract authorizes customer-led penetration
    testing)
  result: compliant
  observation: Contract authorizes customer-led penetration testing annually.
- requirement: saas_pci_dss
  question: Is the application or service in scope for PCI DSS? (e.g., processes,
    stores, or transmits cardholder data, connects to the Cardholder Data Environment,
    or can impact the security of the CDE)
  answer: No - Out of scope / Not applicable
  result: compliant
  observation: Out of scope for PCI DSS (no payment card data processed).
- requirement: saas_non_conformity_remediation
  question: Does the contract mandate formal remediation plans and compensatory measures
    for identified security gaps, with explicit rights to suspend access or terminate
    for repeated breaches?
  answer: 'Yes'
  result: compliant
  observation: Contract specifies binding remediation plans and right of immediate
    contract termination.
- requirement: saas_governance_and_policy
  question: Does the contract require the provider to maintain an Information Security
    Policy based on a recognized framework (such as ISO 27001), updated at least annually?
  answer: 'Yes'
  result: compliant
  observation: Contract mandates documented information security policy aligned with
    ISO 27001.
- requirement: saas_governance_and_policy
  question: Does the contract require the provider to maintain an active Information
    Security Management System (ISMS) and perform risk analyses at least annually?
  answer: 'Yes'
  result: compliant
  observation: Vendor legally required to maintain ISMS and annual risk analysis.
- requirement: saas_security_awareness
  question: Does the contract require vendor personnel to be trained and sensitized
    to cybersecurity risks, data breaches, and non-compliance consequences at least
    annually?
  answer: 'Yes'
  result: compliant
  observation: Contract requires all vendor personnel to complete annual security
    awareness training.
- requirement: saas_security_awareness
  question: Does the contract require formal security incident reporting procedures
    to be disseminated and maintained accessible to all staff?
  answer: 'Yes'
  result: compliant
  observation: Formal incident reporting procedures documented and accessible to all
    vendor staff.
- requirement: saas_entitlements_and_privileges
  question: Does the contract require the provider to apply least privilege and Role-Based
    Access Control (RBAC), restricting admin rights and maintaining an inventory of
    privileged accounts across its internal personnel?
  answer: 'Yes'
  result: compliant
  observation: Contract enforces strict internal RBAC and privileged inventory on
    vendor side.
- requirement: saas_entitlements_and_privileges
  question: Does the contract require the provider to conduct periodic access reviews
    and recertifications of its internal personnel granted privileged or operational
    access to tenant data and infrastructure?
  answer: 'Yes'
  result: compliant
  observation: Vendor must conduct periodic access recertification of internal staff
    with access to customer tenant.
- requirement: saas_logging_and_incidents
  question: Does the contract require the SaaS solution to record tamper-resistant
    logs of logins, logouts, access, and administrative actions, with continuous monitoring
    and audit telemetry export into the client SIEM?
  answer: 'Yes'
  result: compliant
  observation: Contract mandates tamper-resistant logging and continuous audit telemetry
    feed into customer SIEM.
- requirement: saas_logging_and_incidents
  question: Does the contract legally bind the provider to notify the client of any
    security incident or anomaly within a maximum of 48 hours of discovery?
  answer: 'Yes'
  result: compliant
  observation: Contract legally binds vendor to notify customer within 48 hours of
    any security incident.
- requirement: saas_workstation_security
  question: Does the contract require provider workstations to be protected by session
    auto-lock after inactivity, active local firewalls, hardened configurations, and
    updated EDR/antivirus?
  answer: 'Yes'
  result: compliant
  observation: Contract requires provider workstations to have auto-lock, firewall,
    and updated EDR.
- requirement: saas_workstation_security
  question: Does the contract require all workstations and removable media to be fully
    encrypted, governed by patch management and a formal lost/compromised equipment
    procedure?
  answer: 'Yes'
  result: compliant
  observation: Mandatory full-disk encryption on all provider developer laptops.
- requirement: saas_mobile_security
  question: Does the contract require mobile devices accessing the service to be governed
    by a formal MDM policy with mandatory device encryption, remote wipe capabilities,
    and controlled data synchronization?
  answer: 'Yes'
  result: compliant
  observation: Contract mandates MDM enrollment, encryption, and remote wipe for mobile
    devices.
- requirement: saas_network_security
  question: Does the contract require the provider to enforce a formal network security
    policy with strict ingress/egress filtering, anti-DDoS and WAF protections (e.g.
    Cloudflare, or competitor services such as AWS WAF & Shield, Google Cloud Armor,
    Azure WAF, Akamai, Fastly, Imperva), secure Wi-Fi, and protected remote access
    (VPN/ZTNA)?
  answer: 'Yes'
  result: compliant
  observation: Strict ingress/egress filtering, anti-DDoS, and Cloudflare WAF mandated
    by contract.
- requirement: saas_environment_isolation
  question: Does the contract require the SaaS architecture to enforce robust logical
    or physical client environment isolation, traffic filtering, and antimalware defenses?
  answer: 'Yes'
  result: compliant
  observation: Contract legally requires robust logical tenant isolation and VPC segmentation.
- requirement: saas_secure_development
  question: Does the contract require source code to be stored in secure repositories
    with mandatory peer reviews and strict segregation between development, test,
    and production environments?
  answer: 'Yes'
  result: compliant
  observation: Contract mandates peer code review and segregation between dev and
    prod environments.
- requirement: saas_secure_development
  question: Does the contract mandate that the provider adheres to formal secure SDLC
    standards (e.g., OWASP SAMM, ISO/IEC 27034), with mandatory developer secure coding
    training, automated pipeline security gates (SAST/SCA), and software supply chain
    integrity controls?
  answer: 'Yes'
  result: compliant
  observation: Contract requires vendor to follow OWASP SAMM with automated SAST/SCA
    in pipeline.
- requirement: saas_web_app_security
  question: Does the contract require web services to be protected with TLS 1.2+ minimum,
    network ports restricted to the strict minimum, and administrative interfaces
    strictly controlled?
  answer: 'Yes'
  result: compliant
  observation: Contract requires TLS 1.2+, minimal ports open, and admin console access
    restriction.
- requirement: saas_vulnerability_remediation_sla
  question: Does the SaaS contract commit the provider to formal vulnerability remediation
    SLAs (e.g. Critical within 7 days, High within 30 days)?
  answer: 'Yes'
  result: compliant
  observation: Contractually bound to Critical <= 7 days and High <= 30 days vulnerability
    remediation SLAs.
- requirement: saas_physical_security
  question: Does the contract require provider facilities and datacenters to be secured
    with badge access controls, sensitive zone restrictions, trace logging, and regular
    physical access reviews?
  answer: 'Yes'
  result: compliant
  observation: Contract mandates datacenter badge access control, CCTV, and physical
    access reviews.
- requirement: saas_backup_and_business_continuity
  question: Does the contract require automated backups to be encrypted, immutable,
    and verified through regular documented restoration tests?
  answer: 'Yes'
  result: compliant
  observation: Contract requires automated encrypted backups with documented restoration
    tests.
- requirement: saas_backup_and_business_continuity
  question: Does the contract require the provider to maintain documented BCP/DRP
    plans tested at least annually, with contractually defined RTO and RPO targets?
  answer: 'Yes'
  result: compliant
  observation: Contract mandates annual BCP/DRP testing with RTO <= 4 hours and RPO
    <= 1 hour.
- requirement: saas_subcontractor_management
  question: Does the contract require the vendor to vet subcontractors, provide prior
    notice of new sub-processors with a right to object, and assume full liability
    for all downstream subcontractors?
  answer: 'Yes'
  result: compliant
  observation: Prior notice of new sub-processors required with right to object and
    full downstream liability.
- requirement: saas_subcontractor_management
  question: Does the contract explicitly prohibit the provider and its sub-processors
    from using customer data to train or fine-tune AI/ML models without prior written
    customer authorization?
  answer: 'Yes'
  result: compliant
  observation: Contract explicitly forbids using customer data for training AI/ML
    models without prior consent.
expected_evaluation:
  impact_level: 4
  confidentiality_impact: 4
  availability_impact: 4
  integrity_impact: 4
  scenario_count: 24
  excluded_scenarios:
  - API abuse and denial of service
  - Application compromise via injection attack
  - Application or storage compromise via unrestricted file upload
  - Catastrophic data loss due to unverified backups
  - Compromise of CI/CD pipeline integrity and unreviewed code deployment
  - Compromise via unhardened or End-of-Life (EOL) COTS deployment
  - Credential leakage via hardcoded secrets
  - Deployment of undetected code vulnerabilities due to missing security testing
  - Deployment of vulnerable commercial software due to unverified vendor SDLC
  - Disclosure of production data in non-production environments
  - Excessive retention of sensitive data
  - Exploitation of unpatched vulnerability
  - Exposure of unencrypted data at rest
  - Exposure of unencrypted data in transit
  - Host or OS compromise via unpatched system vulnerabilities
  - Sensitive data exposure in logs or missing forensic audit trail
  - Session hijacking and token replay
  - Supply chain compromise via vulnerable dependency
  - Third-party data leakage
  - Undetected breach due to missing security logging
