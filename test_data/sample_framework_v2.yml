urn: urn:intuitem:risk:library:sample-baseline
locale: en
ref_id: sample-baseline
name: Sample Security Baseline
description: Minimal security baseline framework demonstrating versioning and updates
copyright: intuitem
version: 2
publication_date: '2026-11-16'
provider: Demo
packager: Demo
objects:
  framework:
    urn: urn:intuitem:risk:framework:sample-baseline
    ref_id: sample-baseline
    name: Sample Security Baseline
    description: Minimal baseline for demonstration
    min_score: 0
    max_score: 100
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:sample-baseline:ac
      assessable: false
      depth: 1
      ref_id: AC
      name: Access Control
    - urn: urn:intuitem:risk:req_node:sample-baseline:ac.01
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:sample-baseline:ac
      ref_id: AC.01
      name: Multi-Factor Authentication
      description: Enforce multi-factor authentication across all applications.
      questions:
        urn:intuitem:risk:req_node:sample-baseline:ac.01:q_mfa:
          type: unique_choice
          text: Is Multi-Factor Authentication (MFA) required across all accounts?
          choices:
          - urn: urn:intuitem:risk:req_node:sample-baseline:ac.01:q_mfa:c_yes
            value: Yes - Enforced for all
            add_score: 100
            compute_result: true
            color: '#28a745'
          - urn: urn:intuitem:risk:req_node:sample-baseline:ac.01:q_mfa:c_no
            value: No - Password only
            add_score: 0
            compute_result: true
            color: '#dc3545'
    - urn: urn:intuitem:risk:req_node:sample-baseline:bk
      assessable: false
      depth: 1
      ref_id: BK
      name: Backup and Resilience
    - urn: urn:intuitem:risk:req_node:sample-baseline:bk.01
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:sample-baseline:bk
      ref_id: BK.01
      name: Automated Backups
      description: Regular automated data backups must be performed and tested.
      questions:
        urn:intuitem:risk:req_node:sample-baseline:bk.01:q1:
          type: unique_choice
          text: What is the backup frequency for production data?
          choices:
          - urn: urn:intuitem:risk:req_node:sample-baseline:bk.01:q1:c1
            value: Daily automated backups
            add_score: 100
            compute_result: true
            color: '#28a745'
          - urn: urn:intuitem:risk:req_node:sample-baseline:bk.01:q1:c2
            value: Weekly or ad-hoc
            add_score: 50
            compute_result: true
            color: '#ffc107'
          - urn: urn:intuitem:risk:req_node:sample-baseline:bk.01:q1:c3
            value: No regular backups
            add_score: 0
            compute_result: true
            color: '#dc3545'
        urn:intuitem:risk:req_node:sample-baseline:bk.01:q2:
          type: unique_choice
          text: Are backup restoration tests performed at least quarterly?
          choices:
          - urn: urn:intuitem:risk:req_node:sample-baseline:bk.01:q2:c1
            value: Yes - Tested quarterly
            add_score: 100
            compute_result: true
            color: '#28a745'
          - urn: urn:intuitem:risk:req_node:sample-baseline:bk.01:q2:c2
            value: No regular restoration tests
            add_score: 0
            compute_result: true
            color: '#dc3545'
    - urn: urn:intuitem:risk:req_node:sample-baseline:ir
      assessable: false
      depth: 1
      ref_id: IR
      name: Incident Response
    - urn: urn:intuitem:risk:req_node:sample-baseline:ir.01
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:sample-baseline:ir
      ref_id: IR.01
      name: Incident Response Plan
      description: A documented incident response plan must be maintained.
      questions:
        urn:intuitem:risk:req_node:sample-baseline:ir.01:q1:
          type: unique_choice
          text: Is there a documented and tested incident response plan?
          choices:
          - urn: urn:intuitem:risk:req_node:sample-baseline:ir.01:q1:c1
            value: Yes
            add_score: 100
            compute_result: true
            color: '#28a745'
          - urn: urn:intuitem:risk:req_node:sample-baseline:ir.01:q1:c2
            value: No
            add_score: 0
            compute_result: true
            color: '#dc3545'
