# ==============================================================================
# Application: App-AppSec-Hybrid-SaaS
# Profile: Uncertified Cloud Analytics SaaS (Confidential / SaaS / ~65% Compliant)
# ==============================================================================
# This profile represents a moderately secured SaaS business analytics platform
# whose vendor is not yet ISO 27001 or SOC 2 Type II certified (activating the
# saas_uncertified track in addition to info, baseline, and saas_app).
# Demonstrates partial compliance with solid baseline contracts and isolation,
# but gaps in encryption clauses, vendor staff access reviews, remediation SLAs,
# and audit rights.
# ==============================================================================

application:
  order: 15
  id: "app_appsec_hybrid_saas"
  name: "App-AppSec-Hybrid-SaaS"
  label: "App-AppSec-Hybrid-SaaS (Confidential / SaaS Cloud / 65% Compliant / Medium Risk)"
  description: "Cloud-native SaaS business analytics platform from an uncertified vendor; solid baseline contract and tenant isolation but moderate vendor security governance gaps."
  classification: "Confidential"
  hosting: "SaaS"
  compliance_target: "65%"
  expected_risk: "Medium"
  framework_ref: "appsec"
  framework_name: "Application Security Assessment Framework (AppSec)"
  framework_yaml: "YML/appsec.yml"
  user:
    email: "sarah.analytics@example-saas.com"
    first_name: "Sarah"
    last_name: "CloudAnalytics"
  tprm:
    criticality: 3
    maturity: 2
    trust: 2
    conclusion: "warning"

answers:
  # ============================================================================
  # CHAPTER 1: APPLICATION INFORMATION & GOVERNANCE (IG: info)
  # ============================================================================

  - requirement: "application_description"
    question: "What is the primary functional domain and business purpose of the application?"
    answer: "Data Analytics, AI & Business Intelligence (data warehouse, ETL pipelines, reporting, ML models)"
    result: "compliant"
    observation: "Cloud-native SaaS business analytics platform delivering executive reporting and operational business intelligence."

  - requirement: "application_description"
    question: "Who are the primary intended users or consumers of the application?"
    answer: "Internal workforce (employees, internal contractors)"
    result: "compliant"
    observation: "Utilized by internal data analysts, business leads, and corporate leadership."

  - requirement: "stakeholder_identification"
    question: "Is there a designated business contact? (Designated business owner or product sponsor accountable for business processes, functionality, and risk acceptance)"
    answer: "Yes"
    result: "compliant"
    observation: "VP of Product Analytics designated as primary business owner."

  - requirement: "stakeholder_identification"
    question: "Is there a designated IT contact? (Technical lead or engineer responsible for maintenance, infrastructure, deployment, and operational support)"
    answer: "Yes"
    result: "compliant"
    observation: "Lead DevOps Engineer assigned as technical owner."

  - requirement: "stakeholder_identification"
    question: "Is there a designated data owner? (Data steward or governance officer responsible for information classification, access authorization, and regulatory compliance)"
    answer: "Yes"
    result: "compliant"
    observation: "Head of Data Governance identified as data owner."

  - requirement: "stakeholder_identification"
    question: "Is the information about stakeholders updated in LeanIX / CMDB? (Stakeholder assignments registered and kept current in the enterprise inventory or service catalog)"
    answer: "No"
    result: "non_compliant"
    observation: "LeanIX mapping out of date since last organizational restructuring."

  - requirement: "data_classification"
    question: "What is the maximum classification level handled? (Public, Internal, Confidential, or Secret according to organizational data classification policy)"
    answer: "Confidential"
    result: "compliant"
    observation: "Processes confidential customer business intelligence and revenue analytics data. Impact Level 3."

  - requirement: "data_classification"
    question: "What category of personal data is processed by the application under GDPR?"
    answer: "Contact and order details about customers"
    result: "compliant"
    observation: "Processes customer business analytics, commercial records, and behavioral engagement data."

  - requirement: "data_classification"
    question: "What is the volume of data subjects (individuals) whose personal data is processed?"
    answer: "Medium volume (1,000 to 100,000 individuals / data subjects)"
    result: "compliant"
    observation: "Customer analytics database covering approximately 50,000 customer data subjects."

  - requirement: "hosting"
    question: "What is the delivery and hosting model of the application?"
    answer: "SaaS (Third-party software hosted and operated by a vendor)"
    result: "compliant"
    observation: "Hosted on multi-tenant Google Cloud Platform (GCP) SaaS infrastructure operated by third-party vendor."

  - requirement: "hosting"
    question: "Is the SaaS vendor ISO/IEC 27001 or SOC 2 Type II certified?"
    answer: "No - The SaaS vendor is not ISO/IEC 27001 or SOC 2 Type II certified"
    result: "compliant"
    observation: "Vendor has not yet completed ISO 27001 or SOC 2 Type II certification; detailed SaaS vendor track triggered."

  # ============================================================================
  # CHAPTER 2: IDENTITY, AUTHENTICATION & ACCESS CONTROL (IG: baseline)
  # ============================================================================

  - requirement: "authentication_and_mfa"
    question: "How do users authenticate to the application?"
    answer: "Direct / Local application authentication only (Username & Password)"
    result: "non_compliant"
    observation: "Enterprise SSO federation requires an enterprise tier upgrade; currently using direct application authentication."

  - requirement: "authentication_and_mfa"
    question: "If direct or hybrid authentication is used, are strong password policies and brute-force lockout protections implemented for local accounts?"
    answer: "No"
    result: "non_compliant"
    observation: "Basic password policy enforced but automated rate-limiting lockout is not enabled on login endpoints."

  - requirement: "authentication_and_mfa"
    question: "If direct or hybrid authentication is used, is Multi-Factor Authentication (MFA) enforced for all administrative, privileged, and break-glass access?"
    answer: "Yes"
    result: "compliant"
    observation: "TOTP Multi-Factor Authentication enforced for all tenant administrators."

  - requirement: "access_control_and_rbac"
    question: "Have you defined roles and permissions for the application? (Is access controlled via granular roles (RBAC/ABAC) enforcing least privilege across all business functions and APIs?)"
    answer: "Yes"
    result: "compliant"
    observation: "Role-Based Access Control implemented separating Viewer, Editor, and Organization Admin roles."

  - requirement: "access_control_and_rbac"
    question: "Is the application integrated with the enterprise Identity Governance and Administration (IGA) solution (such as SailPoint) for centralized user lifecycle, role management, and automated provisioning/deprovisioning?"
    answer: "No"
    result: "non_compliant"
    observation: "Direct enterprise IGA / SailPoint connector is planned on roadmap but not yet implemented."

  - requirement: "access_control_and_rbac"
    question: "Are user entitlements and privileged permissions reviewed and recertified on a periodic basis via formal recertification campaigns (e.g., SailPoint certification campaigns at least annually for standard users, biannually for privileged accounts)?"
    answer: "No"
    result: "non_compliant"
    observation: "Periodic user access recertification is not formalized in SailPoint or tracked."

  # ============================================================================
  # CHAPTER 10: THIRD-PARTY SAAS GOVERNANCE (IGs: saas_app, saas_uncertified)
  # ============================================================================

  - requirement: "saas_contract_compliance"
    question: "Is there a signed SaaS contract and binding Security Schedule? (e.g., legally executed Master Services Agreement / MSA and Security Exhibit with the provider)"
    answer: "Yes"
    result: "compliant"
    observation: "Executed SaaS subscription agreement and baseline Security Exhibit."

  - requirement: "saas_governance_and_policy"
    question: "Does the contract require the provider to maintain an Information Security Policy based on a recognized framework (such as ISO 27001), updated at least annually?"
    answer: "Yes"
    result: "compliant"
    observation: "Vendor maintains an internal Information Security Policy aligned with ISO 27001."

  - requirement: "saas_governance_and_policy"
    question: "Does the contract require the provider to maintain an active Information Security Management System (ISMS) and perform risk analyses at least annually?"
    answer: "Yes"
    result: "compliant"
    observation: "Annual internal risk assessment and ISMS management review documented by vendor CISO."

  - requirement: "saas_confidentiality_and_data_protection"
    question: "Does the contract require vendor personnel to sign confidentiality agreements (NDAs) and restrict access to customer data (e.g. requiring client approval before vendor support or engineering can access tenant data)?"
    answer: "Yes"
    result: "compliant"
    observation: "Vendor employees sign binding NDAs upon hire; support access requires customer ticket approval."

  - requirement: "saas_confidentiality_and_data_protection"
    question: "Does the contract mandate data encryption for all customer data, both in transit (e.g. TLS/HTTPS) and at rest (e.g. AES-256)?"
    answer: "No"
    result: "non_compliant"
    observation: "Contract specifies TLS in transit but lacks an explicit contractual mandate for AES-256 encryption at rest across all secondary analytics staging stores."

  - requirement: "saas_security_awareness"
    question: "Does the contract require vendor personnel to be trained and sensitized to cybersecurity risks, data breaches, and non-compliance consequences at least annually?"
    answer: "Yes"
    result: "compliant"
    observation: "Annual security awareness training mandatory for all vendor staff."

  - requirement: "saas_security_awareness"
    question: "Does the contract require formal security incident reporting procedures to be disseminated and maintained accessible to all staff?"
    answer: "Yes"
    result: "compliant"
    observation: "Internal incident response playbooks published on vendor intranet."

  - requirement: "saas_iam"
    question: "Does root, administrative, and break-glass access to the SaaS tenant management console strictly enforce Multi-Factor Authentication (MFA) independently of standard user SSO?"
    answer: "Yes"
    result: "compliant"
    observation: "Mandatory MFA enforced on the SaaS tenant admin console."

  - requirement: "saas_entitlements_and_privileges"
    question: "Does the contract require the provider to apply least privilege and Role-Based Access Control (RBAC), restricting admin rights and maintaining an inventory of privileged accounts across its internal personnel?"
    answer: "Yes"
    result: "compliant"
    observation: "Provider enforces internal RBAC for production cloud administration."

  - requirement: "saas_entitlements_and_privileges"
    question: "Does the contract require the provider to conduct periodic access reviews and recertifications of its internal personnel granted privileged or operational access to tenant data and infrastructure?"
    answer: "No"
    result: "non_compliant"
    observation: "Contract does not obligate the provider to perform formal periodic access recertifications of its internal engineering staff."

  - requirement: "saas_logging_and_incidents"
    question: "Does the contract require the SaaS solution to record tamper-resistant logs of logins, logouts, access, and administrative actions, with continuous monitoring and audit telemetry export into the client SIEM?"
    answer: "Yes"
    result: "compliant"
    observation: "SaaS platform records immutable tenant audit logs accessible via API."

  - requirement: "saas_logging_and_incidents"
    question: "Does the contract legally bind the provider to notify the client of any security incident or anomaly within a maximum of 48 hours of discovery?"
    answer: "No"
    result: "non_compliant"
    observation: "Standard incident notification window is 'without undue delay' (72 hours) rather than a strict 48-hour SLA."

  - requirement: "saas_workstation_security"
    question: "Does the contract require provider workstations to be protected by session auto-lock after inactivity, active local firewalls, hardened configurations, and updated EDR/antivirus?"
    answer: "Yes"
    result: "compliant"
    observation: "Vendor fleet managed with CrowdStrike Falcon EDR and automatic screen lock."

  - requirement: "saas_workstation_security"
    question: "Does the contract require all workstations and removable media to be fully encrypted, governed by patch management and a formal lost/compromised equipment procedure?"
    answer: "Yes"
    result: "compliant"
    observation: "Full-disk encryption (FileVault / BitLocker) enforced across all vendor laptops."

  - requirement: "saas_mobile_security"
    question: "Does the contract require mobile devices accessing the service to be governed by a formal MDM policy with mandatory device encryption, remote wipe capabilities, and controlled data synchronization?"
    answer: "Yes"
    result: "compliant"
    observation: "Mobile devices governed via enterprise MDM with containerization and remote wipe."

  - requirement: "saas_network_security"
    question: "Does the contract require the provider to enforce a formal network security policy with strict ingress/egress filtering, anti-DDoS and WAF protections (e.g. Cloudflare, or competitor services such as AWS WAF & Shield, Google Cloud Armor, Azure WAF, Akamai, Fastly, Imperva), secure Wi-Fi, and protected remote access (VPN/ZTNA)?"
    answer: "Yes"
    result: "compliant"
    observation: "Protected by Google Cloud Armor WAF/DDoS and ZTNA corporate access."

  - requirement: "saas_environment_isolation"
    question: "Does the contract require the SaaS architecture to enforce robust logical or physical client environment isolation, traffic filtering, and antimalware defenses?"
    answer: "Yes"
    result: "compliant"
    observation: "Strict tenant-level logical isolation enforced at database and storage layers."

  - requirement: "saas_secure_development"
    question: "Does the contract require source code to be stored in secure repositories with mandatory peer reviews and strict segregation between development, test, and production environments?"
    answer: "Yes"
    result: "compliant"
    observation: "Vendor enforces GitHub branch protection, peer reviews, and isolated dev/staging/prod GCP projects."

  - requirement: "saas_secure_development"
    question: "Does the contract mandate that the provider adheres to formal secure SDLC standards (e.g., OWASP SAMM, ISO/IEC 27034), with mandatory developer secure coding training, automated pipeline security gates (SAST/SCA), and software supply chain integrity controls?"
    answer: "No"
    result: "non_compliant"
    observation: "Vendor performs SAST/SCA but has no formal contractual commitment to OWASP SAMM or supply chain SBOM attestation."

  - requirement: "saas_web_app_security"
    question: "Does the contract require web services to be protected with TLS 1.2+ minimum, network ports restricted to the strict minimum, and administrative interfaces strictly controlled?"
    answer: "Yes"
    result: "compliant"
    observation: "TLS 1.2/1.3 enforced on all web endpoints with HSTS."

  - requirement: "saas_vulnerability_remediation_sla"
    question: "Does the SaaS contract commit the provider to formal vulnerability remediation SLAs (e.g. Critical within 7 days, High within 30 days)?"
    answer: "No"
    result: "non_compliant"
    observation: "Vendor uses best-effort patching targets without binding contractual remediation SLAs."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the contract mandate that all customer data (including primary databases, processing pipelines, and backups) be hosted primarily within the European Union (EU) or European Economic Area (EEA)?"
    answer: "Yes"
    result: "compliant"
    observation: "Customer tenant pinned to GCP europe-west1 (Belgium) and europe-west3 (Frankfurt)."

  - requirement: "saas_data_hosting_and_residency"
    question: "Is a formal Data Processing Agreement (DPA) executed with the vendor that incorporates all mandatory GDPR Article 28 clauses (processing only on documented instructions, personnel confidentiality commitments, and statutory security measures)?"
    answer: "Yes"
    result: "compliant"
    observation: "Executed Data Processing Addendum (DPA) incorporating all mandatory GDPR Article 28 requirements."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the contract mandate prior written authorization or advance notice before engaging or replacing sub-processors, granting the customer a legally enforceable right to object or terminate?"
    answer: "Yes"
    result: "compliant"
    observation: "Vendor is contractually obligated to provide 30-day advance notice for any sub-processor change with customer objection and contract termination rights."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the contract or DPA establish a binding obligation for the vendor to notify the customer without undue delay (within 24 to 48 hours maximum) following the discovery of a suspected or confirmed personal data breach?"
    answer: "Yes"
    result: "compliant"
    observation: "Binding contractual commitment to notify customer security operations within 24 to 48 hours of any suspected or confirmed breach."

  - requirement: "saas_data_hosting_and_residency"
    question: "Does the vendor provide technical mechanisms or contractual commitments to assist the customer in fulfilling Data Subject Rights (access, rectification, erasure, portability) and ensure complete data deletion or return upon contract termination?"
    answer: "Yes"
    result: "compliant"
    observation: "Platform includes self-service GDPR export and erasure tools, with contractual commitment to certify data deletion upon termination."

  - requirement: "saas_physical_security"
    question: "Does the contract require provider facilities and datacenters to be secured with badge access controls, sensitive zone restrictions, trace logging, and regular physical access reviews?"
    answer: "Yes"
    result: "compliant"
    observation: "Hosted exclusively in Tier IV Google Cloud datacenters with ISO 27001 physical security."

  - requirement: "saas_backup_and_business_continuity"
    question: "Does the contract require automated backups to be encrypted, immutable, and verified through regular documented restoration tests?"
    answer: "Yes"
    result: "compliant"
    observation: "Automated daily encrypted snapshots with cross-region replication."

  - requirement: "saas_backup_and_business_continuity"
    question: "Does the contract require the provider to maintain documented BCP/DRP plans tested at least annually, with contractually defined RTO and RPO targets?"
    answer: "Yes"
    result: "compliant"
    observation: "Annual DR exercises conducted with contractual RTO <= 8h and RPO <= 1h."

  - requirement: "saas_subcontractor_management"
    question: "Does the contract require the vendor to vet subcontractors, provide prior notice of new sub-processors with a right to object, and assume full liability for all downstream subcontractors?"
    answer: "Yes"
    result: "compliant"
    observation: "DPA includes sub-processor notification list and 30-day right to object."

  - requirement: "saas_subcontractor_management"
    question: "Does the contract explicitly prohibit the provider and its sub-processors from using customer data to train or fine-tune AI/ML models without prior written customer authorization?"
    answer: "No"
    result: "non_compliant"
    observation: "Contract lacks an explicit AI/ML training opt-out clause for aggregated telemetry."

  - requirement: "saas_audit_and_compliance"
    question: "Does the contract legally grant the client (or an authorized independent third party) the right to audit the provider and obtain compliance evidence to verify adherence to contractual security obligations?"
    answer: "No"
    result: "non_compliant"
    observation: "Standard subscription terms do not include an on-site client right-to-audit clause."

  - requirement: "saas_audit_and_compliance"
    question: "How is independent penetration testing governed and performed on the SaaS platform?"
    answer: "The SaaS vendor does the pentest (contract mandates that the vendor undergoes annual independent penetration tests and provides audit reports/attestations)"
    result: "compliant"
    observation: "Third-party penetration test conducted in April 2026; executive summary shared under NDA."

  - requirement: "saas_pci_dss"
    question: "Is the application or service in scope for PCI DSS? (e.g., processes, stores, or transmits cardholder data, connects to the Cardholder Data Environment, or can impact the security of the CDE)"
    answer: "No - Out of scope / Not applicable"
    result: "compliant"
    observation: "Business analytics platform does not process, store, or transmit payment card data."

  - requirement: "saas_non_conformity_remediation"
    question: "Does the contract mandate formal remediation plans and compensatory measures for identified security gaps, with explicit rights to suspend access or terminate for repeated breaches?"
    answer: "Yes"
    result: "compliant"
    observation: "Contract includes breach cure periods and termination rights for uncured material security breaches."

# ==============================================================================
# Expected Risk Scenarios & Evaluation (AppSec Framework)
# ==============================================================================
# Uncertified SaaS Application (IGs: info, baseline, saas_app, saas_uncertified) -> 10 in-scope scenarios.
# Impact Level: 3 (Confidential).
# Scenarios vary across Likelihood 1, 2, 3, 4 based on requirement scores:
# - Likelihood 1 & 2 -> Matrix Risk 1 (Level 2 - Low), Priority 3 (Medium)
# - Likelihood 3 -> Matrix Risk 2 (Level 3 - Medium), Priority 2 (High)
# - Likelihood 4 -> Matrix Risk 3 (Level 4 - High), Priority 1 (Critical)
# ==============================================================================
expected_evaluation:
  impact_level: 3
  confidentiality_impact: 3
  availability_impact: 3
  integrity_impact: 3
  scenario_count: 24
  excluded_scenarios:
  - API abuse and denial of service
  - Application compromise via injection attack
  - Application or storage compromise via unrestricted file upload
  - Catastrophic data loss due to unverified backups
  - Compromise of CI/CD pipeline integrity and unreviewed code deployment
  - Compromise via unhardened or End-of-Life (EOL) COTS deployment
  - Credential leakage via hardcoded secrets
  - Deployment of undetected code vulnerabilities due to missing security testing
  - Deployment of vulnerable commercial software due to unverified vendor SDLC
  - Disclosure of production data in non-production environments
  - Excessive retention of sensitive data
  - Exploitation of unpatched vulnerability
  - Exposure of unencrypted data at rest
  - Exposure of unencrypted data in transit
  - Host or OS compromise via unpatched system vulnerabilities
  - Sensitive data exposure in logs or missing forensic audit trail
  - Session hijacking and token replay
  - Supply chain compromise via vulnerable dependency
  - Third-party data leakage
  - Undetected breach due to missing security logging
