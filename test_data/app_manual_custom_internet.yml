application:
  order: 17
  id: app_manual_custom_internet
  name: App-Manual-Custom-Internet
  label: 'App-Manual-Custom-Internet (Case 2: Custom + Internet-Facing / Secret /
    High Compliance)'
  description: Custom developed Internet-facing financial transactions portal; demonstrates
    Case 2 conditional IG scoping (info, baseline, custom_app, infra, internet_facing).
  classification: Secret
  hosting: Custom Web
  compliance_target: 95%
  expected_risk: Low
  framework_ref: appsec_manual
  framework_name: Application Security Assessment Framework (AppSec - Manual IG)
  framework_yaml: YML/appsec_manual.yml
  user:
    email: alex.cloud@example-custom.public
    first_name: Alex
    last_name: Fintech
  tprm:
    criticality: 4
    maturity: 4
    trust: 4
    conclusion: ok
  expected_implementation_groups:
  - info
  - baseline
  - custom_app
  - infra
  - internet_facing
answers:
- requirement: application_description
  question: What is the primary functional domain and business purpose of the application?
  answer: Customer-Facing & Digital Commerce (e-commerce, customer portals, public web services, mobile apps)
  result: compliant
  observation: Custom developed Internet-facing financial transactions portal processing digital customer payments and transactions.
- requirement: application_description
  question: Who are the primary intended users or consumers of the application?
  answer: External public consumers and customers (B2C)
  result: compliant
  observation: Public-facing internet banking and customer transaction services.
- requirement: stakeholder_identification
  question: Is there a designated business contact? (Designated business owner or
    product sponsor accountable for business processes, functionality, and risk acceptance)
  answer: 'Yes'
  result: compliant
  observation: Head of Digital Platforms designated as business product sponsor.
- requirement: stakeholder_identification
  question: Is there a designated IT contact? (Technical lead or engineer responsible
    for maintenance, infrastructure, deployment, and operational support)
  answer: 'Yes'
  result: compliant
  observation: Principal Site Reliability Engineer designated as technical authority.
- requirement: stakeholder_identification
  question: Is there a designated data owner? (Data steward or governance officer
    responsible for information classification, access authorization, and regulatory
    compliance)
  answer: 'Yes'
  result: compliant
  observation: Enterprise Data Governance Officer designated as data owner.
- requirement: stakeholder_identification
  question: Is the information about stakeholders updated in LeanIX / CMDB? (Stakeholder
    assignments registered and kept current in the enterprise inventory or service
    catalog)
  answer: 'Yes'
  result: compliant
  observation: Service architecture and CMDB records maintained in enterprise registry.
- requirement: data_classification
  question: What primary category of retail, commercial, or operational data is handled by the application?
  answer: Critical financial assets, secrets, or anti-fraud algorithms (e.g. customer payment cardholder data [PCI-DSS], refund bank accounts, production root credentials / API keys, fraud-detection evasion rules & thresholds)
  result: compliant
  observation: Customer payment-card data (PCI-DSS PAN/CVV) and refund bank account records.
- requirement: data_classification
  question: What would be the estimated business, legal, or operational impact if the application's data were exposed, breached, or leaked?
  answer: Catastrophic or existential impact (Direct financial theft, payment card brand sanctions/fines, critical legal liability, systemic loss of customer trust, or severe statutory penalties)
  result: compliant
  observation: Exposure causes catastrophic financial theft, payment network sanctions, and existential regulatory penalties.
- requirement: data_classification
  question: What category of personal data is processed by the application under GDPR?
  answer: HR and financial details about employees and customer payment data
  result: compliant
  observation: Processes customer payment card numbers, payment authorization tokens, and bank account identifiers.
- requirement: data_classification
  question: What is the volume of data subjects (individuals) whose personal data is processed?
  answer: High volume / Large scale processing under GDPR (More than 100,000 individuals, or systemic nationwide monitoring)
  result: compliant
  observation: Public Internet-facing e-commerce checkout processing over 100,000 consumer customer accounts.
- requirement: hosting
  question: What is the delivery and hosting model of the application?
  answer: Custom software created and deployed by my teams (In-house development)
  result: compliant
  observation: Custom microservices architecture developed in-house by engineering
    teams.
- requirement: hosting
  question: What is the network exposure of the application?
  answer: Internet-facing (Public Web / Mobile API)
  result: compliant
  observation: Internet-facing public cloud web application and mobile API gateway.
- requirement: authentication_and_mfa
  question: How do users authenticate to the application?
  answer: "Hybrid: Enterprise SSO for users, with local admin / break-glass or external accounts"
  result: compliant
  observation: "Hybrid authentication: Enterprise SSO for users with break-glass admin accounts backed by modern PBKDF2/Argon2 password hashing."
- requirement: authentication_and_mfa
  question: If direct or hybrid authentication is used, are strong password policies and brute-force lockout protections implemented for local accounts?
  answer: 'Yes'
  result: compliant
  observation: Enforces 14-char complexity, dictionary checks, and IP rate-limiting lockout.
- requirement: authentication_and_mfa
  question: If direct or hybrid authentication is used, is Multi-Factor Authentication (MFA) enforced for all administrative, privileged, and break-glass access?
  answer: 'Yes'
  result: compliant
  observation: MFA enforced via TOTP / WebAuthn for all administrative and user logins.
- requirement: access_control_and_rbac
  question: Have you defined roles and permissions for the application? (Is access
    controlled via granular roles (RBAC/ABAC) enforcing least privilege across all
    business functions and APIs?)
  answer: 'Yes'
  result: compliant
  observation: Granular ABAC enforcing least privilege across API endpoints and data
    objects.
- requirement: access_control_and_rbac
  question: Is the application integrated with the enterprise Identity Governance
    and Administration (IGA) solution (such as SailPoint) for centralized user lifecycle,
    role management, and automated provisioning/deprovisioning?
  answer: 'Yes'
  result: compliant
  observation: Connected to SailPoint IdentityNow for automated joiner-mover-leaver
    workflows.
- requirement: access_control_and_rbac
  question: Are user entitlements and privileged permissions reviewed and recertified
    on a periodic basis via formal recertification campaigns (e.g., SailPoint certification
    campaigns at least annually for standard users, biannually for privileged accounts)?
  answer: 'Yes'
  result: compliant
  observation: Semi-annual privileged entitlement recertification audit completed.
- requirement: session_management
  question: "Are session identifiers and API bearer tokens cryptographically secure, protected in transit/storage (e.g. HttpOnly, Secure, SameSite cookie flags or secure token storage), and invalidated upon logout, expiration, or inactivity?"
  answer: 'Yes'
  result: compliant
  observation: Cryptographically signed JWT sessions stored in secure HttpOnly SameSite
    cookies.
- requirement: owasp_top_10_defenses
  question: "Are server-side input validation and parameterized queries/ORMs enforced to prevent injection flaws (SQLi, command injection, SSRF)?"
  answer: 'Yes'
  result: compliant
  observation: OWASP ASVS Level 2 standards implemented; strict parameterized SQL.
- requirement: owasp_top_10_defenses
  question: "Are context-aware output encoding, security headers (CSP), and generic production error handlers enforced to prevent XSS and stack-trace leakage?"
  answer: 'Yes'
  result: compliant
  observation: Comprehensive context-aware output encoding, strict CSP headers, and generic production error masking.
- requirement: file_upload_security
  question: Can files be uploaded to the application? (e.g., user attachments, documents,
    images, media, or data imports)
  answer: 'Yes'
  result: compliant
  observation: Allows document attachment uploads for customer verification.
- requirement: file_upload_security
  question: Are uploaded files validated via server-side magic byte inspection, assigned
    randomized filenames (UUIDs), and stripped of path traversal characters?
  answer: 'Yes'
  result: compliant
  observation: Server-side magic byte inspection, path traversal stripping, UUID rename.
- requirement: file_upload_security
  question: Are uploaded files scanned for malware and stored exclusively in dedicated,
    non-executable private object storage (e.g. private S3 with presigned URLs)?
  answer: 'Yes'
  result: compliant
  observation: Asynchronous ClamAV malware scan and isolated private S3 storage with
    presigned URLs.
- requirement: automated_security_testing
  question: Is automated Static Application Security Testing (SAST) integrated into
    the CI/CD pipeline with blocking quality gates?
  answer: 'Yes'
  result: compliant
  observation: SonarQube & Semgrep SAST run on all pull requests with blocking quality
    gates.
- requirement: automated_security_testing
  question: Is Dynamic Application Security Testing (DAST) or API security scanning
    performed automatically prior to release?
  answer: 'Yes'
  result: compliant
  observation: Automated DAST API scanning integrated into staging deployment pipeline.
- requirement: supply_chain_and_dependencies
  question: Is Software Composition Analysis (SCA) automated in the CI/CD pipeline
    to detect known vulnerabilities in open-source dependencies?
  answer: 'Yes'
  result: compliant
  observation: Dependabot and Snyk monitor all npm and PyPI libraries continuously.
- requirement: supply_chain_and_dependencies
  question: Is an accurate Software Bill of Materials (SBOM) maintained and audited
    for all released application artifacts?
  answer: 'Yes'
  result: compliant
  observation: SPDX and CycloneDX SBOMs published with every release.
- requirement: code_review_and_ci_cd_integrity
  question: "Are mandatory peer code reviews enforced prior to merging changes into deployment branches?"
  answer: 'Yes'
  result: compliant
  observation: Mandatory peer code reviews require two senior engineering approvals.
- requirement: code_review_and_ci_cd_integrity
  question: "Do repository branch protection rules block direct commits, force-pushes, and failing CI status checks on deployment branches?"
  answer: 'Yes'
  result: compliant
  observation: Branch protections block direct commits, force-pushes, and require CI passing.
- requirement: data_exchange
  question: 'Does the application exchange data externally? (e.g., B2B transfers,
    automated API integrations, webhooks, or network communications with external
    partners, third-party vendors, or external services; Note: this excludes B2C interactions,
    as customers do not receive data the same way B2B partners do)'
  answer: 'Yes'
  result: compliant
  observation: Exchanges transaction data with banking partners via automated webhooks.
- requirement: data_exchange
  question: Is there a data exchange contract with the appropriate confidentiality
    clauses? (e.g., formal Data Processing Agreement / DPA, Data Transfer Agreement
    / DTA, or NDA)
  answer: 'Yes'
  result: compliant
  observation: Executed B2B Data Processing Agreements (DPA) and mutual NDAs in place.
- requirement: non_prod_data
  question: Are real production data records, live customer databases, or personal
    data utilized in non-production environments? (e.g., development/staging environments
    or QA databases)
  answer: Yes - Production data is copied or utilized for testing/staging
  result: compliant
  observation: Anonymized production snapshots used for pre-production load testing.
- requirement: non_prod_data
  question: 'How do you protect them? (Which sanitization or protection method is
    applied: cryptographic hashing, pseudonymisation, data masking / anonymization,
    or field-level encryption prior to ingestion)'
  answer: Encryption
  result: compliant
  observation: Field-level AES-256 encryption applied before transferring test data.
- requirement: non_prod_data
  question: Do you clean the prod data after use in non-prod? (e.g., securely purging,
    sanitizing, or deleting production data once testing or troubleshooting activities
    conclude in non-production environments)
  answer: 'Yes'
  result: compliant
  observation: Automated pipeline purges load test database tables immediately after
    testing.
- requirement: data_destruction
  question: Is there a data destruction process for this application? (e.g., documented
    data retention schedule and end-of-life purging procedures for self-hosted systems)
  answer: 'No'
  result: non_compliant
  observation: Formal end-of-life data destruction process is not yet formalized for
    this service.
- requirement: secrets_management
  question: Are application credentials, API keys, and cryptographic secrets stored
    exclusively in a dedicated secrets manager rather than in code or configuration
    files?
  answer: 'Yes'
  result: compliant
  observation: AWS Secrets Manager with automated 30-day rotation for database passwords.
- requirement: data_in_transit
  question: 'Is data encrypted during transit across external and internal network
    boundaries? (Specify protocols, algorithms and methods: e.g., TLS 1.2 / TLS 1.3
    with AES-GCM or ChaCha20, HTTPS with HSTS, mTLS for service APIs, SSHv2, or IPsec)'
  answer: 'Yes'
  result: compliant
  observation: TLS 1.3 enforced on AWS CloudFront edge and ALB with HSTS preload.
- requirement: data_at_rest
  question: 'Is data encrypted at rest? (Specify algorithms and key management: e.g.,
    AES-256 / AES-GCM across databases, object storage, file systems, disk volumes,
    and backups with centralized KMS, HSM, or TDE)'
  answer: 'Yes'
  result: compliant
  observation: AWS KMS customer managed keys (CMK) encrypting Aurora databases and
    S3 buckets.
- requirement: security_event_logging
  question: Does the application log key security events (failed logins, privilege
    escalation, administrative changes, access to sensitive assets)?
  answer: 'Yes'
  result: compliant
  observation: Audit trails record all security events, authentication attempts, and
    authorization changes.
- requirement: security_event_logging
  question: Are sensitive data fields (passwords, payment cards, tokens, PII) systematically
    sanitized/masked from log outputs?
  answer: 'Yes'
  result: compliant
  observation: Regex sanitizers mask credit card numbers, auth tokens, and personal
    credentials.
- requirement: centralized_monitoring_and_alerting
  question: Are application logs forwarded in near-real-time to a central SIEM/SOC
    platform with alerting rules for suspicious activities?
  answer: 'Yes'
  result: compliant
  observation: CloudWatch logs streamed to enterprise Datadog SIEM with 24/7 SOC alerting.
- requirement: backup_and_disaster_recovery
  question: "Are automated and encrypted backups maintained for application state and databases?"
  answer: 'Yes'
  result: compliant
  observation: Multi-region continuous replication and encrypted daily snapshots of application state and databases.
- requirement: backup_and_disaster_recovery
  question: "Are backup restoration and disaster recovery drills tested at least annually against documented RTO/RPO targets?"
  answer: 'Yes'
  result: compliant
  observation: Weekly automated test restores and semi-annual DR drills validated against documented RTO/RPO targets.
- requirement: os_patching
  question: Are operating system (OS) security patches, kernel updates, and host/container
    security updates applied automatically within formal SLAs? (e.g. Critical <= 14
    days, High <= 30 days)
  answer: No - OS patching is not automatic
  result: compliant
  observation: Manual maintenance windows scheduled bi-weekly for container host patching.
- requirement: os_patching
  question: If OS patching is not automatic, is there a formal patching schedule compliant
    with requirements? (e.g. documented recurring maintenance windows adhering to
    Critical <= 14 days, High <= 30 days)
  answer: 'Yes'
  result: compliant
  observation: Documented patching schedule adheres to Critical <= 14 days and High
    <= 30 days.
- requirement: os_patching
  question: Does the application and infrastructure architecture allow no-downtime
    patching from a business perspective? (e.g., high-availability clusters, rolling
    updates, or blue-green deployments preventing business downtime during maintenance)
  answer: 'Yes'
  result: compliant
  observation: ECS rolling deployments ensure no service interruption during host
    patching.
- requirement: api_security_and_rate_limiting
  question: "Are internet-facing endpoints fronted by an Edge WAF and anti-DDoS / bot protection (e.g. Cloudflare, AWS WAF)?"
  answer: 'Yes'
  result: compliant
  observation: AWS WAF with managed rule sets and bot control anti-DDoS protections.
- requirement: api_security_and_rate_limiting
  question: "Are API rate limiting, throttling, and payload size quotas enforced to prevent scraping and resource exhaustion?"
  answer: 'Yes'
  result: compliant
  observation: Strict token-bucket API rate limiting, throttling, and payload size quotas.
- requirement: penetration_testing_and_vulnerability_management
  question: Is independent penetration testing conducted on the application and underlying
    infrastructure at least annually by qualified internal or external penetration
    testers, or is the application covered by an active bug bounty / vulnerability
    disclosure program (VDP)?
  answer: 'Yes'
  result: compliant
  observation: Annual CREST-certified external penetration test and active private
    HackerOne bug bounty.
expected_evaluation:
  impact_level: 4
  confidentiality_impact: 4
  availability_impact: 4
  integrity_impact: 4
  scenario_count: 21
  excluded_scenarios:
  - Compromise of cardholder data environment in SaaS service
  - Compromise of customer data via unmanaged mobile devices
  - Compromise via unhardened or End-of-Life (EOL) COTS deployment
  - Deployment of vulnerable commercial software due to unverified vendor SDLC
  - Exploitation of unpatched SaaS vulnerability
  - Fourth-party vendor and sub-processor supply chain breach
  - Phishing and social engineering compromise of SaaS personnel
  - Physical unauthorized access and datacenter hardware tampering
  - Reliance on unverified SaaS security posture
  - SaaS application exploitation via unverified vendor SDLC
  - SaaS customer data exposure due to missing encryption or NDA safeguards
  - SaaS endpoint compromise and administrative credential theft
  - SaaS operational security compromise due to missing governance policies
  - SaaS provider data leakage
  - SaaS service disruption and catastrophic data loss
  - SaaS tenant isolation breach and cross-border leakage
  - SaaS tenant network perimeter breach and unauthorized egress
  - SaaS tenant takeover via unprotected administrative console
  - SaaS vendor privilege abuse and sub-processor leakage
  - SaaS web application transport and session exploitation
  - Unlawful cross-border data transfer and residency non-compliance
  - Unmonitored SaaS security incidents and delayed breach detection
  - Unremediated SaaS security non-conformity and contractual remedy gap
