# ==============================================================================
# Application: App-AI-Analytics-Workbench
# Profile: Cloud GenAI Analytics Platform (Confidential / SaaS / AI Data Transfer)
# ==============================================================================
# This profile represents a cloud-hosted Generative AI analytics workbench.
# It processes Confidential customer behavioral logs and proprietary machine learning models.
# Gaps exist in third-party LLM API transfer agreements ("No contract") and unmasked prompt logs
# retained in non-production environments, generating High risk priorities.
# ==============================================================================

application:
  id: "app_ai_analytics_workbench"
  name: "App-AI-Analytics-Workbench"
  description: "Cloud-hosted GenAI analytics workbench with uncontracted external LLM API transfer"
  classification: "Confidential"
  hosting: "SaaS"

answers:
  # ----------------------------------------------------------------------------
  # Governance & Context
  # ----------------------------------------------------------------------------
  - requirement: "data_classification"
    question: "What is the maximum classification level handled?"
    answer: "Confidential"
    result: "compliant"
    observation: "Proprietary machine learning models and confidential customer behavioral logs"
    # Rationale: Confidential classification (Impact Level 3).

  - requirement: "hosting"
    question: "What is the hosting model?"
    answer: "SaaS"
    result: "compliant"
    observation: "Multi-tenant cloud AI training and analytics platform"
    # Rationale: SaaS hosting activates Chapter 3 SaaS Contractual Compliance.

  # ----------------------------------------------------------------------------
  # Stakeholder Accountability
  # ----------------------------------------------------------------------------
  - requirement: "stakeholder_identification"
    question: "Is there a designated business contact?"
    answer: "Yes"
    result: "compliant"
    observation: "VP Artificial Intelligence designated as business contact"

  - requirement: "stakeholder_identification"
    question: "Is there a designated IT contact?"
    answer: "Yes"
    result: "compliant"
    observation: "Lead MLOps Engineer designated as IT contact"

  - requirement: "stakeholder_identification"
    question: "Is there a designated data owner?"
    answer: "Yes"
    result: "compliant"
    observation: "Chief Data Officer designated as data owner"

  - requirement: "stakeholder_identification"
    question: "Is the information about stakeholders updated in LeanIX?"
    answer: "Yes"
    result: "compliant"
    observation: "AI initiative registered in LeanIX enterprise architecture"
    # Score: 100% -> Likelihood 1 -> Risk: Low (id=1) -> Priority 3 (Medium).

  # ----------------------------------------------------------------------------
  # Cryptographic Protection (Transit & Rest)
  # ----------------------------------------------------------------------------
  - requirement: "data_in_transit"
    question: "Is data encrypted during transit?"
    answer: "Yes"
    result: "compliant"
    observation: "TLS 1.3 enforced for API inference endpoints and data pipelines"
    # Score: 100% -> Likelihood 1 -> Risk: Low (id=1) -> Priority 3 (Medium).

  - requirement: "data_at_rest"
    question: "Is data encrypted at rest?"
    answer: "Yes"
    result: "compliant"
    observation: "Cloud object storage encrypted with AES-256"
    # Score: 100% -> Likelihood 1 -> Risk: Low (id=1) -> Priority 3 (Medium).

  # ----------------------------------------------------------------------------
  # Non-Production Environments & Prompt Engineering Sanitization (AI Gap)
  # ----------------------------------------------------------------------------
  - requirement: "non_prod_data"
    question: "Do you have a dedicated non-production environment?"
    answer: "Yes"
    result: "compliant"
    observation: "Jupyter notebook research sandbox environments"

  - requirement: "non_prod_data"
    question: "Do you use prod data in a non-prod environment?"
    answer: "Yes"
    result: "non_compliant"
    observation: "Live customer interaction datasets used for prompt engineering"

  - requirement: "non_prod_data"
    question: "How do you protect them?"
    answer: "No, no protection"
    result: "non_compliant"
    observation: "Unmasked raw customer queries used in model evaluation"

  - requirement: "non_prod_data"
    question: "Do you clean the prod data after use in non-prod?"
    answer: "No"
    result: "non_compliant"
    observation: "Evaluation logs cached permanently across experiment runs"
    # Score: 0% -> Likelihood 4 (Very likely) -> Impact 3 -> Matrix Risk: High (id=3) -> Priority 1 (Urgent).

  # ----------------------------------------------------------------------------
  # External Data Exchange Governance (External LLM API Gap)
  # ----------------------------------------------------------------------------
  - requirement: "data_exchange"
    question: "Are there data exchanges beyond the group?"
    answer: "Yes"
    result: "non_compliant"
    observation: "Payloads submitted to external third-party foundation LLM APIs"

  - requirement: "data_exchange"
    question: "Is there a data exchange contract with the appropriate confidentiality clauses?"
    answer: "No contract"
    result: "non_compliant"
    observation: "No bilateral data protection addendum or zero-retention commitment"
    # Score: 0% -> Likelihood 4 (Very likely) -> Impact 3 -> Matrix Risk: High (id=3) -> Priority 1 (Urgent).

  # ----------------------------------------------------------------------------
  # Compliant Data Destruction
  # ----------------------------------------------------------------------------
  - requirement: "data_destruction"
    question: "Is there a data destruction process for this application?"
    answer: "No"
    result: "non_compliant"
    observation: "No automated data lifecycle or purge pipeline configured"

  - requirement: "data_destruction"
    question: "Is the process compliant with the policy (responsibilities, methods, reporting)?"
    answer: "No, not compliant"
    result: "non_compliant"
    observation: "Indefinite retention of model training corpora"
    # Score: 0% -> Likelihood 4 (Very likely) -> Impact 3 -> Matrix Risk: High (id=3) -> Priority 1 (Urgent).

  # ----------------------------------------------------------------------------
  # Third-Party SaaS Contractual Governance
  # ----------------------------------------------------------------------------
  - requirement: "saas_contract_compliance"
    question: "Is there a signed SaaS contract?"
    answer: "Yes"
    result: "compliant"
    observation: "Commercial online developer terms of service"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include an Audit clause?"
    answer: "No"
    result: "partially_compliant"
    observation: "Standard commercial tier excludes direct audit rights"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include an Incident Notification process?"
    answer: "Yes"
    result: "compliant"
    observation: "72-hour security incident notification clause"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include Strong IAM requirements?"
    answer: "Yes"
    result: "compliant"
    observation: "SSO with mandatory hardware MFA integration"

  - requirement: "saas_contract_compliance"
    question: "Does the contract include a Confidentiality agreement (NDA)?"
    answer: "No"
    result: "non_compliant"
    observation: "Standard self-service terms without custom intellectual property protection"
    # Score: 60% (3/5 clauses) -> Likelihood 2 (Rather unlikely) -> Impact 3 -> Risk: Low (id=1) -> Priority 3 (Medium).

# ==============================================================================
# Expected Control Statuses (newDPP Framework)
# ==============================================================================
# Controls with score >= 100% -> active; score < 100% -> to_do
# ==============================================================================
expected_controls:
  - control: "Designate stakeholders"
    reference_control: "stakeholder_designation"
    requirement: "stakeholder_identification"
    score: 100
    status: "active" # 4/4 questions Yes (100%) -> active
    rationale: "AI business, IT, data owners assigned and LeanIX synchronized."

  - control: "Identify the data classification level"
    reference_control: "identify_data_classification"
    requirement: "data_classification"
    score: 0
    status: "to_do"
    rationale: "Data classification registered as Confidential."

  - control: "Encrypt data in transit"
    reference_control: "encrypt_data_in_transit"
    requirement: "data_in_transit"
    score: 100
    status: "active" # TLS 1.3 active (100%) -> active
    rationale: "Inference endpoints and pipelines encrypted via TLS 1.3."

  - control: "Encrypt data at rest"
    reference_control: "encrypt_data_at_rest"
    requirement: "data_at_rest"
    score: 100
    status: "active" # AES-256 cloud storage (100%) -> active
    rationale: "Model artifacts and corpora encrypted at rest."

  - control: "Use hashing, encryption, anonymisation or pseudonymisation of prod data in non-production environment"
    reference_control: "protect_prod_data_in_non_prod"
    requirement: "non_prod_data"
    score: 0
    status: "to_do" # Raw unmasked prompts in sandbox (0%) -> to_do
    rationale: "Live customer interaction prompts copied to test sandboxes without masking."

  - control: "Sign a contract regarding the exchange of information with all the adequate clauses"
    reference_control: "information_exchange_contract"
    requirement: "data_exchange"
    score: 0
    status: "to_do" # No contract for external LLM API (0%) -> to_do
    rationale: "Payloads sent to external foundation LLM APIs without bilateral DPA."

  - control: "Write and implement a compliant data destruction process"
    reference_control: "data_destruction_process"
    requirement: "data_destruction"
    score: 0
    status: "to_do" # No purge process (0%) -> to_do
    rationale: "Indefinite retention of model training data and prompt logs."

  - control: "Sign a contract with the SaaS provider with all the adequate clauses"
    reference_control: "saas_contract"
    requirement: "saas_contract_compliance"
    score: 60
    status: "to_do" # 3/5 clauses (60%) -> to_do
    rationale: "Commercial terms lack direct audit rights and custom IP NDA."

# ==============================================================================
# Expected Risk Scenarios (newDPP Framework)
# ==============================================================================
# Impact Level: 3 (Confidential).
# Uncontracted LLM transfers and non-prod prompt dumps trigger High Risk (Level 4) -> Urgent Priority 1.
# ==============================================================================
expected_risk_scenarios:
  - scenario: "Exposure of unencrypted data in transit"
    likelihood_requirement: "data_in_transit"
    likelihood_score: 100
    scaled_likelihood: 1 # 1 - Unlikely
    scaled_impact: 3 # 3 - Serious (Confidential)
    matrix_risk_id: 1 # 2 - Low
    risk_level: 2
    control_priority: 3 # 3 (Medium)

  - scenario: "Exposure of unencrypted data at rest"
    likelihood_requirement: "data_at_rest"
    likelihood_score: 100
    scaled_likelihood: 1 # 1 - Unlikely
    scaled_impact: 3 # 3 - Serious (Confidential)
    matrix_risk_id: 1 # 2 - Low
    risk_level: 2
    control_priority: 3 # 3 (Medium)

  - scenario: "Disclosure of production data in non-production environments"
    likelihood_requirement: "non_prod_data"
    likelihood_score: 0
    scaled_likelihood: 4 # 4 - Very likely
    scaled_impact: 3 # 3 - Serious (Confidential)
    matrix_risk_id: 3 # 4 - High
    risk_level: 4
    control_priority: 1 # 1 (Urgent)

  - scenario: "Third-party data leakage"
    likelihood_requirement: "data_exchange"
    likelihood_score: 0
    scaled_likelihood: 4 # 4 - Very likely
    scaled_impact: 3 # 3 - Serious (Confidential)
    matrix_risk_id: 3 # 4 - High
    risk_level: 4
    control_priority: 1 # 1 (Urgent)

  - scenario: "SaaS provider data leakage"
    likelihood_requirement: "saas_contract_compliance"
    likelihood_score: 60
    scaled_likelihood: 2 # 2 - Rather unlikely
    scaled_impact: 3 # 3 - Serious (Confidential)
    matrix_risk_id: 1 # 2 - Low
    risk_level: 2
    control_priority: 3 # 3 (Medium)

  - scenario: "Missing application stakeholders"
    likelihood_requirement: "stakeholder_identification"
    likelihood_score: 100
    scaled_likelihood: 1 # 1 - Unlikely
    scaled_impact: 3 # 3 - Serious (Confidential)
    matrix_risk_id: 1 # 2 - Low
    risk_level: 2
    control_priority: 3 # 3 (Medium)

  - scenario: "Excessive retention of sensitive data"
    likelihood_requirement: "data_destruction"
    likelihood_score: 0
    scaled_likelihood: 4 # 4 - Very likely
    scaled_impact: 3 # 3 - Serious (Confidential)
    matrix_risk_id: 3 # 4 - High
    risk_level: 4
    control_priority: 1 # 1 (Urgent)
