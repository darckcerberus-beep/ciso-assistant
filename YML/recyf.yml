    # Exigence 11.B.2 [EE] : Identification, délimitation et protection renforcée du cœur de confiance (Active Directory / annuaires)
    # Type d'actif cible : Identités, Accès & Annuaires (IAM / AD)
    - urn: urn:intuitem:risk:req_node:recyf:11.b.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:recyf:11.b
      ref_id: 11.B.2
      description: "La s\xE9curit\xE9 des syst\xE8mes d\u2019information de l\u2019\
        entit\xE9 repose en grande partie sur la s\xE9curit\xE9 du ou des annuaires\
        \ g\xE9rant les utilisateurs ou les ressources des syst\xE8mes d\u2019information.\n\
