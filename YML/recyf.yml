# ============================================================================
# RÉFÉRENTIEL CYBER FRANCE (ReCyF) - ANSSI
# ============================================================================
# Référentiel de cybersécurité mentionné au 6ème alinéa de l'article 14 du
# projet de loi relatif à la résilience des infrastructures critiques et au
# renforcement de la cybersécurité (transposition nationale de la directive NIS 2).
#
# Auteur / Source : Agence Nationale de la Sécurité des Systèmes d'Information (ANSSI)
# Version         : Version 2.5 du 17/03/2026 (Version du paquet : 4)
# Profils cibles  :
#   - EI : Entité Importante (socle minimal d'obligations de sécurité)
#   - EE : Entité Essentielle (obligations renforcées pour entités hautement critiques)
#
# Structure :
#   - 20 Objectifs de sécurité thématiques
#   - 14 Sous-sections d'organisation et de cadrage
#   - 152 Moyens Acceptables de Conformité (MAC) assessables :
#       * 76 mesures socles communes [EI / EE]
#       * 76 mesures avancées renforcées [EE]
# ============================================================================

# ----------------------------------------------------------------------------
# Métadonnées de la bibliothèque ReCyF
# ----------------------------------------------------------------------------
convert_library_version: 'v2 ; Compat Mode: [0] {[v2.1] (DEFAULT) Don''t use any Compatibility
  Mode}'
urn: urn:intuitem:risk:library:recyf
locale: fr
ref_id: ReCyF
name: "RECYF : R\xC9F\xC9RENTIEL CYBER France - Version 2.5 du 17/03/2026"
description: "RECYF constitue le r\xE9f\xE9rentiel de cybers\xE9curit\xE9 mentionn\xE9\
  \ au 6\xE8me alin\xE9a de l\u2019article 14 du projet de loi relatif \xE0 la r\xE9\
  silience des infrastructures critiques et au renforcement de la cybers\xE9curit\xE9\
  \ (PJL). Il se compose d\u2019objectifs de s\xE9curit\xE9 et, pour chacun d\u2019\
  eux, de moyens acceptables de conformit\xE9."
copyright: ANSSI
version: 4
publication_date: 2026-07-09
provider: ANSSI
packager: intuitem

# Dépendances documentaires et modèles de politiques (ex: doc-pol)
dependencies:
- urn:intuitem:risk:library:doc-pol

# ============================================================================
# OBJETS DU RÉFÉRENTIEL
# ============================================================================
objects:
  # --------------------------------------------------------------------------
  # Cadre général d'évaluation ReCyF
  # --------------------------------------------------------------------------
  framework:
    urn: urn:intuitem:risk:framework:recyf
    ref_id: ReCyF
    name: "RECYF : R\xC9F\xC9RENTIEL CYBER France - Version 2.5 du 17/03/2026"
    description: "RECYF constitue le r\xE9f\xE9rentiel de cybers\xE9curit\xE9 mentionn\xE9\
      \ au 6\xE8me alin\xE9a de l\u2019article 14 du projet de loi relatif \xE0 la\
      \ r\xE9silience des infrastructures critiques et au renforcement de la cybers\xE9\
      curit\xE9 (PJL). Il se compose d\u2019objectifs de s\xE9curit\xE9 et, pour chacun\
      \ d\u2019eux, de moyens acceptables de conformit\xE9."

    # Profils d'applicabilité selon le niveau d'assujettissement NIS 2 :
    # - EI (Entité Importante) : exigences minimales indispensables (socle commun)
    # - EE (Entité Essentielle) : exigences avancées avec obligations de renforcement
    implementation_groups_definition:
    - ref_id: EI
      name: "Entit\xE9 Importante"
      description: null
    - ref_id: EE
      name: "Entit\xE9 Essentielle"
      description: null

    # ========================================================================
    # DÉFINITION DES TYPES D'ACTIFS RECYF / NIS 2
    # Objets et catégories sur lesquels les exigences de sécurité sont évaluées.
    # ========================================================================
    asset_types_definition:
    - ref_id: governance_organization
      name: "Gouvernance, Organisation & RH"
      type: "PR"
      description: "Politiques (PSSI), gouvernance, rôles RSSI/ANSSI, gestion des risques, gestion de crise, exercices, audits et processus RH."
    - ref_id: information_systems
      name: "Systèmes d'Information & Applications Métier"
      type: "PR"
      description: "Applications métier, bases de données, cartographie applicative, MCO/MCS, gestion des vulnérabilités, correctifs et PCA/PRA."
    - ref_id: ecosystem_suppliers
      name: "Écosystème & Fournisseurs Tiers"
      type: "PR"
      description: "Cartographie des prestataires, clauses contractuelles de sécurité, plans d'assurance sécurité (PAS) et audits tiers."
    - ref_id: network_architecture
      name: "Architecture Réseau & Accès Distants"
      type: "SP"
      description: "Cloisonnement réseau, zonage, passerelles DMZ/Proxy, filtrage firewall, accès distants VPN/TLS et authentification forte."
    - ref_id: endpoints
      name: "Postes de Travail & Terminaux Nomades"
      type: "SP"
      description: "Parc de postes utilisateurs, terminaux mobiles, chiffrement des disques nomades, protection EDR/antivirus et contrôle des supports amovibles."
    - ref_id: iam_directories
      name: "Identités, Accès & Annuaires (IAM / AD)"
      type: "SP"
      description: "Cycle de vie des comptes, authentification, MFA, principe du moindre privilège, contrôleurs de domaine et annuaires d'entreprise."
    - ref_id: administration_pav
      name: "Ressources d'Administration Dédiées (PAV)"
      type: "SP"
      description: "Comptes à privilèges d'administration, réseau d'administration dédié hors-bande, postes physiques d'administration dédiés (PAV)."
    - ref_id: infrastructure_servers
      name: "Serveurs & Équipements d'Infrastructure"
      type: "SP"
      description: "Durcissement (hardening), suppression des services inutiles, application des guides de configuration sécurisée et revues de conformité."
    - ref_id: supervision_soc
      name: "Supervision, Logs & Détection (SOC / SIEM)"
      type: "SP"
      description: "Détection des incidents, centralisation et intégrité des logs, horodatage synchronisé (NTP), rétention sécurisée et notification ANSSI."
    - ref_id: physical_security
      name: "Locaux Physiques & Salles Serveurs"
      type: "SP"
      description: "Contrôle d'accès physique, protection des salles serveurs et baies réseau, gestion des habilitations d'accès et accompagnement des visiteurs."

    # ========================================================================
    # OBJECTIFS DE SÉCURITÉ ET MOYENS ACCEPTABLES DE CONFORMITÉ (MAC)
    # Le référentiel ReCyF s'articule autour de 20 objectifs de sécurité déclinés
    # en sous-sections thématiques et en exigences de sécurité assessables.
    # ========================================================================
    requirement_nodes:

    # ========================================================================
    # OBJECTIF DE SÉCURITÉ 1 : RECENSEMENT DES SYSTÈMES D'INFORMATION
    # Finalité : Identifier, cartographier et tenir à jour l'ensemble des activités, services et systèmes d'information supports de l'entité.
    # Profils concernés : Entité Importante (EI) et Entité Essentielle (EE)
    # ========================================================================
    - urn: urn:intuitem:risk:req_node:recyf:1
      assessable: false
      depth: 1
      ref_id: '1'
      name: "Objectif de s\xE9curit\xE9 1: Recensement des syst\xE8mes d'information"
    # Exigence 1.1 [EI / EE] : Recensement de l'ensemble des activités, services et SI supports avec identification des responsables
    # Type d'actif cible : Gouvernance, Organisation & RH
    - urn: urn:intuitem:risk:req_node:recyf:1.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:recyf:1
      ref_id: '1.1'
      description: "L\u2019entit\xE9 liste l\u2019ensemble de ses activit\xE9s et\
        \ services, y compris les activit\xE9s et services qui ne correspondent pas\
        \ aux crit\xE8res pour lesquels l\u2019entit\xE9 constitue une entit\xE9 importante\
        \ ou essentielle (par exemple : une entit\xE9 essentielle au titre d\u2019\
        une activit\xE9 exploitation d\u2019un ol\xE9oduc doit lister, en plus des\
        \ activit\xE9s et services participant \xE0 l\u2019exploitation de l\u2019\
        ol\xE9oduc, tous les services et les autres activit\xE9s qu\u2019elle fournit).\n\
        Pour chaque entr\xE9e de cette liste, l\u2019entit\xE9 :\n\u2022\tidentifie\
        \ un responsable de l\u2019activit\xE9 ou du service (par exemple le chef\
        \ de service auquel est rattach\xE9e l'activit\xE9 ou le service, un directeur\
        \ m\xE9tier, la direction g\xE9n\xE9rale) ;\n\u2022\tliste les syst\xE8mes\
        \ d\u2019information les supportant."
      annotation: "Type d'actif évalué : Gouvernance, Organisation & RH"
      target_asset_types:
      - "Gouvernance, Organisation & RH"
      implementation_groups:
      - EI
      - EE
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.asset
      - urn:intuitem:risk:function:doc-pol:doc.asset_register
      - urn:intuitem:risk:function:doc-pol:doc.context
      questions:
        urn:intuitem:risk:req_node:recyf:1.1:q1:
          type: unique_choice
          text: "Quel est le niveau de recensement des activités, services et systèmes d'information supports de l'entité ?"
          choices:
          - urn: urn:intuitem:risk:req_node:recyf:1.1:q1:c1
            value: 'Inventaire exhaustif et formalisé : activités, services et SI supports recensés avec un responsable désigné pour chacun'
            add_score: 100
            compute_result: true
            color: '#33a745'
          - urn: urn:intuitem:risk:req_node:recyf:1.1:q1:c2
            value: 'Recensement partiel ou informel : inventaire incomplet ou responsables non systématiquement identifiés'
            add_score: 50
            compute_result: true
            color: '#fd7e14'
          - urn: urn:intuitem:risk:req_node:recyf:1.1:q1:c3
            value: 'Inexistant : aucun recensement structuré des activités et des systèmes d''information supports'
            add_score: 0
            compute_result: false
            color: '#dc3545'
    # Exigence 1.2 [EI / EE] : Justification documentée des systèmes d'information exclus du champ des obligations de sécurité
    # Type d'actif cible : Systèmes d'Information & Applications Métier
    - urn: urn:intuitem:risk:req_node:recyf:1.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:recyf:1
      ref_id: '1.2'
      description: "L\u2019entit\xE9 pr\xE9cise dans la liste pr\xE9vue au 1.1-EI/EE\
        \ les syst\xE8mes d\u2019information qui ne sont expos\xE9s \xE0 aucun des\
        \ risques mentionn\xE9s \xE0 l\u2019alin\xE9a 2 de l\u2019objectif de s\xE9\
        curit\xE9.\nL\u2019entit\xE9 renseigne les justifications de ces choix."
      annotation: "Type d'actif évalué : Systèmes d'Information & Applications Métier"
      target_asset_types:
      - "Systèmes d'Information & Applications Métier"
      implementation_groups:
      - EI
      - EE
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.asset_register
      - urn:intuitem:risk:function:doc-pol:pol.asset
      - urn:intuitem:risk:function:doc-pol:doc.scope
      questions:
        urn:intuitem:risk:req_node:recyf:1.2:q1:
          type: unique_choice
          text: "Les systèmes d'information exclus du champ des obligations sont-ils formellement justifiés ?"
          choices:
          - urn: urn:intuitem:risk:req_node:recyf:1.2:q1:c1
            value: 'Oui, les SI exclus sont explicitement listés avec leurs justifications documentées'
            add_score: 100
            compute_result: true
            color: '#33a745'
          - urn: urn:intuitem:risk:req_node:recyf:1.2:q1:c2
            value: 'Non, aucune justification documentée n''est formalisée pour les systèmes exclus'
            add_score: 0
            compute_result: false
            color: '#dc3545'
    # Exigence 1.3 [EI / EE] : Revue, validation et réexamen annuel de l'inventaire des activités et systèmes d'information
    # Type d'actif cible : Systèmes d'Information & Applications Métier
    - urn: urn:intuitem:risk:req_node:recyf:1.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:recyf:1
      ref_id: '1.3'
      description: "L\u2019entit\xE9 valide et r\xE9examine annuellement la liste\
        \ pr\xE9vue au 1.1-EI/EE, et en tant que de besoin, notamment en cas d\u2019\
        \xE9volution des activit\xE9s et services de l\u2019entit\xE9 ou en cas de\
        \ mise en service d\u2019un nouveau syst\xE8me d\u2019information."
      annotation: "Type d'actif évalué : Systèmes d'Information & Applications Métier"
      target_asset_types:
      - "Systèmes d'Information & Applications Métier"
      implementation_groups:
      - EI
      - EE
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.asset_register
      - urn:intuitem:risk:function:doc-pol:pol.asset
      questions:
        urn:intuitem:risk:req_node:recyf:1.3:q1:
          type: unique_choice
          text: "À quelle fréquence l'inventaire des activités et des SI est-il validé et réexaminé ?"
          choices:
          - urn: urn:intuitem:risk:req_node:recyf:1.3:q1:c1
            value: 'Revue annuelle systématique et mise à jour lors de toute évolution majeure du périmètre'
            add_score: 100
            compute_result: true
            color: '#33a745'
          - urn: urn:intuitem:risk:req_node:recyf:1.3:q1:c2
            value: 'Revue ponctuelle ou irrégulière, sans fréquence annuelle garantie'
            add_score: 50
            compute_result: true
            color: '#fd7e14'
          - urn: urn:intuitem:risk:req_node:recyf:1.3:q1:c3
            value: 'Aucun réexamen périodique ou inventaire jamais actualisé'
            add_score: 0
            compute_result: false
            color: '#dc3545'

    # ========================================================================
    # OBJECTIF DE SÉCURITÉ 2 : CADRE DE GOUVERNANCE DE LA SÉCURITÉ NUMÉRIQUE
    # Finalité : Structurer l'organisation de la sécurité numérique, définir la PSSI et piloter la conformité au plus haut niveau.
    # Profils concernés : Entité Importante (EI) et Entité Essentielle (EE)
    # ========================================================================
    - urn: urn:intuitem:risk:req_node:recyf:2
      assessable: false
      depth: 1
      ref_id: '2'
      name: "Objectif de s\xE9curit\xE9 2: Mise en \u0153uvre d'un cadre de gouvernance\
        \ de la s\xE9curit\xE9 num\xE9rique"

    # ------------------------------------------------------------------------
    # SOUS-SECTION 2.A : Rôles et responsabilités
    # Périmètre : Responsabilité du dirigeant exécutif, désignation du RSSI et interlocuteur ANSSI, organisation dédiée.
    # ------------------------------------------------------------------------
    - urn: urn:intuitem:risk:req_node:recyf:2.a
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:recyf:2
      ref_id: 2.A
      name: "R\xF4les et responsabilit\xE9s"
    # Exigence 2.A.1 [EI / EE] : Responsabilité formelle du dirigeant exécutif pour la sécurité numérique et le respect des obligations
    # Type d'actif cible : Gouvernance, Organisation & RH
    - urn: urn:intuitem:risk:req_node:recyf:2.a.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:recyf:2.a
      ref_id: 2.A.1
      description: "Le dirigeant ex\xE9cutif de l\u2019entit\xE9 est responsable de\
        \ la s\xE9curit\xE9 num\xE9rique au sein de son entit\xE9 et en particulier\
        \ du suivi de la conformit\xE9 des syst\xE8mes d\u2019information aux pr\xE9\
        sentes mesures."
      annotation: "Type d'actif évalué : Gouvernance, Organisation & RH"
      target_asset_types:
      - "Gouvernance, Organisation & RH"
      implementation_groups:
      - EI
      - EE
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      - urn:intuitem:risk:function:doc-pol:doc.raci
      questions:
        urn:intuitem:risk:req_node:recyf:2.a.1:q1:
          type: unique_choice
          text: "Le dirigeant exécutif assume-t-il formellement la responsabilité de la sécurité numérique et du suivi de la conformité ?"
          choices:
          - urn: urn:intuitem:risk:req_node:recyf:2.a.1:q1:c1
            value: 'Oui, responsabilité formellement endossée par le dirigeant exécutif avec suivi effectif de la conformité'
            add_score: 100
            compute_result: true
            color: '#33a745'
          - urn: urn:intuitem:risk:req_node:recyf:2.a.1:q1:c2
            value: 'Partiellement, responsabilité reconnue informellement sans suivi formalisé de la conformité'
            add_score: 50
            compute_result: true
            color: '#fd7e14'
          - urn: urn:intuitem:risk:req_node:recyf:2.a.1:q1:c3
            value: 'Non, le dirigeant exécutif n''est pas impliqué dans la gouvernance de la sécurité numérique'
            add_score: 0
            compute_result: false
            color: '#dc3545'
    # Exigence 2.A.2 [EE] : Désignation d'un RSSI et du point de contact officiel pour l'ANSSI
    # Type d'actif cible : Gouvernance, Organisation & RH
    - urn: urn:intuitem:risk:req_node:recyf:2.a.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:recyf:2.a
      ref_id: 2.A.2
      description: "Il d\xE9signe au moins une personne qui le conseille et l\u2019\
        accompagne dans l\u2019exercice de cette responsabilit\xE9. Cette personne\
        \ est le point de contact privil\xE9gi\xE9 de l\u2019Agence nationale de la\
        \ s\xE9curit\xE9 des syst\xE8mes d\u2019information pour tous les sujets relatifs\
        \ \xE0 la s\xE9curit\xE9 num\xE9rique (notamment incidents de s\xE9curit\xE9\
        , communications de l\u2019ANSSI sur les sujets relatifs aux entit\xE9s essentielles)"
      annotation: "Type d'actif évalué : Gouvernance, Organisation & RH"
      target_asset_types:
      - "Gouvernance, Organisation & RH"
      implementation_groups:
      - EE
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.raci
      - urn:intuitem:risk:function:doc-pol:doc.controls
      questions:
        urn:intuitem:risk:req_node:recyf:2.a.2:q1:
          type: unique_choice
          text: "Un conseiller dédié (ex. RSSI) est-il désigné comme point de contact officiel pour l'ANSSI ?"
          choices:
          - urn: urn:intuitem:risk:req_node:recyf:2.a.2:q1:c1
            value: 'Oui, une personne est formellement désignée pour conseiller le dirigeant et assurer le contact avec l''ANSSI'
            add_score: 100
            compute_result: true
            color: '#33a745'
          - urn: urn:intuitem:risk:req_node:recyf:2.a.2:q1:c2
            value: 'Non, aucun point de contact officiel n''est formellement désigné auprès de l''ANSSI'
            add_score: 0
            compute_result: false
            color: '#dc3545'
    # Exigence 2.A.3 [EI / EE] : Organisation dédiée et allocation des moyens adaptés pour piloter la sécurité numérique
    # Type d'actif cible : Gouvernance, Organisation & RH
    - urn: urn:intuitem:risk:req_node:recyf:2.a.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:recyf:2.a
      ref_id: 2.A.3
      description: "L\u2019entit\xE9 d\xE9finit et met en \u0153uvre une organisation\
        \ adapt\xE9e pour assurer sa s\xE9curit\xE9 num\xE9rique (par exemple : la\
        \ d\xE9signation d\u2019un responsable de la s\xE9curit\xE9 num\xE9rique,\
        \ l\u2019\xE9tablissement d\u2019un RACI, la mise en place d\u2019une comitologie)."
      annotation: "Type d'actif évalué : Gouvernance, Organisation & RH"
      target_asset_types:
      - "Gouvernance, Organisation & RH"
      implementation_groups:
      - EI
      - EE
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.raci
      - urn:intuitem:risk:function:doc-pol:doc.controls
      - urn:intuitem:risk:function:doc-pol:pol.main
      questions:
        urn:intuitem:risk:req_node:recyf:2.a.3:q1:
          type: unique_choice
          text: "Quel est le niveau de structuration de l'organisation dédiée à la sécurité numérique ?"
          choices:
          - urn: urn:intuitem:risk:req_node:recyf:2.a.3:q1:c1
            value: 'Organisation formalisée et outillée : rôles définis (RACI), ressources dédiées et comitologie régulière'
            add_score: 100
            compute_result: true
            color: '#33a745'
          - urn: urn:intuitem:risk:req_node:recyf:2.a.3:q1:c2
            value: 'Organisation partielle : rôles informels ou moyens alloués insuffisants pour couvrir les besoins'
            add_score: 50
            compute_result: true
            color: '#fd7e14'
          - urn: urn:intuitem:risk:req_node:recyf:2.a.3:q1:c3
            value: 'Inexistante : aucune organisation ni gouvernance dédiée à la sécurité numérique'
            add_score: 0
            compute_result: false
            color: '#dc3545'

    # ------------------------------------------------------------------------
    # SOUS-SECTION 2.B : Politique de sécurité des systèmes d'information (PSSI)
    # Périmètre : Élaboration, contenu socle, approbation formelle par la direction, déclinaison et réexamen régulier.
    # ------------------------------------------------------------------------
    - urn: urn:intuitem:risk:req_node:recyf:2.b
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:recyf:2
      ref_id: 2.B
      name: "Politique de s\xE9curit\xE9 des syst\xE8mes d'information"
    # Exigence 2.B.1 [EI / EE] : Élaboration et formalisation d'une Politique de Sécurité des Systèmes d'Information (PSSI)
    # Type d'actif cible : Gouvernance, Organisation & RH
    - urn: urn:intuitem:risk:req_node:recyf:2.b.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:recyf:2.b
      ref_id: 2.B.1
      description: "L\u2019entit\xE9 d\xE9finit et met en \u0153uvre une politique\
        \ de s\xE9curit\xE9 des syst\xE8mes d\u2019information (PSSI)."
      annotation: "Type d'actif évalué : Gouvernance, Organisation & RH"
      target_asset_types:
      - "Gouvernance, Organisation & RH"
      implementation_groups:
      - EI
      - EE
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      questions:
        urn:intuitem:risk:req_node:recyf:2.b.1:q1:
          type: unique_choice
          text: "Quel est le niveau d'élaboration et d'application de la Politique de Sécurité des Systèmes d'Information (PSSI) ?"
          choices:
          - urn: urn:intuitem:risk:req_node:recyf:2.b.1:q1:c1
            value: 'PSSI formalisée, validée par la direction et activement mise en œuvre'
            add_score: 100
            compute_result: true
            color: '#33a745'
          - urn: urn:intuitem:risk:req_node:recyf:2.b.1:q1:c2
            value: 'PSSI en cours de rédaction ou formalisée mais partiellement appliquée'
            add_score: 50
            compute_result: true
            color: '#fd7e14'
