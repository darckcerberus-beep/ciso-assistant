        description: "Perform annual compliance checks, provide compliance evidence, maintain gap remediation plans, and grant client/third-party audit rights."
        annotation: >
          Exigences contractuelles :
          - Contrôle annuel de conformité.
          - Mise à disposition des preuves de conformité.
          - Plan de remédiation en cas d'écart.
          - Droit d'audit du client ou d'un tiers mandaté.
        typical_evidence: >
          - Executed SaaS agreement containing explicit Right to Audit clause
          - Annual compliance evidence pack (SOC 2 Type II, ISO 27001 certificate, pentest executive letter)
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:contractual_gap
        implementation_groups: ["saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:saas_third_party_assurance
        questions:
          urn:intuitem:risk:req_node:appsec:saas_audit_and_compliance:q1:
            type: unique_choice
            text: "Does the contract legally grant the client (or an authorized third party) the right to audit, with annual compliance checks and access to compliance evidence and remediation plans?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:saas_audit_and_compliance:q1:c1
                value: "Yes"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:saas_audit_and_compliance:q1:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"

      # Section 20: PCI DSS (si applicable)
      - urn: urn:intuitem:risk:req_node:appsec:saas_pci_dss
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_pci_dss
        name: "PCI DSS Payment Security (PCI DSS - si applicable)"
        description: "Maintain PCI DSS certification for payment data environments, provide annual AOCs, implement dedicated cardholder incident procedures, and immediately notify payment incidents."
        annotation: >
          Exigences contractuelles :
          - Maintien de la certification PCI DSS pour les environnements traitant des données de paiement.
          - Fourniture annuelle de l'attestation de conformité (AOC).
          - Procédure de réponse aux incidents spécifique aux données de cartes bancaires.
          - Notification immédiate des incidents affectant les données de paiement.
        typical_evidence: >
          - Valid PCI DSS Attestation of Compliance (AOC) signed by Qualified Security Assessor (QSA)
          - Payment Incident Response SOP and immediate notification procedure
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:contractual_gap
        implementation_groups: ["saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:saas_third_party_assurance
        questions:
          urn:intuitem:risk:req_node:appsec:saas_pci_dss:q1:
            type: unique_choice
            text: "Does the application process, store, or transmit payment card data?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:saas_pci_dss:q1:c1
                value: "No - Out of scope / Not applicable"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:saas_pci_dss:q1:c2
                value: "Yes - Payment data is processed"
                add_score: 0
                compute_result: false
                color: "#fd7e14"
          urn:intuitem:risk:req_node:appsec:saas_pci_dss:q2:
            type: unique_choice
            text: "If payment card data is processed, does the provider maintain active PCI DSS certification, provide an annual AOC, and enforce dedicated payment incident procedures with immediate notification?"
            depends_on:
              question: urn:intuitem:risk:req_node:appsec:saas_pci_dss:q1
              answers: ["urn:intuitem:risk:req_node:appsec:saas_pci_dss:q1:c2"]
              condition: any
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:saas_pci_dss:q2:c1
                value: "Yes"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:saas_pci_dss:q2:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"

      # Section 21: Gestion des non-conformités
      - urn: urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_non_conformity_remediation
        name: "Non-Conformity Management & Contractual Remedies (Gestion des non-conformités)"
        description: "Implement corrective actions for breaches, deliver documented remediation plans, establish compensatory controls, and grant rights of access suspension or contract termination for severe breaches."
        annotation: >
          Exigences contractuelles :
          - Mise en œuvre de mesures correctives en cas de manquement.
          - Production d'un plan de remédiation documenté.
          - Mise en place de mesures compensatoires lorsque nécessaire.
          - Possibilité de suspension des accès ou de résiliation contractuelle en cas de manquement grave ou répété.
        typical_evidence: >
          - Master Services Agreement clause detailing breach remediation cure periods (e.g. 30 days)
          - Corrective Action Plan (CAP) escalation workflow and contract termination rights
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:contractual_gap
        implementation_groups: ["saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:saas_contract
        questions:
          urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation:q1:
            type: unique_choice
            text: "Does the contract mandate formal remediation plans and compensatory measures for identified security gaps, with explicit rights to suspend access or terminate for repeated breaches?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation:q1:c1
                value: "Yes"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation:q1:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"

      # === COMPLETION SPLASH SCREEN ===
      - urn: urn:intuitem:risk:req_node:appsec:thank_you_splash
        assessable: false
        display_mode: splash
        depth: 1
        ref_id: thank_you_splash
        name: "Assessment Completed - Thank You"
        description: >
          Thank you for completing the Application Security Assessment (AppSec).

          Your responses have been successfully submitted and will serve as the baseline for evaluating application risk scenarios and governing cybersecurity controls.

          Next Steps:
          1. Automated Risk Modeling: CISO Assistant will automatically calculate likelihood and impact across applicable threat scenarios based on your answers.
          2. Controls Verification: Recommended and applied technical controls will be linked to mitigate identified risk scenarios.
          3. Governance & Follow-Up: If any compliance gaps, findings, or security exceptions are required, the security team will reach out to coordinate remediation planning and stakeholder sign-offs.

          If your application architecture, hosting model, or exposure profile changes in the future, please re-evaluate this assessment.
        annotation: >
          Concluding splash screen expressing gratitude to the respondent and detailing subsequent compliance verification, risk assessment, and remediation workflows.
        implementation_groups: ["info"]

