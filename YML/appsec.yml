        ref_id: data_exchange
        name: Control of Data Exchange & Encryption in Transit
        description: "Govern external B2B data exchanges, API integrations, webhooks, and third-party data flows via encryption in transit (TLS 1.2+, mTLS) and formal agreements (DPA/DTA) for self-hosted applications (excluding B2C interactions, as customers do not receive data the same way B2B partners do)."
        annotation: >
          Cross-organizational B2B data sharing, API integrations, and external transmission governance for self-hosted delivery models (Custom and COTS):
          - Verification of external B2B data exchange boundaries (excluding B2C interactions, as individual customers do not receive data the same way B2B partners or third-party organizations do).
          - Cryptographic protection during network transmission across external boundaries enforcing modern protocols (TLS 1.2+, TLS 1.3, HTTPS with HSTS, mTLS).
          - Outbound and inbound data exchanges governed by formal information sharing agreements (DTA / DPA / NDA).
          - Note for SaaS: Third-party SaaS applications inherently and unconditionally exchange data with the SaaS provider outside the corporate perimeter. Data transfer governance, DPAs, and confidentiality protections are governed directly via Chapter 10 (saas_contract_compliance).
        typical_evidence: >
