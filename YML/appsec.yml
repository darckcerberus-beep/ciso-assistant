        ref_id: file_upload_security
        name: File Upload Security & Malware Hygiene
        description: "Enforce strict file upload validation (magic bytes, path isolation, randomized filenames) and segregated storage with automated malware scanning."
        annotation: >
          File upload pipeline protections for custom software:
          - Gating check: Determine if file upload capabilities exist in the application.
          - Server-side magic-byte inspection (verifying true MIME type irrespective of user-supplied Content-Type headers or file extensions).
          - Path isolation and randomized UUID storage filenames preventing directory traversal (Zip Slip) and webshell execution.
          - Automated anti-malware / antivirus scanning before ingestion and storage in dedicated non-executable object stores (e.g. private S3 buckets served via presigned URLs).
        typical_evidence: >
          - Server-side file upload handler implementation with magic-byte validation
          - Object storage bucket policy configuration proving non-executable permissions and presigned URL access
          - Automated malware scanning pipeline logs (e.g. ClamAV, AWS GuardDuty S3 Malware Protection)
        vulnerabilities:
