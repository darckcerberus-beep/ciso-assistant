          - Internet-facing: Accessible directly over the public Internet (customer portals, public web apps, mobile backends). Triggers the Internet-Facing track (internet_facing) for perimeter controls. Note: For third-party SaaS applications, operational controls (vendor WAF, anti-DDoS, and independent penetration testing) cannot be performed directly by the client and are governed contractually in Chapter 10.
        typical_evidence: >
          - Network zoning diagram showing DMZ, perimeter firewalls, and reverse proxies
          - DNS configuration and IP address allocation records
        implementation_groups: ["info"]
        questions:
