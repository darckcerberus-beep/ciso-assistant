      # Section 21: Non-Conformity Management & Contractual Remedies
      - urn: urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_non_conformity_remediation
        name: "Non-Conformity Management & Contractual Remedies"
        description: "Implement corrective actions for breaches, deliver documented remediation plans, establish compensatory controls, and grant rights of access suspension or contract termination for severe breaches."
        annotation: >
          Contractual requirements:
          - Formal remediation plan and timeline for identified security non-conformities.
          - Implementation of compensatory controls where immediate remediation is not feasible.
          - Contractual right to suspend access or terminate agreement for repeated or critical security breaches.
        typical_evidence: >
          - Master Services Agreement clause detailing breach remediation cure periods (e.g. 30 days)
          - Corrective Action Plan (CAP) escalation workflow and contract termination rights
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:contractual_gap
        implementation_groups: ["saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:saas_contract
        questions:
          urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation:q1:
            type: unique_choice
            text: "Does the contract mandate formal remediation plans and compensatory measures for identified security gaps, with explicit rights to suspend access or terminate for repeated breaches?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation:q1:c1
                value: "Yes"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:saas_non_conformity_remediation:q1:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"

      # === COMPLETION SPLASH SCREEN ===
      - urn: urn:intuitem:risk:req_node:appsec:thank_you_splash
        assessable: false
        display_mode: splash
        depth: 1
        ref_id: thank_you_splash
        name: "Assessment Completed - Thank You"
        description: |
          ### Thank you for completing the Application Security Assessment (AppSec)!

          Your responses have been successfully submitted and will serve as the baseline for evaluating application risk scenarios and governing cybersecurity controls.

          #### Next Steps:
          1. **Automated Risk Modeling:** CISO Assistant will automatically calculate likelihood and impact across applicable threat scenarios based on your answers.
          2. **Controls Verification:** Recommended and applied technical controls will be linked to mitigate identified risk scenarios.
          3. **Governance & Follow-Up:** If any compliance gaps, findings, or security exceptions are required, the security team will reach out to coordinate remediation planning and stakeholder sign-offs.

          > **Note:** If your application architecture, hosting model, or exposure profile changes in the future, please re-evaluate this assessment.
        annotation: >
          Concluding splash screen expressing gratitude to the respondent and detailing subsequent compliance verification, risk assessment, and remediation workflows.
        implementation_groups: ["info", "baseline", "custom_app", "cots_app", "saas_app", "saas_uncertified", "internet_facing"]

