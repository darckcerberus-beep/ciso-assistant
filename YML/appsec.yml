        questions:
          urn:intuitem:risk:req_node:appsec:saas_governance_and_policy:q1:
            type: unique_choice
            text: "Does the SaaS provider maintain an Information Security Policy based on a recognized framework (such as ISO 27001), updated at least annually?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:saas_governance_and_policy:q1:c1
                value: "Yes"
                add_score: 50
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:saas_governance_and_policy:q1:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
