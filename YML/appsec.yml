      # Requirement: Application Availability & Business Criticality
      - urn: urn:intuitem:risk:req_node:appsec:availability_classification
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: availability_classification
        name: "Application Availability & Business Criticality"
        description: "Application availability tiers and Maximum Tolerable Downtime (MTD) recovery priorities."
        annotation: >
          Business continuity and operational resilience profiling:
          - Tier 4 - Non-Critical: MTD > 72 hours; batch processing, non-time-sensitive internal tools.
          - Tier 3 - Medium / Tolerable: MTD <= 24 hours; internal business operations.
          - Tier 2 - High / Sensitive: MTD <= 4 hours; customer-facing services or core operational systems.
          - Tier 1 - Mission-Critical: MTD < 1 hour; real-time transactional, payment, or life-safety applications.
        typical_evidence: >
          - Business Impact Analysis (BIA) extract or Service Tier classification charter
          - Enterprise CMDB / Service Catalog entry defining service RTO/RPO/MTD targets
        implementation_groups: ["info"]
        questions:
          urn:intuitem:risk:req_node:appsec:availability_classification:q1:
            type: unique_choice
            text: "What is the maximum tolerable downtime (MTD) / business recovery objective for this application?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:availability_classification:q1:c1
                value: "Tier 4 - Non-Critical (MTD > 72 hours; batch processing, internal non-time-sensitive tools)"
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:availability_classification:q1:c2
                value: "Tier 3 - Medium / Tolerable (MTD <= 24 hours; internal business operations)"
                color: "#17a2b8"
              - urn: urn:intuitem:risk:req_node:appsec:availability_classification:q1:c3
                value: "Tier 2 - High / Sensitive (MTD <= 4 hours; customer-facing services or core operational systems)"
                color: "#fd7e14"
              - urn: urn:intuitem:risk:req_node:appsec:availability_classification:q1:c4
                value: "Tier 1 - Critical / Mission-Critical (MTD < 1 hour; real-time transactional, payment, or life-safety)"
