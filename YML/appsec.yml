# ============================================================================
# Application Security Assessment Framework (AppSec) - CISO Assistant Library
# ============================================================================
# This YAML file defines an enriched, comprehensive application security framework
# based on the Multi-level Data Protection Policy (newDPP).
# It extends foundational data protection with broad Application Security (AppSec)
# domains inspired by OWASP ASVS, ISO/IEC 27001 (Annex A.8), and DevSecOps best practices:
# - Application Profiling, Classification & Exposure Governance
# - Identity, Authentication, MFA & Role-Based Access Control (RBAC)
# - Input Validation, Injection Defenses & Web Security Controls
# - Centralized Secrets Management & Cryptography (Transit & Rest)
# - Secure SDLC, Automated CI/CD Testing (SAST/DAST) & Supply Chain Security (SCA/SBOM)
# - API Security, Rate Limiting & Controlled Data Exchanges
# - Non-Production Data Sanitization & Compliant Data Destruction
# - Security Event Logging, Tamper-Resistance & Centralized SIEM Monitoring
# - Regular Penetration Testing, Patch SLAs & Backup / Disaster Recovery
# - Third-Party SaaS Contractual Governance
# ============================================================================

urn: urn:intuitem:risk:library:appsec
locale: en
ref_id: "appsec"
name: "Application Security Assessment Framework (AppSec)"
description: >
  Comprehensive application security evaluation framework based on Multi-level DPP,
  extending baseline data protection with full-spectrum AppSec requirements:
  Identity & Access Management, Secure SDLC, Input Validation, Cryptography & Secrets,
  API Security, Security Logging, Resilience, Vulnerability Management, and Third-Party Risk.
  Supports both internally managed applications and SaaS solutions whose security controls
  are defined with a contract and certified via third-party audit reports (SOC 2, ISO 27001).
copyright: DCME Corp
version: 26
publication_date: 2026-11-05
provider: DCME Corp
packager: DCME Corp
common_objects_file: "YML/appsec_objects.yml"

objects:

  # ========================================================================
  # FRAMEWORK - Assessment framework with chapters, requirements & questions
  # ========================================================================
  framework:
    urn: urn:intuitem:risk:framework:appsec
    ref_id: "appsec"
    name: "Application Security Assessment Framework (AppSec)"
    description: "Comprehensive application security assessment framework based on Multi-level DPP enriched with OWASP ASVS and DevSecOps controls"

    # Implementation groups define assessment tracks/profiles
    implementation_groups_definition:
      - urn: urn:intuitem:risk:ig:appsec:info
        name: "Application information & Governance"
        ref_id: "info"
        description: "Basic profiling and governance context of the application"
        default_selected: true
      - urn: urn:intuitem:risk:ig:appsec:custom_app
        name: "Custom Software Track (In-house Development)"
        ref_id: "custom_app"
        description: "Requirements for custom in-house software created and deployed by our teams (Dev & Hosting: code-level session management, input validation, output encoding, debug suppression, and CI/CD SAST/DAST/SCA/SBOM)"
      - urn: urn:intuitem:risk:ig:appsec:cots_app
        name: "Bought Software Track (COTS / Vendor Package)"
        ref_id: "cots_app"
        description: "Requirements for bought commercial off-the-shelf software deployed and hosted by our teams (Hosting only: deployment hardening baselines, vendor patch management SLA, reverse proxy & WAF protection, generic error pages)"
      - urn: urn:intuitem:risk:ig:appsec:saas_app
        name: "SaaS Application Track"
        ref_id: "saas_app"
        description: "Core contractual, data protection, and tenant security requirements for third-party SaaS applications (Master SaaS Agreement, confidentiality & encryption, admin MFA, EU data residency, audit rights, PCI DSS, and non-conformity remedies)"
      - urn: urn:intuitem:risk:ig:appsec:saas_uncertified
        name: "Uncertified SaaS Vendor Track (Detailed Security Assessment)"
        ref_id: "saas_uncertified"
        description: "Detailed security and operational control requirements for SaaS applications whose vendor is not ISO/IEC 27001 or SOC 2 Type II certified (ISMS, security awareness, internal privileges, logging, workstation/mobile security, network/environment isolation, secure SDLC, web app security, penetration testing & SLAs, physical security, backup/BCP, and subcontractor management)"
      - urn: urn:intuitem:risk:ig:appsec:baseline
        name: "Application Security Baseline"
        ref_id: "baseline"
        description: "Core application security baseline requirements applicable to all applications (Governance, Profiling, Authentication & Access Control)"
        default_selected: true
      - urn: urn:intuitem:risk:ig:appsec:internet_facing
        name: "Internet-Facing Application Track"
        ref_id: "internet_facing"
        description: "Requirements for applications exposed to the Internet"

    # ====================================================================
    # REQUIREMENT NODES - Hierarchical assessment structure
    # ====================================================================
    requirement_nodes:
      # === INTRODUCTORY SPLASH SCREEN ===
      - urn: urn:intuitem:risk:req_node:appsec:instructions_splash
        assessable: false
        display_mode: splash
        depth: 1
        ref_id: instructions_splash
        name: "Instructions & Guidance"
        description: |
          ### Welcome to the Application Security Assessment (AppSec)!

          This questionnaire helps evaluate your application's security posture, data protection controls, and operational resilience. Whether you are developing **custom software**, deploying **commercial software (COTS)**, or onboarding a **third-party SaaS solution**, this assessment is tailored to your setup.

          #### How to complete this assessment:
          1. **Answer accurately:** Select the choices that best reflect your application's current architecture and operations.
          2. **Tailored questions:** Initial questions in *Chapter 1* (data sensitivity, hosting model, and exposure) automatically customize the remaining sections so you only see what is relevant to your application.
          3. **Keep evidence handy:** Where applicable, have supporting documentation ready (such as architecture diagrams, CI/CD pipeline settings, or vendor SOC 2 / ISO 27001 reports).
          4. **Save as you go:** You can complete this questionnaire progressively at your own pace.

          > **Note:** Once submitted, CISO Assistant will automatically evaluate risk scenarios and link recommended security controls. If you need any help along the way, feel free to reach out to the security team!
        annotation: >
          Introductory splash screen explaining questionnaire navigation, answering guidelines, dynamic section triggering based on data classification and hosting model, and audit evidence expectations.
        implementation_groups: ["info", "baseline"]

      # === CHAPTER 1: APPLICATION INFORMATION & GOVERNANCE ===
      - urn: urn:intuitem:risk:req_node:appsec:info
        assessable: false
        depth: 1
        ref_id: info
        name: "Application Information & Governance"
        description: "Basic application profiling, ownership, hosting, exposure, and architecture context."
        annotation: >
          High-level application profiling and organizational governance context. Captures essential metadata to determine ownership, data sensitivity, and applicable compliance baseline tracks.
        implementation_groups: ["info", "baseline"]

      # Requirement: Identify stakeholders for the application
      - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: stakeholder_identification
        name: Stakeholder identification
        description: "Stakeholders have been identified for the application"
        annotation: >
          Accountability and ownership governance. Ensures that every application deployed across the organization has clearly identified, registered, and active business, IT, and data governance points of contact.
        typical_evidence: >
          - Enterprise Architecture repository extract (e.g. LeanIX application fact sheet)
          - CMDB / Service Catalog configuration item entry with assigned technical & business owners
          - Data Governance RACI matrix or formal appointment documentation
        vulnerabilities: ["urn:intuitem:risk:vulnerability:appsec:unclear_accountability"]
        implementation_groups: ["baseline"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:stakeholder_designation
        questions:
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:q1:
            type: unique_choice
            text: "Is there a designated business contact? (Designated business owner or product sponsor accountable for business processes, functionality, and risk acceptance)"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q1:c1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q1:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:q2:
            type: unique_choice
            text: "Is there a designated IT contact? (Technical lead or engineer responsible for maintenance, infrastructure, deployment, and operational support)"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q2:c1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q2:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:q3:
            type: unique_choice
            text: "Is there a designated data owner? (Data steward or governance officer responsible for information classification, access authorization, and regulatory compliance)"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q3:c1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q3:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:q4:
            type: unique_choice
            text: "Is the information about stakeholders updated in LeanIX / CMDB? (Stakeholder assignments registered and kept current in the enterprise inventory or service catalog)"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q4:c1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:q4:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"

      # Requirement: Classify data handled by application
      - urn: urn:intuitem:risk:req_node:appsec:data_classification
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: data_classification
        name: Data classification
        description: "Classify data handled by the application according to organizational policy."
        annotation: |
          ### Enterprise Data Classification & Governance Guidance

          > **Governance Principles**:
          > - **Data Ownership**: Data owners must confirm the appropriate level and review it as operational risks change.
          > - **Public Release**: Requires explicit formal approval prior to publication.
          > - **Dataset Aggregation**: Combining lower-tier datasets (e.g. customer identities + detailed purchase histories) may escalate the overall classification.

          #### Classification Reference Matrix

          | Level | Classification | Core Enterprise Examples | Online-Retail Proposed Starting Points |
          | :---: | :--- | :--- | :--- |
          | **0** | **PUBLIC** | • Marketing materials<br>• Press releases<br>• Public internet information | • Published product descriptions, images & size guides<br>• Published retail prices & promotional offers<br>• Published delivery, returns & refund policies |
          | **1** | **INTERNAL** | • Sales figures<br>• Organisational charts | • Routine warehouse SOPs (without security details)<br>• Internal staff training materials<br>• Routine aggregated order-volume dashboards |
          | **2** | **CONFIDENTIAL** | • Supplier contracts<br>• Employee appraisals | • Customer names, emails, phones & delivery addresses<br>• Customer order histories, return & refund records<br>• Customer-service conversations & complaints<br>• Supplier purchase prices, discounts & margins<br>• Unreleased campaign plans & pricing strategies<br>• Detailed inventory levels & demand forecasts |
          | **3** | **SENSITIVE - SECRET** | • Payment data<br>• Social Security numbers (SSN / national IDs) | • Customer payment-card data & refund bank accounts<br>• Production admin credentials, API secrets & keys<br>• Bulk customer identity + purchase history exports<br>• Detailed fraud-detection evasion rules & thresholds |

          #### Classification Details & Handling Rules
          - **PUBLIC (Level 0)**: Information intended for public distribution with zero confidentiality impact.
          - **INTERNAL (Level 1)**: Operational data for internal workforce use; disclosure would cause minor organizational friction.
          - **CONFIDENTIAL (Level 2)**: Sensitive business, customer, or employee data requiring restricted access controls and encryption.
          - **SENSITIVE - SECRET (Level 3)**: Critical enterprise assets, cryptographic keys, root credentials, payment cardholder data, or national identifiers requiring stringent isolation and executive authorization.
        typical_evidence: |
          - **Data Classification Registry / Form**: Formally validated and signed off by the Data Owner
          - **Information Asset Register (CMDB)**: Entry reflecting confirmed sensitivity tiers across application data stores
          - **Data Flow Diagram (DFD)**: Tagged with sensitivity markers on datastores, message queues, and external interfaces
          - **DPIA / PCI-DSS AoC**: Formal impact assessments or compliance attestations (for cardholder or secret personal data)
        reference_controls: ["urn:intuitem:risk:control:appsec:identify_data_classification"]
        vulnerabilities: ["urn:intuitem:risk:vulnerability:appsec:lack_of_data_classification"]
        implementation_groups: ["baseline"]
        questions:
          urn:intuitem:risk:req_node:appsec:data_classification:q1:
            type: unique_choice
            text: "What is the maximum classification level handled? (Public, Internal, Confidential, or Secret according to organizational data classification policy)"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c1
                value: "Public"                
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c2
                value: "Internal"            
                color: "#fd7e14"
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c3
                value: "Confidential"
                color: "#fd7e14"
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c4
                value: "Secret"
                color: "#dc3545"


      # Requirement: Determine hosting model, network exposure & SaaS vendor certification
      - urn: urn:intuitem:risk:req_node:appsec:hosting
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: hosting
        name: Application Delivery & Network Exposure
        description: "Determine the application delivery and hosting model (Custom software, Bought COTS, or third-party SaaS), its network exposure (for self-hosted apps), and SaaS vendor ISO/IEC 27001 or SOC 2 Type II certification status."
        annotation: >
          Application delivery, hosting model, network exposure, and SaaS vendor certification classification:
          - Custom software created and deployed by my teams: In-house developed software where source code is written and maintained internally. Subject to internal DevSecOps (SAST, DAST, SCA/SBOM, peer code review) and self-hosted network exposure discrimination.
          - Bought software deployed by my teams: Commercial Off-The-Shelf (COTS) or vendor software package deployed on internal infrastructure. Subject to vendor security patch management, CVE tracking, deployment configuration hardening, and self-hosted network exposure discrimination.
          - SaaS: Third-party software hosted and operated by a vendor. SaaS applications are inherently hosted on external cloud infrastructure and governed via Chapter 10 (saas_app). If the SaaS vendor is not ISO/IEC 27001 or SOC 2 Type II certified, the detailed Uncertified SaaS Vendor Track (saas_uncertified) is triggered.
          - Network exposure tier for self-hosted apps: Internal / Restricted (accessible only within corporate networks/VPN) vs Internet-facing (accessible over the public Internet, activating the internet_facing track).
        typical_evidence: >
          - Architecture design document (ADD) / System topology diagram
          - Software procurement contract, vendor license, or Git repository metadata
          - Network zoning diagram showing DMZ, perimeter firewalls, and reverse proxies
          - SaaS vendor ISO/IEC 27001 certificate or SOC 2 Type II attestation report
        implementation_groups: ["baseline"]
        questions:
          urn:intuitem:risk:req_node:appsec:hosting:q1:
            type: unique_choice
            text: "What is the delivery and hosting model of the application?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c1
                value: "Custom software created and deployed by my teams (In-house development)"
                select_implementation_groups: ["custom_app", "baseline"]
                color: "#17a2b8"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c2
                value: "Bought software deployed by my teams (COTS / Vendor package)"
                select_implementation_groups: ["cots_app", "baseline"]
                color: "#17a2b8"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c3
                value: "SaaS (Third-party software hosted and operated by a vendor)"
                select_implementation_groups: ["saas_app", "baseline"]
                color: "#17a2b8"
          urn:intuitem:risk:req_node:appsec:hosting:q2:
            type: unique_choice
            text: "What is the network exposure of the application?"
            depends_on:
              question: urn:intuitem:risk:req_node:appsec:hosting:q1
              answers:
                - urn:intuitem:risk:req_node:appsec:hosting:q1:c1
                - urn:intuitem:risk:req_node:appsec:hosting:q1:c2
              condition: any
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q2:c1
                value: "Internal / Restricted Network only"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q2:c2
                value: "Internet-facing (Public Web / Mobile API)"
                add_score: 100
                compute_result: true
                select_implementation_groups: ["internet_facing"]
                color: "#fd7e14"
          urn:intuitem:risk:req_node:appsec:hosting:q3:
            type: unique_choice
            text: "Is the SaaS vendor ISO/IEC 27001 or SOC 2 Type II certified?"
            depends_on:
              question: urn:intuitem:risk:req_node:appsec:hosting:q1
              answers:
                - urn:intuitem:risk:req_node:appsec:hosting:q1:c3
              condition: any
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q3:c1
                value: "Yes - The SaaS vendor holds an active ISO/IEC 27001 certification or SOC 2 Type II report"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q3:c2
                value: "No - The SaaS vendor is not ISO/IEC 27001 or SOC 2 Type II certified"
                add_score: 100
                compute_result: true
                select_implementation_groups: ["saas_uncertified"]
                color: "#fd7e14"

      # === SPLASH SCREEN: TECHNICAL SECURITY ASSESSMENT TRANSITION ===
      - urn: urn:intuitem:risk:req_node:appsec:baseline_splash
        assessable: false
        display_mode: splash
        depth: 1
        ref_id: baseline_splash
        name: "Technical Security Assessment - Overview"
        description: |
          ### Baseline Profiling Complete: Technical Security Assessment

          You have completed the baseline profiling questions covering application ownership, data classification, hosting model, and network exposure.

          The following chapters evaluate the **technical cybersecurity controls** applicable to your application. Based on your profiling answers, subsequent sections are dynamically tailored:
          - **Identity, Authentication & Access Control:** Federated SSO, Multi-Factor Authentication (MFA), and role-based permissions.
          - **Application Architecture & Defenses:** Secure design patterns, input validation, output encoding, or third-party vendor assurance depending on your delivery track (Custom in-house, Bought COTS, or SaaS).
          - **Secrets & Infrastructure Security:** Hardening baselines, secret management, and encryption at rest and in transit.
          - **Perimeter & Edge Defenses:** If your application is exposed to the public Internet, relevant edge protections (WAF, anti-DDoS, and penetration testing) will be evaluated.
          - **Resilience & Governance:** Audit logging, data protection, and incident response readiness.

          > **Note:** Only the technical requirements relevant to your application's delivery track and network exposure tier will be in scope.

          Please proceed to the next section to begin the technical evaluation.
        annotation: >
          Generic transition splash screen concluding the baseline profiling phase and introducing upcoming technical security questions across dynamically triggered implementation groups.
        implementation_groups: ["baseline"]

      # === CHAPTER 2: IDENTITY, AUTHENTICATION & ACCESS CONTROL ===
      - urn: urn:intuitem:risk:req_node:appsec:iam_chapter
        assessable: false
        depth: 1
        ref_id: iam_chapter
        name: "Identity, Authentication & Access Control"
        description: "Enforce strong authentication, Multi-Factor Authentication (MFA), federated SSO, and granular authorization controls."
        annotation: >
          Comprehensive IAM controls aligned with OWASP ASVS V2 (Authentication) and V4 (Access Control).
        implementation_groups: ["custom_app", "cots_app", "saas_app"]

      # Requirement: Centralized Identity, Authentication & MFA
      - urn: urn:intuitem:risk:req_node:appsec:authentication_and_mfa
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:iam_chapter
        ref_id: authentication_and_mfa
        name: "Centralized Identity, Authentication & MFA"
        description: "Enforce centralized enterprise Identity Provider (SSO), strong credential hygiene, and Multi-Factor Authentication (MFA) for administrative and privileged access."
        annotation: >
          Comprehensive IAM authentication controls. When an application delegates authentication to an enterprise
          Identity Provider (SAML 2.0 / OIDC SSO), authentication, password policies, and MFA are centrally governed
          at the corporate IdP level. Applications using direct/local authentication must enforce strong passwords,
          brute-force protections, and mandatory administrative MFA.
        typical_evidence: >
          - Enterprise IdP federation metadata / configuration document
          - IAM identity provider policy enforcing MFA for admins
          - Brute-force lockout and rate-limiting configuration
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:weak_authentication_controls
        implementation_groups: ["custom_app", "cots_app", "saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:centralized_identity_sso
          - urn:intuitem:risk:control:appsec:enforce_mfa_and_strong_auth
        questions:
          urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q1:
            type: unique_choice
            text: "How do users authenticate to the application?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q1:c1
                value: "Enterprise SSO (SAML 2.0 / OIDC federated IdP)"
                add_score: 100
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q1:c2
                value: "Direct / Local application authentication (Username & Password)"
                add_score: 0
                compute_result: false
                color: "#fd7e14"
          urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q2:
            type: unique_choice
            text: "If direct authentication is used, are strong password policies and brute-force lockout protections implemented?"
            depends_on:
              question: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q1
              answers: ["urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q1:c2"]
              condition: any
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q2:c1
                value: "Yes"
                add_score: 50
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q2:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
          urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q3:
            type: unique_choice
            text: "If direct authentication is used, is Multi-Factor Authentication (MFA) enforced for all administrative and privileged access?"
            depends_on:
              question: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q1
              answers: ["urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q1:c2"]
              condition: any
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q3:c1
                value: "Yes"
                add_score: 50
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:authentication_and_mfa:q3:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"

      # Requirement: Authorization, Least Privilege & RBAC
      - urn: urn:intuitem:risk:req_node:appsec:access_control_and_rbac
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:iam_chapter
        ref_id: access_control_and_rbac
        name: "Authorization, RBAC, IGA & Access Recertifications"
        description: "Enforce least privilege via granular RBAC/ABAC, integrate with enterprise Identity Governance & Administration (SailPoint), and perform periodic access recertifications."
        annotation: >
          Enforces server-side object-level and function-level access control on every request (preventing BOLA, IDOR, and privilege escalation), with enterprise IGA (SailPoint) and periodic entitlement recertifications across all applications.
        typical_evidence: >
          - RBAC matrix detailing roles and permissions
          - Enterprise IGA / SailPoint onboarding configuration and application connector setup
          - Periodic User Access Review (UAR) and entitlement recertification campaign sign-offs in SailPoint
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:broken_authorization_rbac
        implementation_groups: ["custom_app", "cots_app", "saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:enforce_least_privilege_rbac
        questions:
          urn:intuitem:risk:req_node:appsec:access_control_and_rbac:q1:
            type: unique_choice
            text: "Have you defined roles and permissions for the application? (Is access controlled via granular roles (RBAC/ABAC) enforcing least privilege across all business functions and APIs?)"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:access_control_and_rbac:q1:c1
                value: "Yes"
                add_score: 50
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:access_control_and_rbac:q1:c2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
