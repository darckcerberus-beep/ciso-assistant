      # Section 7: Workstation & Endpoint Security
      - urn: urn:intuitem:risk:req_node:appsec:saas_workstation_security
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_workstation_security
        name: "Workstation & Endpoint Security"
        description: "Enforce auto-lock, local firewalls, EDR/antivirus, secure system configuration, vulnerability/patch management, full-disk encryption, and lost equipment procedures."
        annotation: >
          Contractual requirements:
          - Mandatory EDR (Endpoint Detection & Response) and next-gen antivirus deployed across 100% of provider workstations, administrative bastions, and support endpoints with access to customer tenant environments.
          - Workstation auto-lock after inactivity (<= 15 minutes).
          - Active host-based firewalls and secure baseline OS configurations.
          - Vulnerability and security patch management program (Critical patches applied <= 14 days).
          - Full-disk encryption on provider laptops and removable storage media.
          - Formal procedure for lost, stolen, or compromised equipment with 48h customer breach notification SLA.
        typical_evidence: >
          - Executed SaaS Agreement / Security Exhibit mandating vendor EDR deployment and antimalware controls
          - Vendor SOC 2 Type II assurance report (specifically Trust Services Criteria CC6.8 / CC7.1) verifying endpoint malware detection and EDR controls
          - ISO/IEC 27001:2022 Statement of Applicability confirming control A.8.7 (Protection against malware)
          - Endpoint baseline hardening policy and EDR deployment coverage attestation across provider staff and administrative bastions
          - Disk encryption enforcement report (BitLocker / FileVault) and lost equipment SOP
        vulnerabilities:
