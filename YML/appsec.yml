      # Section 5: Gestion des habilitations
      - urn: urn:intuitem:risk:req_node:appsec:saas_entitlements_and_privileges
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_entitlements_and_privileges
        name: "Privilege Governance, IGA & Access Recertifications (Gestion des habilitations)"
        description: "Apply least privilege, restrict administrator rights, maintain privileged accounts inventory, support enterprise IGA (SailPoint) integration, and conduct periodic access recertifications."
        annotation: >
          Exigences contractuelles :
          - Appliquer le principe du moindre privilège.
          - Limiter les droits administrateurs aux seules personnes autorisées.
          - Maintenir un inventaire des comptes à privilèges.
          - Réaliser une revue annuelle des droits standards.
          - Réaliser une revue semestrielle des droits à privilèges élevés.
          - Réviser les accès lors des changements de poste.
          - Permettre l'intégration avec les solutions de gouvernance des identités (IGA / SailPoint).
        typical_evidence: >
          - Inventory register of privileged and administrative accounts
          - Semi-annual privileged access review audit reports and sign-offs
          - SailPoint IGA integration connector documentation and entitlement aggregation logs
          - Annual standard rights and semi-annual privileged rights recertification campaign reports
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:broken_authorization_rbac
        implementation_groups: ["saas_app"]
        reference_controls:
