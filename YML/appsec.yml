      # Section 6: Journalisation et gestion des incidents
      - urn: urn:intuitem:risk:req_node:appsec:saas_logging_and_incidents
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_logging_and_incidents
        name: "Logging & Incident Management (Journalisation et gestion des incidents)"
        description: "Log user and admin actions, ensure log tamper-resistance, continuously monitor security events, and notify incidents within 48 hours."
        annotation: >
          Exigences contractuelles :
          - Journaliser les accès, connexions, déconnexions et actions effectuées.
          - Protéger les journaux contre toute modification ou accès non autorisé.
          - Surveiller régulièrement les événements de sécurité.
          - Notifier tout incident ou anomalie de sécurité dans un délai maximal de 48 heures après sa découverte.
        typical_evidence: >
          - Audit logging configuration and log retention policy (>= 12 months)
          - Tamper-resistance architecture proof (WORM storage / cryptographic sealing)
          - Contractual 48-hour incident notification SLA clause and incident response plan
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:insufficient_security_logging
