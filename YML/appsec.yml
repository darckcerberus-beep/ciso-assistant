      # Section 7: Sécurisation des postes de travail
      - urn: urn:intuitem:risk:req_node:appsec:saas_workstation_security
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_workstation_security
        name: "Workstation & Endpoint Security (Sécurisation des postes de travail)"
        description: "Enforce auto-lock, local firewalls, EDR/antivirus, secure system configuration, vulnerability/patch management, full-disk encryption, and lost equipment procedures."
        annotation: >
          Exigences contractuelles :
          - Verrouillage automatique des sessions après inactivité.
          - Pare-feu local activé.
          - Antivirus, EDR ou solution équivalente déployée et mise à jour.
          - Configuration sécurisée des systèmes et logiciels.
          - Programme de gestion des vulnérabilités et des correctifs.
          - Chiffrement des postes mobiles et supports amovibles.
          - Procédure de gestion des équipements perdus, volés ou compromis.
        typical_evidence: >
          - Endpoint baseline hardening policy and GPO / Intune configuration profiles
          - EDR deployment coverage report and agent version compliance telemetry
          - Disk encryption enforcement report (BitLocker / FileVault) and lost equipment SOP
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:unverified_saas_security
        implementation_groups: ["saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:saas_contract
        questions:
          urn:intuitem:risk:req_node:appsec:saas_workstation_security:q1:
            type: unique_choice
            text: "Are provider workstations protected by session auto-lock after inactivity, active local firewalls, hardened configurations, and updated EDR/antivirus?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:saas_workstation_security:q1:c1
                value: "Yes"
                add_score: 50
