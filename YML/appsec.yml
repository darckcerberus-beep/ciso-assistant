        - urn:intuitem:risk:threat:appsec:unauthorized_access

    - urn: urn:intuitem:risk:vulnerability:appsec:vulnerable_dependencies
      ref_id: vulnerable_dependencies
      name: "Vulnerable third-party dependencies"
      description: "Use of outdated open-source libraries or container base images containing known security vulnerabilities."
      associated_controls:
        - urn:intuitem:risk:control:appsec:automated_devsecops_testing
        - urn:intuitem:risk:control:appsec:supply_chain_dependency_management
      reference_controls:
        - urn:intuitem:risk:control:appsec:automated_devsecops_testing
        - urn:intuitem:risk:control:appsec:supply_chain_dependency_management
      threats:
        - urn:intuitem:risk:threat:appsec:supply_chain_tampering
        - urn:intuitem:risk:threat:appsec:unauthorized_access

    - urn: urn:intuitem:risk:vulnerability:appsec:insufficient_security_logging
      ref_id: insufficient_security_logging
      name: "Insufficient security logging and monitoring"
      description: "Failure to generate, protect, or monitor audit logs for security-relevant application events."
      associated_controls:
        - urn:intuitem:risk:control:appsec:centralized_security_logging
      reference_controls:
        - urn:intuitem:risk:control:appsec:centralized_security_logging
      threats:
        - urn:intuitem:risk:threat:appsec:undetected_intrusion
        - urn:intuitem:risk:threat:appsec:data_exfiltration

    - urn: urn:intuitem:risk:vulnerability:appsec:inadequate_resilience_backup
      ref_id: inadequate_resilience_backup
      name: "Inadequate backup and resilience"
      description: "Absence of automated encrypted backups and untested disaster recovery procedures."
      associated_controls:
        - urn:intuitem:risk:control:appsec:backup_and_disaster_recovery
      reference_controls:
        - urn:intuitem:risk:control:appsec:backup_and_disaster_recovery
      threats:
        - urn:intuitem:risk:threat:appsec:data_loss
        - urn:intuitem:risk:threat:appsec:service_disruption

    - urn: urn:intuitem:risk:vulnerability:appsec:unmitigated_api_abuse
      ref_id: unmitigated_api_abuse
      name: "Unmitigated API abuse and scraping"
      description: "API endpoints lacking rate limiting, schema validation, and anti-automation protections."
      associated_controls:
        - urn:intuitem:risk:control:appsec:api_security_and_rate_limiting
      reference_controls:
        - urn:intuitem:risk:control:appsec:api_security_and_rate_limiting
      threats:
        - urn:intuitem:risk:threat:appsec:service_disruption
        - urn:intuitem:risk:threat:appsec:data_exfiltration

    - urn: urn:intuitem:risk:vulnerability:appsec:untested_application_security
      ref_id: untested_application_security
      name: "Untested application security and delayed patching"
      description: "Absence of regular independent penetration testing and failure to remediate vulnerabilities within SLAs."
      associated_controls:
        - urn:intuitem:risk:control:appsec:regular_penetration_testing
      reference_controls:
        - urn:intuitem:risk:control:appsec:regular_penetration_testing
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:injection_attacks

    - urn: urn:intuitem:risk:vulnerability:appsec:unverified_saas_security
      ref_id: unverified_saas_security
      name: "Unverified SaaS security posture and missing certifications"
      description: "Reliance on an external SaaS provider without independent third-party audit reports (SOC 2 Type II, ISO 27001) or recent penetration testing."
      associated_controls:
        - urn:intuitem:risk:control:appsec:saas_contract
        - urn:intuitem:risk:control:appsec:saas_third_party_assurance
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_contract
        - urn:intuitem:risk:control:appsec:saas_third_party_assurance
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access

    - urn: urn:intuitem:risk:vulnerability:appsec:weak_tenant_isolation
      ref_id: weak_tenant_isolation
      name: "Flawed multi-tenant isolation and uncontrolled residency"
      description: "Inadequate logical tenant segregation or unverified cross-border data routing enabling cross-tenant data leakage or regulatory non-compliance."
      associated_controls:
        - urn:intuitem:risk:control:appsec:saas_tenant_isolation_and_residency
        - urn:intuitem:risk:control:appsec:saas_cryptographic_sovereignty
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_tenant_isolation_and_residency
        - urn:intuitem:risk:control:appsec:saas_cryptographic_sovereignty
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access

    - urn: urn:intuitem:risk:vulnerability:appsec:uncontrolled_vendor_access
      ref_id: uncontrolled_vendor_access
      name: "Uncontrolled vendor access, sub-processor opacity, and lock-in"
      description: "Unrestricted vendor personnel access to customer data, lack of sub-processor visibility, or absence of data exit portability."
      associated_controls:
        - urn:intuitem:risk:control:appsec:saas_vendor_access_governance
        - urn:intuitem:risk:control:appsec:saas_resilience_and_data_portability
        - urn:intuitem:risk:control:appsec:saas_subprocessor_and_supply_chain
        - urn:intuitem:risk:control:appsec:saas_telemetry_and_audit_export
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_vendor_access_governance
        - urn:intuitem:risk:control:appsec:saas_resilience_and_data_portability
        - urn:intuitem:risk:control:appsec:saas_subprocessor_and_supply_chain
        - urn:intuitem:risk:control:appsec:saas_telemetry_and_audit_export
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:supply_chain_tampering
        - urn:intuitem:risk:threat:appsec:service_disruption

  # ========================================================================
  # REFERENCE CONTROLS - Mitigation controls and recurring tasks
  # ========================================================================
  reference_controls:
    - urn: urn:intuitem:risk:control:appsec:stakeholder_designation
      ref_id: stakeholder_designation
      name: "Designate stakeholders"
      description: "Formally identify and document business owner, IT owner, and data owner for the application and keep the enterprise repository up to date."
      annotation: >
        Stakeholder designation establishes direct governance and operational accountability across business, technology, and data compliance domains.
      typical_evidence: >
        - LeanIX application fact sheet or CMDB configuration item record
        - RACI matrix documenting business, IT, and data owner responsibilities
        - Formal stakeholder appointment / delegation confirmation
        - For SaaS applications: Vendor management register and designated SaaS business/technical relationship owner
      threats:
        - urn:intuitem:risk:threat:appsec:data_loss
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual Review of Application Stakeholders"
        description: "Review and re-certify the designated business, IT, and data owners for the application in the enterprise CMDB/inventory."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:encrypt_data_in_transit
      ref_id: data_in_transit_encryption
      name: "Encrypt data in transit"
      description: "Enforce end-to-end encryption for all data flows in transit across public and private networks using strong cryptographic protocols."
      annotation: >
        Requires TLS 1.2+ / TLS 1.3 with forward secrecy cipher suites, HSTS enforcement, and mutual TLS (mTLS) for machine-to-machine service communications.
      typical_evidence: >
        - SSL/TLS configuration report (e.g. Qualys SSL Labs report / testssl.sh audit)
        - Web server / Ingress controller / Load balancer TLS configuration files
        - API gateway mTLS certificate and policy definitions
        - For SaaS applications where controls are defined with a contract: Executed SaaS agreement (MSA/DPA) mandating TLS 1.2+ encryption in transit or SOC 2 Type II report (CC6.6 / CC6.7)
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: quarterly
      task:
        name: "Quarterly TLS and Cipher Suite Audit"
        description: "Audit TLS configurations, certificate validity, and cipher suites across endpoints to ensure strict compliance with encryption-in-transit standards."
        frequency: "MONTHLY"
        interval: 3

    - urn: urn:intuitem:risk:control:appsec:encrypt_data_at_rest
      ref_id: data_at_rest_encryption
      name: "Encrypt data at rest"
      description: "Implement robust cryptographic protection for all persistent data stores, volumes, databases, and backup archives containing sensitive data."
      annotation: >
        Mandates industry-standard symmetric encryption algorithms (AES-256 / AES-GCM) with centralized, segregated key management (KMS / HSM) and automated key rotation.
      typical_evidence: >
        - Database Transparent Data Encryption (TDE) configuration
        - Cloud storage bucket / disk volume KMS encryption policy confirmation
        - Key management system (KMS) key rotation schedule and access audit logs
        - For SaaS applications where controls are defined with a contract: Executed SaaS agreement (MSA/DPA) mandating AES-256 encryption at rest or SOC 2 Type II report (CC6.1 / CC6.3)
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual Encryption Key Rotation and Storage Audit"
        description: "Verify automated cryptographic key rotation policies (KMS/HSM) and confirm encryption-at-rest enforcement across all storage volumes and databases."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:identify_data_classification
      ref_id: data_classification
      name: "Identify the data classification level"
      description: "Identify and record the classification level of the information assets processed, stored, or transmitted by the application."
      annotation: >
        Data classification drives proportional security baseline controls and dynamic implementation group activation (Public, Internal, Confidential, Secret).
      typical_evidence: >
        - Information asset register / data classification registry entry
        - Data flow diagram with data sensitivity tagging
        - Data Protection Impact Assessment (DPIA) or classification sign-off
        - For SaaS applications where controls are defined with a contract: Vendor Data Processing Agreement (DPA) specifying data classification and processing scope
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual Data Asset Classification Review"
        description: "Re-evaluate information assets processed by the application to confirm and update their security classification levels in the asset register."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:saas_contract
      ref_id: saas_contract
      name: "Sign a contract with the SaaS provider with all the adequate clauses"
      description: "Execute formal SaaS contractual agreements incorporating audit rights, incident reporting, IAM standards, and confidentiality terms."
      annotation: >
        Mandates legal, security, and compliance review of third-party SaaS contracts to ensure data protection, breach notification SLAs, and right to audit.
      typical_evidence: >
        - Executed SaaS Master Services Agreement (MSA) with Security Exhibit
        - Signed Data Processing Agreement (DPA) and Non-Disclosure Agreement (NDA)
        - Third-party audit assurance reports (SOC 2 Type II / ISO 27001 certificate)
        - For SaaS applications where controls are defined with a contract: Contractual security exhibits and SLAs defining supplier obligations and third-party audit rights
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual SaaS Provider Contract and Compliance Review"
        description: "Review SaaS provider contractual agreements, SOC 2/ISO certifications, data processing addenda, and security SLAs."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:protect_prod_data_in_non_prod
      ref_id: protect_prod_data_in_non_prod
      name: "Use hashing, encryption, anonymisation or pseudonymisation of prod data in non-production environment"
      description: "Sanitize, mask, or pseudonymize production data before replication into non-production environments to prevent unauthorized disclosure."
      annotation: >
        Non-production environments must never contain plaintext sensitive data. Automated data masking pipelines must be enforced prior to testing.
      typical_evidence: >
        - Data masking / pseudonymization procedure and tool configuration
        - Non-production database content audit verifying absence of real PII
        - Test data management policy and test environment data purge logs
        - For SaaS applications where controls are defined with a contract: SaaS agreement or DPA restricting production data to tenant sandbox environments with masking controls
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: quarterly
      task:
        name: "Quarterly Non-Production Data Sanitization Audit"
        description: "Verify that test and staging environments undergo data masking, pseudonymization, or synthetic data substitution, with no residual raw production data."
        frequency: "MONTHLY"
        interval: 3

    - urn: urn:intuitem:risk:control:appsec:information_exchange_contract
      ref_id: information_exchange_contract
      name: "Sign a contract regarding the exchange of information with all the adequate clauses"
      description: "Execute formal information exchange contracts with appropriate security, confidentiality, and data handling clauses for external transfers."
      annotation: >
        Governs external data transfers through legally binding agreements detailing authorized scope, encryption requirements, and return/destruction mandates.
      typical_evidence: >
        - Signed Data Transfer Agreement (DTA) / Cross-border transfer agreement
        - Executed bilateral Non-Disclosure Agreement (NDA)
        - Data exchange register and technical interface specification
        - For SaaS applications where controls are defined with a contract: Executed SaaS Data Processing Agreement (DPA) with Standard Contractual Clauses (SCCs)
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual Data Transfer and Information Exchange Review"
        description: "Inspect external data transfer agreements, standard contractual clauses (SCCs), and NDAs to ensure adequate data protection safeguards remain active."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:data_destruction_process
      ref_id: data_destruction_process
      name: "Write and implement a compliant data destruction process"
      description: "Establish and operationalize a verifiable data destruction process including defined roles, approved methods, and reporting upon completion."
      annotation: >
        Ensures obsolete or expired information is irrecoverably destroyed according to recognized standards (e.g. NIST SP 800-88) upon retention expiry.
      typical_evidence: >
        - Standard Operating Procedure (SOP) for data retention and disposal
        - Scheduled automated database purge scripts and deletion logs
        - Certificate of Destruction or cryptographic erasure verification report
        - For SaaS applications where controls are defined with a contract: Contractual data return and deletion clause (e.g. NIST SP 800-88, 30-day post-termination purge SLA) and vendor disposal attestation
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: biannually
      task:
        name: "Biannual Data Retention and Destruction Verification"
        description: "Execute scheduled data purging and verify cryptographic erasure or media destruction reports in accordance with the data retention policy."
        frequency: "MONTHLY"
        interval: 6

    - urn: urn:intuitem:risk:control:appsec:enforce_mfa_and_strong_auth
      ref_id: enforce_mfa_and_strong_auth
      name: "Enforce Multi-Factor Authentication (MFA) and strong authentication"
      description: "Enforce MFA for all administrative and user access, strong password policies, and brute-force protection."
      annotation: >
        Mandates phishing-resistant MFA (FIDO2/WebAuthn, TOTP) for administrative consoles, credential complexity standards, and account lockout throttling.
      typical_evidence: >
        - IAM identity provider MFA enforcement policy screenshot or export
        - Password policy configuration in directory service (min length >= 12, complexity, lockout)
        - Brute-force protection / rate-limiting configuration on login endpoints
        - For SaaS applications where controls are defined with a contract: Contractual requirement for MFA/SSO enforcement and vendor SOC 2 Type II report verifying administrative MFA (CC6.1)
      threats:
        - urn:intuitem:risk:threat:appsec:account_takeover
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: biannually
      task:
        name: "Biannual Authentication Policy and MFA Audit"
        description: "Audit MFA enforcement rates across administrative and user accounts and verify brute-force threshold controls."
        frequency: "MONTHLY"
        interval: 6

    - urn: urn:intuitem:risk:control:appsec:centralized_identity_sso
      ref_id: centralized_identity_sso
      name: "Integrate centralized Single Sign-On (SSO)"
      description: "Delegate application authentication to a corporate Identity Provider using standard federated protocols (SAML 2.0 / OpenID Connect)."
      annotation: >
        Centralizes user authentication, offboarding, and conditional access policies through corporate enterprise IdP (e.g., Entra ID, Okta, Ping Identity).
      typical_evidence: >
        - SAML 2.0 / OIDC federation configuration in application and IdP
        - Automated user provisioning (SCIM) and deprovisioning logs
        - For SaaS applications where controls are defined with a contract: SaaS subscription agreement or technical exhibit mandating enterprise SAML 2.0 / OIDC SSO integration
      threats:
        - urn:intuitem:risk:threat:appsec:account_takeover
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual SSO and Federation Review"
        description: "Review SAML/OIDC federation certificates, claim mappings, and deprovisioning workflows with the corporate IdP."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:enforce_least_privilege_rbac
      ref_id: enforce_least_privilege_rbac
      name: "Enforce least privilege and Role-Based Access Control (RBAC)"
      description: "Implement granular RBAC/ABAC enforcing least privilege across all application functions, data objects, and APIs, with periodic recertification."
      annotation: >
        Prevents Broken Object Level Authorization (BOLA/IDOR) and unauthorized privilege escalation. Every request must validate authorization at the object level.
      typical_evidence: >
        - RBAC permission matrix documenting roles and authorized operations
        - Code audit report verifying server-side object-level authorization checks
        - Periodic user access review (UAR) sign-off records
        - For SaaS applications where controls are defined with a contract: SaaS agreement and SOC 2 Type II report verifying logical tenant isolation and granular RBAC controls
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: biannually
      task:
        name: "Biannual Access Rights and Privilege Recertification"
        description: "Perform comprehensive recertification of user roles, privileged permissions, and service accounts."
        frequency: "MONTHLY"
        interval: 6

    - urn: urn:intuitem:risk:control:appsec:secure_input_validation_and_encoding
      ref_id: secure_input_validation_and_encoding
      name: "Implement server-side input validation and context-aware output encoding"
      description: "Validate all untrusted input against strict schemas, use parameterized queries / ORM, and enforce context-aware output encoding to prevent injection attacks."
      annotation: >
        Blocks SQL injection, command injection, NoSQL injection, and Cross-Site Scripting (XSS). Combines server-side validation with Content Security Policy (CSP).
      typical_evidence: >
        - Static code analysis (SAST) rule configuration demonstrating parameterized query enforcement
        - Input validation filter middleware specifications and schema validators
        - Content Security Policy (CSP) and HTTP security response headers verification report
        - For SaaS applications where controls are defined with a contract: Vendor security exhibit committing to OWASP Top 10 defenses and SOC 2 Type II report (CC7.1)
      threats:
        - urn:intuitem:risk:threat:appsec:injection_attacks
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: quarterly
      task:
        name: "Quarterly Input Validation and Security Headers Review"
        description: "Verify that all input validation schemas, ORM queries, and HTTP security headers (CSP, HSTS) conform to baseline standards."
        frequency: "MONTHLY"
        interval: 3

    - urn: urn:intuitem:risk:control:appsec:centralized_secrets_management
      ref_id: centralized_secrets_management
      name: "Enforce centralized secrets management"
      description: "Store all API keys, database credentials, and cryptographic certificates in dedicated secrets vaults, preventing hardcoding in repositories."
      annotation: >
        Prohibits credentials in git repositories, environment files, or container images. Mandates automated secret injection via HashiCorp Vault, AWS Secrets Manager, or Azure Key Vault.
      typical_evidence: >
        - Dedicated secrets manager vault configuration and access policy
        - Pre-commit git hook and CI/CD secret scanning tool configuration (e.g., Gitleaks, TruffleHog)
        - Secret rotation schedule and vault audit logs
        - For SaaS applications where controls are defined with a contract: SaaS contract security exhibit and SOC 2 Type II report confirming centralized HSM / KMS secrets management
      threats:
        - urn:intuitem:risk:threat:appsec:secrets_compromise
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: quarterly
      task:
        name: "Quarterly Secrets Vault and Repo Scan Audit"
        description: "Scan all source code repositories for accidental secret commits and audit secrets vault access policies and rotation status."
        frequency: "MONTHLY"
        interval: 3

    - urn: urn:intuitem:risk:control:appsec:automated_devsecops_testing
      ref_id: automated_devsecops_testing
      name: "Automate SAST and DAST security testing in CI/CD"
      description: "Integrate Static Application Security Testing (SAST) and Dynamic Application Security Testing (DAST) into automated deployment pipelines with quality gates."
      annotation: >
        Enforces automated security checks at every pull request and build. Pipeline fails on discovery of Critical or High security findings.
      typical_evidence: >
        - CI/CD pipeline definition file (.gitlab-ci.yml, Jenkinsfile, GitHub Actions workflow) with SAST/DAST steps
        - Automated quality gate rules blocking merges on High/Critical vulnerabilities
        - Historical SAST/DAST pipeline execution logs and scan reports
        - For SaaS applications where controls are defined with a contract: Vendor contract commitment to automated secure SDLC testing (SAST/DAST) and SOC 2 Type II report (CC8.1)
      threats:
        - urn:intuitem:risk:threat:appsec:injection_attacks
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: monthly
      task:
        name: "Monthly CI/CD Security Pipeline and Quality Gate Audit"
        description: "Review SAST and DAST tool integration, rule update status, and pipeline quality gate enforcement logs."
        frequency: "MONTHLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:supply_chain_dependency_management
      ref_id: supply_chain_dependency_management
      name: "Manage software supply chain and third-party dependencies"
      description: "Track dependencies via Software Bill of Materials (SBOM) and run continuous Software Composition Analysis (SCA) to detect known CVEs."
      annotation: >
        Mitigates open-source supply chain attacks. Enforces automated dependency vulnerability alerts (Dependabot, Snyk, Grype) and patch management.
      typical_evidence: >
        - Generated CycloneDX or SPDX Software Bill of Materials (SBOM) artifact
        - SCA scanner configuration and dashboard showing zero unmanaged High/Critical CVEs
        - Dependency update policy and vulnerability patch lead time metrics
        - For SaaS applications where controls are defined with a contract: SaaS contract clause committing to open-source SCA vulnerability management, patch SLAs, and SBOM availability
      threats:
        - urn:intuitem:risk:threat:appsec:supply_chain_tampering
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: monthly
      task:
        name: "Monthly Dependency Vulnerability and SBOM Review"
        description: "Inspect SCA scan results, open CVE remediation backlogs, and generated SBOMs for all production releases."
        frequency: "MONTHLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:api_security_and_rate_limiting
      ref_id: api_security_and_rate_limiting
      name: "Secure API endpoints with rate limiting and schema validation"
      description: "Deploy an API gateway enforcing rate limiting, traffic throttling, OpenAPI schema validation, and token authentication on all endpoints."
      annotation: >
        Protects APIs against credential stuffing, volumetric denial of service, and parameter tampering.
      typical_evidence: >
        - API gateway configuration (Kong, Apigee, AWS API Gateway, Envoy) showing rate limiting rules
        - OpenAPI / JSON Schema definition and runtime schema validation policy
        - WAF / bot protection rule configuration
        - For SaaS applications where controls are defined with a contract: SaaS SLA and API specification defining rate limits, DDoS mitigations, and schema validation
      threats:
        - urn:intuitem:risk:threat:appsec:service_disruption
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: quarterly
      task:
        name: "Quarterly API Gateway Policy and Rate Limiting Audit"
        description: "Review API rate limits, schema validation rules, and traffic anomaly logs across all public and internal gateways."
        frequency: "MONTHLY"
        interval: 3

    - urn: urn:intuitem:risk:control:appsec:centralized_security_logging
      ref_id: centralized_security_logging
      name: "Implement centralized security logging and SIEM alerting"
      description: "Log all authentication, authorization, and administrative events; sanitize sensitive fields; and stream logs to a centralized SIEM for real-time detection."
      annotation: >
        Logs must be tamper-resistant, synchronized via NTP, and preserved for at least 12 months. PII, passwords, and tokens must be masked prior to ingestion.
      typical_evidence: >
        - Application logging framework configuration showing log levels and security events
        - SIEM data ingestion pipeline confirmation and active alert rules
        - Log redaction filter specification proving absence of cleartext PII or credentials
        - For SaaS applications where controls are defined with a contract: Contractual commitment for audit logging, security event forwarding / SIEM integration API, and SOC 2 Type II report (CC7.2)
      threats:
        - urn:intuitem:risk:threat:appsec:undetected_intrusion
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: quarterly
      task:
        name: "Quarterly Security Logging and SIEM Alerting Audit"
        description: "Verify continuous log streaming to the SIEM, test alert triggers, and audit log data sanitization compliance."
        frequency: "MONTHLY"
        interval: 3

    - urn: urn:intuitem:risk:control:appsec:regular_penetration_testing
      ref_id: regular_penetration_testing
      name: "Conduct regular penetration testing and vulnerability management"
      description: "Perform periodic penetration tests by certified independent testers, and enforce strict remediation SLAs based on severity."
      annotation: >
        Tests must cover web, API, and cloud infrastructure components. Critical findings must be remediated within 7 days, High within 30 days.
      typical_evidence: >
        - Executive summary and technical report of recent independent penetration test
        - Vulnerability remediation tracking ticket list showing SLA compliance
        - Retesting confirmation report verifying closure of discovered vulnerabilities
        - For SaaS applications where controls are defined with a contract: Annual independent third-party penetration test executive summary and vendor contractual SLA remediation commitment
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:injection_attacks
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual Application Penetration Test and Remediation Audit"
        description: "Execute third-party penetration test, review findings with application owners, and verify timely remediation within SLA."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:backup_and_disaster_recovery
      ref_id: backup_and_disaster_recovery
      name: "Implement automated backups and disaster recovery testing"
      description: "Maintain automated encrypted backups and test restoration drills against documented RTO and RPO targets."
      annotation: >
        Backups must be immutable or stored with air-gapped / cross-account replication to withstand ransomware. Regular restoration drills validate operational recovery.
      typical_evidence: >
        - Backup policy and automated backup schedule configuration
        - Annual disaster recovery drill report documenting measured RTO and RPO
        - Backup encryption key management configuration
        - For SaaS applications where controls are defined with a contract: SaaS SLA defining guaranteed RPO and RTO, automated encrypted backup commitments, and annual DR drill attestation
      threats:
        - urn:intuitem:risk:threat:appsec:data_loss
        - urn:intuitem:risk:threat:appsec:service_disruption
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual Backup Restoration and Disaster Recovery Drill"
        description: "Execute simulated database and application restoration drill, verify data consistency, and certify RTO/RPO metrics."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:threat_modeling_and_secure_design
      ref_id: threat_modeling_and_secure_design
      name: "Conduct formal threat modeling and secure architecture review"
      description: "Perform structured threat modeling (e.g. STRIDE) and security architecture reviews during application design and prior to major releases."
      annotation: >
        Identifies design flaws early in the development lifecycle. Documents trust boundaries, data flows, and countermeasures in the architecture design.
      typical_evidence: >
        - Threat model diagram and analysis report (e.g., Microsoft Threat Modeling Tool, OWASP Threat Dragon)
        - Security architecture review sign-off document
        - Traceability matrix linking identified threats to implemented countermeasures
        - For SaaS applications where controls are defined with a contract: Vendor security whitepaper, architectural security design exhibit, or SOC 2 Type II review of secure system design
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual Security Architecture and Threat Model Review"
        description: "Review and update the application threat model and architecture documentation to account for recent feature additions and topology changes."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:saas_third_party_assurance
      ref_id: saas_third_party_assurance
      name: "Verify SaaS third-party assurance reports and certifications"
      description: "Inspect annual independent SOC 2 Type II assurance reports, ISO/IEC 27001 certifications, and third-party penetration test summaries."
      annotation: >
        Validates that the SaaS provider undergoes rigorous external audits covering AICPA Trust Services Criteria (Security, Availability, Confidentiality) and resolves Complementary User Entity Controls (CUECs).
      typical_evidence: >
        - Independent SOC 2 Type II audit report issued within the last 12 months
        - Valid ISO/IEC 27001 / ISO 27017 / ISO 27701 certificates
        - Annual third-party penetration test executive summary letter
        - For SaaS applications where controls are defined with a contract: Contractual clause guaranteeing annual delivery of SOC 2 Type II reports and third-party pentest attestations
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual SaaS Provider Third-Party Assurance Review"
        description: "Review SaaS vendor annual SOC 2 Type II report, ISO certifications, and third-party pentest summary letter."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:saas_tenant_isolation_and_residency
      ref_id: saas_tenant_isolation_and_residency
      name: "Enforce multi-tenant isolation and verify data residency"
      description: "Validate logical and architectural tenant isolation and confirm compliance with contractual geographic data residency requirements."
      annotation: >
        Prevents cross-tenant data contamination in multi-tenant architectures and ensures compliance with cross-border transfer laws (GDPR, Swiss FADP, CCPA).
      typical_evidence: >
        - Vendor architectural whitepaper detailing multi-tenant database partitioning and compute isolation
        - Cloud hosting region confirmation and Data Processing Addendum specifying primary and backup data center locations
        - For SaaS applications where controls are defined with a contract: Executed DPA specifying data residency boundaries and SOC 2 Type II CC6.6 testing verifying tenant boundary segmentation
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual SaaS Multi-Tenancy and Residency Verification"
        description: "Confirm logical tenant isolation controls and verify data remains within authorized geographic regions."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:saas_cryptographic_sovereignty
      ref_id: saas_cryptographic_sovereignty
      name: "Implement customer cryptographic key control and exit purging"
      description: "Deploy Customer-Managed Keys (BYOK/HYOK) for data at rest and mandate verifiable post-termination cryptographic erasure."
      annotation: >
        Ensures the enterprise retains cryptographic ownership over data stored in third-party clouds and guarantees irreversible purging upon subscription termination.
      typical_evidence: >
        - BYOK / Customer-Managed KMS key configuration in SaaS admin portal
        - Cloud KMS key policy and key access audit logs
        - For SaaS applications where controls are defined with a contract: Contractual data retention and destruction exhibit with Certificate of Destruction SLA (<= 30 days)
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual SaaS Cryptographic Key Governance and Deletion Terms Review"
        description: "Review BYOK/CMK key usage and recertify contractually guaranteed termination data purging procedures."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:saas_vendor_access_governance
      ref_id: saas_vendor_access_governance
      name: "Govern vendor privileged access with Customer Lockbox approval"
      description: "Require explicit customer approval prior to vendor personnel accessing customer tenant environments, backed by audit logging."
      annotation: >
        Enforces zero standing access for SaaS vendor support and operations teams, requiring explicit ticket-linked customer consent (e.g. Salesforce Customer Lockbox, Microsoft Customer Lockbox).
      typical_evidence: >
        - Customer Lockbox / Support Access approval configuration screenshot or policy export
        - SaaS administrative access audit trail showing zero unauthorized vendor access sessions
        - For SaaS applications where controls are defined with a contract: Security schedule requiring customer approval for vendor support access and vendor SOC 2 PAM review
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: biannually
      task:
        name: "Biannual SaaS Vendor Privileged Access and Lockbox Audit"
        description: "Audit vendor engineer access requests, lockbox approval records, and emergency access logs."
        frequency: "MONTHLY"
        interval: 6

    - urn: urn:intuitem:risk:control:appsec:saas_resilience_and_data_portability
      ref_id: saas_resilience_and_data_portability
      name: "Enforce SaaS availability SLAs, DR drills, and data portability"
      description: "Monitor contractual uptime SLAs, verify disaster recovery RTO/RPO drill results, and periodically test automated data extraction."
      annotation: >
        Mitigates vendor downtime impact, ransomware exposure, and vendor lock-in by maintaining verified offsite data portability.
      typical_evidence: >
        - Historical monthly SLA uptime reports and financial credit policy
        - Vendor Business Continuity / Disaster Recovery (BC/DR) annual testing executive attestation
        - For SaaS applications where controls are defined with a contract: Contractual SLA defining availability >= 99.9%, RTO/RPO limits, and frictionless programmatic data export formats
      threats:
        - urn:intuitem:risk:threat:appsec:service_disruption
        - urn:intuitem:risk:threat:appsec:data_loss
      is_recurrent: true
      cadence: biannually
      task:
        name: "Biannual SaaS SLA Review and Data Portability Test"
        description: "Review vendor availability against contractual SLAs and execute automated tenant data export drill."
        frequency: "MONTHLY"
        interval: 6

    - urn: urn:intuitem:risk:control:appsec:saas_subprocessor_and_supply_chain
      ref_id: saas_subprocessor_and_supply_chain
      name: "Govern sub-processors, cloud supply chain, and AI model usage"
      description: "Maintain oversight of vendor fourth-party sub-processors and contractually restrict unauthorized use of customer data for AI model training."
      annotation: >
        Ensures third-party supply chain visibility, right to object to new sub-processors, and legal protection against enterprise IP leakage into commercial AI models.
      typical_evidence: >
        - SaaS provider published and dated Sub-Processor Register
        - Sub-processor notification subscription confirmation (e.g., RSS / email advisory signup)
        - For SaaS applications where controls are defined with a contract: Contractual DPA clause requiring 30 days notice with right to object, and explicit ban on AI model training on customer data
      threats:
        - urn:intuitem:risk:threat:appsec:supply_chain_tampering
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      is_recurrent: true
      cadence: annually
      task:
        name: "Annual SaaS Sub-Processor Registry and AI Governance Audit"
        description: "Audit vendor sub-processor list updates, verify notification alerts, and confirm compliance with AI data protection restrictions."
        frequency: "YEARLY"
        interval: 1

    - urn: urn:intuitem:risk:control:appsec:saas_telemetry_and_audit_export
      ref_id: saas_telemetry_and_audit_export
      name: "Stream SaaS audit telemetry to centralized enterprise SIEM"
      description: "Ingest SaaS tenant administrative, authentication, and data access audit trails into enterprise SIEM platforms for continuous monitoring."
      annotation: >
        Bridges cloud SaaS visibility gaps by streaming audit telemetry into corporate SOC detection pipelines (Splunk, Microsoft Sentinel, Datadog).
      typical_evidence: >
        - SaaS audit log API integration / webhook / Amazon S3 bucket forwarding configuration
        - SIEM parser specification and active correlation alert rules for anomalous SaaS tenant behavior
        - For SaaS applications where controls are defined with a contract: SaaS SLA committing to programmatic audit log export API and immutable log retention >= 12 months
      threats:
        - urn:intuitem:risk:threat:appsec:undetected_intrusion
        - urn:intuitem:risk:threat:appsec:account_takeover
      is_recurrent: true
      cadence: quarterly
      task:
        name: "Quarterly SaaS Audit Log Streaming and SIEM Ingestion Audit"
        description: "Verify operational status of automated log streaming from SaaS provider to corporate SIEM/SOC."
        frequency: "MONTHLY"
        interval: 3

  # ========================================================================
  # FRAMEWORK - Assessment framework with chapters, requirements & questions
  # ========================================================================
  framework:
    urn: urn:intuitem:risk:framework:appsec
    ref_id: "appsec"
    name: "Application Security Assessment Framework (AppSec)"
    description: "Comprehensive application security assessment framework based on Multi-level DPP enriched with OWASP ASVS and DevSecOps controls"

    # Implementation groups define assessment tracks/profiles
    implementation_groups_definition:
      - urn: urn:intuitem:risk:ig:appsec:info
        name: "Application information & Governance"
        ref_id: "info"
        description: "Basic profiling and governance context of the application"
        default_selected: true
      - urn: urn:intuitem:risk:ig:appsec:baseline
        name: "Application Security Baseline"
        ref_id: "baseline"
        description: "Core technical application security baseline applicable to all applications"
        default_selected: true
      - urn: urn:intuitem:risk:ig:appsec:confidential_app
        name: "Confidential Application Track"
        ref_id: "confidential_app"
        description: "Requirements for applications handling Confidential data"
      - urn: urn:intuitem:risk:ig:appsec:secret_app
        name: "Secret Application Track"
        ref_id: "secret_app"
        description: "Requirements for applications handling Secret data"
      - urn: urn:intuitem:risk:ig:appsec:internet_facing
        name: "Internet-Facing Application Track"
        ref_id: "internet_facing"
        description: "Requirements for applications exposed to the Internet"
      - urn: urn:intuitem:risk:ig:appsec:saas_app
        name: "SaaS Application Track"
        ref_id: "saas_app"
        description: "Requirements and contractual governance for third-party SaaS applications where security controls are defined with a contract (e.g. MSA, DPA, SLA, SOC 2 / ISO 27001)"

    # ====================================================================
    # REQUIREMENT NODES - Hierarchical assessment structure
    # ====================================================================
    requirement_nodes:
      # === INTRODUCTORY SPLASH SCREEN ===
      - urn: urn:intuitem:risk:req_node:appsec:instructions_splash
        assessable: false
        display_mode: splash
        depth: 1
        ref_id: instructions_splash
        name: "Instructions & Guidance"
        description: >
          Welcome to the Comprehensive Application Security Assessment (AppSec).

          This framework evaluates the security posture, architecture robustness, cryptographic defenses,
          secure software development lifecycle (DevSecOps), and operational resilience of your application.

          How to complete this assessment:
          1. Answer accurately: Select the choices that best reflect the current architecture and operational state of your application.
          2. Dynamic tracks: Questions in Chapter 1 (Data Classification, Hosting Model, and Network Exposure) dynamically trigger advanced tracks:
             - Confidential / Secret Data Protection (Encryption in Transit & Rest, Non-Prod Data Masking, Compliant Destruction)
             - Internet-Facing Controls (API Rate Limiting, CSP, External Pentesting)
             - SaaS Contractual Governance (Security Exhibits, Audit Rights, Incident Reporting SLAs)
          3. SaaS Applications & Contract-Defined Controls: For third-party SaaS solutions where the codebase and infrastructure are managed by an external vendor, security controls are typically defined with a contract (Master Services Agreement, Security Exhibit, SLA, DPA) and verified through independent assurance reports (SOC 2 Type II, ISO/IEC 27001). Assessors can select "Yes - Defined with a contract" across technical controls when backed by binding vendor agreements and certifications.
          4. Evidence: For assessable requirements, ensure supporting documentation (architecture diagrams, CI/CD pipelines, KMS configs, pentest reports, or executed SaaS contracts and SOC 2 reports) can be provided upon audit review.
          5. Progress & Submission: You can complete this questionnaire progressively. Once submitted, CISO Assistant will automatically calculate likelihood and impact across all risk scenarios.
        annotation: >
          Introductory splash screen explaining questionnaire navigation, answering guidelines, dynamic section triggering based on data classification and hosting model, and audit evidence expectations.
        implementation_groups: ["info"]

      # === CHAPTER 1: APPLICATION INFORMATION & GOVERNANCE ===
      - urn: urn:intuitem:risk:req_node:appsec:info
        assessable: false
        depth: 1
        ref_id: info
        name: "Application Information & Governance"
        description: "Basic application profiling, ownership, hosting, exposure, and architecture context."
        annotation: >
          High-level application profiling and organizational governance context. Captures essential metadata to determine ownership, data sensitivity, and applicable compliance baseline tracks.
        implementation_groups: ["info"]

      # Requirement: Identify stakeholders for the application
      - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: stakeholder_identification
        name: Stakeholder identification
        description: "Stakeholders have been identified for the application"
        annotation: >
          Accountability and ownership governance. Ensures that every application deployed across the organization has clearly identified, registered, and active business, IT, and data governance points of contact.
        typical_evidence: >
          - Enterprise Architecture repository extract (e.g. LeanIX application fact sheet)
          - CMDB / Service Catalog configuration item entry with assigned technical & business owners
          - Data Governance RACI matrix or formal appointment documentation
        vulnerabilities: ["urn:intuitem:risk:vulnerability:appsec:unclear_accountability"]
        implementation_groups: ["info"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:stakeholder_designation
        questions:
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:1:
            type: unique_choice
            text: "Is there a designated business contact?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:1:choice:1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:1:choice:2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:2:
            type: unique_choice
            text: "Is there a designated IT contact?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:2:choice:1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:2:choice:2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:3:
            type: unique_choice
            text: "Is there a designated data owner?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:3:choice:1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:3:choice:2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"
          urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:4:          
            type: unique_choice
            text: "Is the information about stakeholders updated in LeanIX / CMDB?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:4:choice:1
                value: "Yes"
                add_score: 25
                compute_result: true
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:stakeholder_identification:question:4:choice:2
                value: "No"
                add_score: 0
                compute_result: false
                color: "#dc3545"

      # Requirement: Classify data handled by application
      - urn: urn:intuitem:risk:req_node:appsec:data_classification
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: data_classification
        name: Data classification
        description: "Classify data handled by the application according to organizational policy."
        annotation: >
          Data categorization according to the enterprise information security classification policy:
          - Public: Information intended for public distribution with zero confidentiality impact.
          - Internal: Operational data for internal use only; disclosure would cause minor organizational friction.
          - Confidential: Sensitive business, customer, or employee data requiring restricted access controls and encryption.
          - Secret: Highly sensitive intellectual property, cryptographic keys, or critical strategic assets requiring stringent isolation.
        typical_evidence: >
          - Data classification assessment form or registry
          - Information asset register entry
          - Data flow diagram identifying sensitivity tags on data stores and APIs
        reference_controls: ["urn:intuitem:risk:control:appsec:identify_data_classification"]
        vulnerabilities: ["urn:intuitem:risk:vulnerability:appsec:lack_of_data_classification"]
        implementation_groups: ["info"]
        questions:
          urn:intuitem:risk:req_node:appsec:data_classification:q1:
            type: unique_choice
            text: "What is the maximum classification level handled?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c1
                value: "Public"                
                color: "#33a745"
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c2
                value: "Internal"            
                color: "#fd7e14"
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c3
                value: "Confidential"
                select_implementation_groups: ["confidential_app"]
                color: "#fd7e14"
              - urn: urn:intuitem:risk:req_node:appsec:data_classification:q1:c4
                value: "Secret"
                select_implementation_groups: ["secret_app", "confidential_app"]
                color: "#dc3545"

      # Requirement: Determine hosting model
      - urn: urn:intuitem:risk:req_node:appsec:hosting
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: hosting
        name: Application Hosting Model
        description: "Determine whether the application is hosted in-house or outsourced as a SaaS solution."
        annotation: >
          Infrastructure hosting architecture classification:
          - In-house: On-premises data centers, private cloud, or internally managed infrastructure.
          - SaaS: Third-party Software-as-a-Service platforms where infrastructure and application management are outsourced to an external cloud vendor.
          - SaaS (controls defined with a contract): Third-party SaaS solutions where security controls (encryption, backups, pentesting, access management, etc.) are formally defined and governed via vendor contracts (MSA, DPA, SLA) and certified audit reports.
        typical_evidence: >
          - Architecture design document (ADD) / System topology diagram
          - Cloud hosting provider procurement record or contract
        implementation_groups: ["info"]
        questions:
          urn:intuitem:risk:req_node:appsec:hosting:q1:
            type: unique_choice
            text: "What is the hosting model?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c1
                value: "In-house"
                color: "#17a2b8"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c2
                value: "SaaS"
                select_implementation_groups: ["saas_app"]
                color: "#17a2b8"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c3
                value: "SaaS (controls defined with a contract)"
                select_implementation_groups: ["saas_app"]
                color: "#17a2b8"

      # Requirement: Determine network exposure
      - urn: urn:intuitem:risk:req_node:appsec:network_exposure
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: network_exposure
        name: Application Network Exposure
        description: "Determine whether the application is accessible from the public Internet or restricted to private networks."
        annotation: >
          Network accessibility tier:
          - Internal / Restricted: Accessible exclusively from internal corporate networks or via VPN with zero public Internet reachability.
          - Internet-facing: Accessible directly over the public Internet (customer portals, public web apps, mobile backends). Triggers external security controls.
        typical_evidence: >
          - Network zoning diagram showing DMZ, perimeter firewalls, and reverse proxies
          - DNS configuration and IP address allocation records
        implementation_groups: ["info"]
        questions:
          urn:intuitem:risk:req_node:appsec:network_exposure:q1:
            type: unique_choice
            text: "What is the network exposure of the application?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:network_exposure:q1:c1
