      # Requirement: Determine hosting model
      - urn: urn:intuitem:risk:req_node:appsec:hosting
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:info
        ref_id: hosting
        name: Application Delivery & Hosting Model
        description: "Determine the application delivery and hosting model: Custom software created and deployed by internal teams, Bought software deployed by internal teams, or third-party SaaS."
        annotation: >
          Application delivery and hosting model classification:
          - Custom software created and deployed by my teams: In-house developed software where source code is written and maintained internally. Subject to internal DevSecOps (SAST, DAST, SCA/SBOM, peer code review).
          - Bought software deployed by my teams: Commercial Off-The-Shelf (COTS) or vendor software package deployed on internal infrastructure. Subject to vendor security patch management, CVE tracking, and deployment configuration hardening.
          - SaaS: Third-party software hosted and operated by a vendor. Triggers the SaaS Assessment Track (saas_app) in Chapter 10 for vendor contractual, compliance, and operational governance (MSA, SOC 2, pentest letter, SLAs).
        typical_evidence: >
          - Architecture design document (ADD) / System topology diagram
          - Software procurement contract, vendor license, or Git repository metadata
        implementation_groups: ["info"]
        questions:
          urn:intuitem:risk:req_node:appsec:hosting:q1:
            type: unique_choice
            text: "What is the delivery and hosting model of the application?"
            choices:
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c1
                value: "Custom software created and deployed by my teams (In-house development)"
                select_implementation_groups: ["custom_app", "baseline"]
                color: "#17a2b8"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c2
                value: "Bought software deployed by my teams (COTS / Vendor package)"
                select_implementation_groups: ["cots_app", "baseline"]
                color: "#17a2b8"
              - urn: urn:intuitem:risk:req_node:appsec:hosting:q1:c3
                value: "SaaS (Third-party software hosted and operated by a vendor)"
