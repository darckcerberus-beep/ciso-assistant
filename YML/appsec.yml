        ref_id: saas_iam
        name: "Identity & Access Management"
        description: "Enforce unique user IDs, no shared accounts, immediate deactivation, robust passwords (>= 12 chars), anti-brute-force defense, mandatory MFA, and SSO/SCIM (passwords and MFA are managed at enterprise IdP level when client SSO is active)."
        annotation: >
          Contractual requirements:
          - Assign a unique identifier to each user; prohibit shared accounts.
          - Promptly deactivate unused or terminated accounts.
          - Enforce strong passwords (>= 12 characters) [delegated to client enterprise IdP when SSO is active].
          - Enforce anti-brute-force lockout and rate limiting [delegated to client enterprise IdP when SSO is active].
          - Mandate Multi-Factor Authentication (MFA) for all users [delegated to client enterprise IdP when SSO is active].
          - Support enterprise SSO federation (SAML 2.0 / OIDC) and automated user lifecycle provisioning via SCIM.
