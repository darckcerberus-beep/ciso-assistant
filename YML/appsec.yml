      # Requirement: Ensure SaaS contract includes security clauses (from newDPP)
      - urn: urn:intuitem:risk:req_node:appsec:saas_contract
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_contract_compliance
        name: SaaS Contractual Compliance
        description: "Ensure SaaS contract includes security clauses governing application security controls"
        annotation: >
          Comprehensive SaaS vendor contract security review.
          For SaaS applications, contractual agreements (Master Services Agreement, Security Exhibit, SLA, DPA)
          serve as the authoritative legal and operational baseline defining the application's security controls.
          Validates that contractual agreements with SaaS vendors contain mandatory cybersecurity clauses:
          1. Right to Audit / Third-Party Assurance (SOC 2 Type II, ISO/IEC 27001 certification).
          2. Security Incident Notification window (e.g. notification within 24 to 72 hours of discovery).
          3. Strong Identity & Access Management (SSO / SAML 2.0 integration, Multi-Factor Authentication, Role-Based Access Control).
          4. Binding Confidentiality / Non-Disclosure Agreement (NDA) and Data Processing Agreement (DPA).
          5. Service Level Agreements (SLAs) for disaster recovery, vulnerability remediation lead times, and uptime.
        typical_evidence: >
          - Signed SaaS Master Services Agreement (MSA) with Security Schedule / Exhibit
          - Executed Data Processing Agreement (DPA) and Confidentiality Agreement (NDA)
          - Vendor SOC 2 Type II / ISO 27001 audit report and security assessment questionnaire
