      # Baseline contractual security requirements applicable to third-party SaaS vendors
      # ========================================================================
      - urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        assessable: false
        depth: 1
        ref_id: saas_chapter
        name: "SaaS Requirements & Vendor Security Exhibit"
        description: "Baseline contractual security requirements applicable to all SaaS providers processing customer data (Security Schedule / Exhibit)."
        annotation: >
          This chapter formalizes the baseline contractual security requirements enforceable on SaaS (Software-as-a-Service) providers,
          aligned with enterprise security exhibits (Security Schedule V1.5).
          Architectural contractualization principle:
          SaaS providers typically disallow clients from directly pentesting shared multi-tenant infrastructure, placing client-managed
          reverse proxies or Cloudflare in front of shared multi-tenant endpoints, managing internal provider administrator accounts (while
          permitting clients to manage their own tenant users and roles via enterprise IGA), or deploying SIEM agents directly onto provider servers.
          These operational requirements are consequently transferred into binding contractual commitments: the provider commits to maintaining
          these protections (edge WAF/anti-DDoS, annual independent pentests and third-party audit reports, internal privilege governance,
          continuous monitoring, 48-hour breach notification SLAs, and SIEM audit log export APIs).
        implementation_groups: ["saas_app"]

