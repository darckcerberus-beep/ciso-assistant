      # Requirement: Error handling & debug mode
      - urn: urn:intuitem:risk:req_node:appsec:error_handling_and_info_leakage
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:app_defenses_chapter
        ref_id: error_handling_and_info_leakage
        name: Error Handling & Debug Protection
        description: "Disable debug modes, detailed stack traces, and internal server paths in production responses via generic error handlers."
