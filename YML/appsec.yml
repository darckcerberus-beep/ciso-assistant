      # Section 4: Gestion des identités et des accès
      - urn: urn:intuitem:risk:req_node:appsec:saas_iam
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_iam
        name: "Identity & Access Management (Gestion des identités et des accès)"
        description: "Enforce unique user IDs, no shared accounts, immediate deactivation, robust passwords (>= 12 chars), anti-brute-force defense, mandatory MFA, and SSO/SCIM (passwords and MFA are managed at enterprise IdP level when client SSO is active)."
        annotation: >
          Exigences contractuelles :
          - Attribuer un identifiant unique à chaque utilisateur.
          - Interdire les comptes partagés.
          - Désactiver immédiatement les comptes inutilisés.
          - Imposer des mots de passe robustes (minimum 12 caractères) [délégué à l'IdP client si SSO entreprise actif].
          - Mettre en œuvre un mécanisme de protection contre les tentatives d'accès frauduleuses [délégué à l'IdP client si SSO entreprise actif].
          - Imposer l'authentification multifacteur (MFA) pour tous les utilisateurs [délégué à l'IdP client si SSO entreprise actif].
          - Supporter les mécanismes SSO et SCIM lorsque requis.
        typical_evidence: >
          - Enterprise SSO (SAML 2.0 / OIDC) and SCIM automated provisioning configuration documentation
          - If SSO is active: Client enterprise IdP federation configuration and authentication policy
          - If direct authentication is active: SaaS password complexity and MFA enforcement policy extracts
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:weak_authentication_controls
        implementation_groups: ["saas_app"]
        reference_controls:
          - urn:intuitem:risk:control:appsec:enforce_mfa_and_strong_auth
          - urn:intuitem:risk:control:appsec:centralized_identity_sso
        questions:
