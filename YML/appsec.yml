      # Section 1: Gouvernance et politique de sécurité
      - urn: urn:intuitem:risk:req_node:appsec:saas_governance_and_policy
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_governance_and_policy
        name: "Security Governance & Policy (Gouvernance et politique de sécurité)"
        description: "Maintain an ISO 27001-based security policy, an active ISMS, and conduct annual risk analyses and policy updates."
        annotation: >
          Exigences contractuelles :
          - Disposer d'une politique de sécurité basée sur un référentiel reconnu tel qu'ISO 27001.
          - Maintenir un système de management de la sécurité de l'information (SMSI).
          - Réaliser une analyse de risques au minimum annuelle.
          - Mettre à jour la politique de sécurité au minimum une fois par an.
        typical_evidence: >
          - Valid ISO/IEC 27001 certification or documented ISMS framework
          - Information Security Policy document approved within the last 12 months
          - Annual risk assessment executive summary report and risk treatment plan
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:unverified_saas_security
        implementation_groups: ["saas_app"]
        reference_controls:
