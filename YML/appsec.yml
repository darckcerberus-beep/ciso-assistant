    - urn: urn:intuitem:risk:vulnerability:appsec:flawed_input_validation
      ref_id: flawed_input_validation
      name: "Flawed input validation and output encoding"
      description: "Insufficient validation, sanitization, or encoding of user-supplied data enabling injection attacks."
      associated_controls:
        - urn:intuitem:risk:control:appsec:secure_input_validation_and_encoding
      reference_controls:
        - urn:intuitem:risk:control:appsec:secure_input_validation_and_encoding
