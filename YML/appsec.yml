      # Section 18: Subcontractor, Sub-Processor & AI Data Governance
      - urn: urn:intuitem:risk:req_node:appsec:saas_subcontractor_management
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_subcontractor_management
        name: "Subcontractor, Sub-Processor & AI Data Governance"
        description: "Select subcontractors with sufficient security guarantees, provide prior notice of sub-processor changes with a right to object, prohibit unauthorized AI model training on customer data, and preserve full vendor liability."
        annotation: >
          Contractual requirements:
          - Formal vetting and due diligence for third-party sub-processors, with documented compliance verification and security flow-down clauses.
          - Prior written notification to the customer (e.g. >= 30 days) before onboarding new sub-processors, with a contractual right to object.
          - Full vendor liability maintained for downstream subcontractor actions.
          - Explicit contractual prohibition on using customer data to train, fine-tune, or enrich general-purpose or multi-tenant AI/ML models without prior written authorization.
        typical_evidence: >
          - Sub-processor register, prior notification procedure, and third-party risk assessment reports
          - Back-to-back Data Processing Agreements (DPAs) with subcontractors and AI data usage restriction clauses
        vulnerabilities:
          - urn:intuitem:risk:vulnerability:appsec:uncontrolled_vendor_access
        implementation_groups: ["saas_uncertified"]
        reference_controls:
