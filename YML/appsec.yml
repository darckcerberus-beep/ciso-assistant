      # Section 6: Logging & Incident Management
      - urn: urn:intuitem:risk:req_node:appsec:saas_logging_and_incidents
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:appsec:saas_chapter
        ref_id: saas_logging_and_incidents
        name: "Logging & Incident Management"
        description: "Log user and admin actions, ensure log tamper-resistance, continuously monitor security events, and notify incidents within 48 hours."
        annotation: >
          Contractual requirements:
          - Clients cannot install internal SIEM agents directly onto SaaS provider infrastructure.
          - Provider commits contractually to log access, logins, logouts, and administrative actions.
          - Protect logs against unauthorized modification or deletion (WORM / immutable storage).
          - Continuously monitor platform security events.
          - Contractually notify the client of any security incident or anomaly within a maximum of 48 hours of discovery.
          - Provide an audit export API or webhook to stream telemetry into the client enterprise SIEM.
        typical_evidence: >
          - Audit logging configuration and log retention policy (>= 12 months)
          - Tamper-resistance architecture proof (WORM storage / cryptographic sealing)
          - Contractual 48-hour incident notification SLA clause and incident response plan
          - Streaming audit telemetry / webhook integration configuration into enterprise SIEM (Splunk, Microsoft Sentinel)
        vulnerabilities:
