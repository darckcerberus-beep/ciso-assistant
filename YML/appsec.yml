        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access

    - urn: urn:intuitem:risk:vulnerability:appsec:hardcoded_secrets
      ref_id: hardcoded_secrets
      name: "Hardcoded credentials and secrets"
      description: "Presence of API keys, passwords, or tokens in source code repositories, images, or configuration files."
      associated_controls:
        - urn:intuitem:risk:control:appsec:centralized_secrets_management
      reference_controls:
        - urn:intuitem:risk:control:appsec:centralized_secrets_management
      threats:
