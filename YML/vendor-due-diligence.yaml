        Please ensure that all required third-party attestations and contractual exhibits have been uploaded.'
      implementation_groups:
      - info
    implementation_groups_definition:
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:info
      name: General Vendor Information
      ref_id: info
      description: General baseline requirements and vendor profiling
      default_selected: true
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:saas_app
      name: SaaS & Cloud Application
      ref_id: saas_app
      description: Requirements for vendors providing Software-as-a-Service (SaaS), hosted applications, or cloud platforms
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:cloud_infra
      name: Cloud Infrastructure & Hosting
      ref_id: cloud_infra
      description: Requirements for infrastructure hosting, datacenter security, backups, and disaster recovery
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:software_dev
      name: Software Development & SDLC
      ref_id: software_dev
      description: Requirements for software development, code security, SAST/DAST, and supply chain BOM
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:ai_service
      name: AI & Machine Learning
      ref_id: ai_service
      description: Requirements for vendors providing or integrating Generative AI, LLMs, or machine learning models
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:subprocessors_used
      name: Sub-processors & Supply Chain
      ref_id: subprocessors_used
      description: Requirements for vendors relying on third-party sub-processors or subcontractors
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:confidential_vendor
      name: Confidential Data (Tier 2 & Tier 1)
      ref_id: confidential_vendor
      description: Enhanced security, pentesting, and assurance requirements for vendors handling Confidential or Secret data
    - urn: urn:intuitem:risk:ig:vendor-due-diligence:secret_vendor
      name: Secret / Mission-Critical Data (Tier 1)
      ref_id: secret_vendor
      description: Maximum-security controls (BYOK keys, direct audit rights, privileged access) for Tier 1 vendors
  risk_matrix:
  - urn: urn:intuitem:risk:matrix:vendor-due-diligence
    ref_id: risk-matrix-4x4-vdd
    name: Vendor Due Diligence Risk Matrix
    description: 4x4 probability/impact matrix for third-party and vendor risk assessment
    probability:
    - id: 0
      abbreviation: '1'
      name: 1 - unlikely
      description: The likelihood of vendor incident or security failure is very low
    - id: 1
      abbreviation: '2'
      name: 2 - rather unlikely
      description: The likelihood of vendor incident or security failure is low
    - id: 2
      abbreviation: '3'
      name: 3 - likely
      description: The likelihood of vendor incident or security failure is significant
    - id: 3
      abbreviation: '4'
      name: 4 - very likely
      description: The likelihood of vendor incident or security failure is high
    impact:
    - id: 0
      abbreviation: '1'
      name: 1 - minor
      description: Negligible operational, financial, or regulatory disruption
    - id: 1
      abbreviation: '2'
      name: 2 - significant
      description: Noticeable operational disruption or localized data exposure
    - id: 2
      abbreviation: '3'
      name: 3 - serious
      description: Substantial business disruption, confidential data breach, or contractual penalty
    - id: 3
      abbreviation: '4'
      name: 4 - critical
      description: Catastrophic business shutdown, critical data exfiltration, or severe regulatory sanctions
    risk:
    - id: 0
      abbreviation: '1'
      name: 1 - very low
      description: very low - acceptable risk
      hexcolor: '#D3FF4E'
    - id: 1
      abbreviation: '2'
      name: 2 - low
      description: low - acceptable risk
      hexcolor: '#02A45A'
    - id: 2
      abbreviation: '3'
      name: 3 - medium
      description: medium - tolerable risk
      hexcolor: '#FFA600'
    - id: 3
      abbreviation: '4'
      name: 4 - high
      description: high - unacceptable risk
      hexcolor: '#FF1A00'
    - id: 4
      abbreviation: '5'
      name: 5 - very high
      description: very high - unacceptable risk
      hexcolor: '#C00000'
    grid:
    - - 0
      - 0
      - 1
      - 1
    - - 0
      - 1
      - 1
      - 2
    - - 1
      - 1
      - 2
      - 3
    - - 1
      - 2
      - 3
      - 4
  threats:
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    ref_id: vendor_data_breach
    name: Vendor data breach and exfiltration
    description: Unauthorized access, extraction, or disclosure of sensitive customer data stored or processed in the vendor
      environment.
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:service_disruption
    ref_id: service_disruption
    name: Vendor service disruption and outage
    description: Prolonged unavailability, infrastructure failure, or operational outage of vendor services impacting critical
      business processes.
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:supply_chain_compromise
    ref_id: supply_chain_compromise
    name: Software supply chain compromise
    description: Insertion of malicious code, compromised dependencies, or pipeline tampering delivering vulnerabilities through
      vendor software.
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:credential_compromise
    ref_id: credential_compromise
    name: Privileged credential compromise and identity takeover
    description: Compromise, theft, or misuse of vendor administrative accounts, API tokens, or customer access credentials.
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    ref_id: regulatory_sanction
    name: Regulatory non-compliance and legal liability
    description: Vendor failure to meet statutory data protection (GDPR) or cybersecurity resilience mandates (NIS2, DORA),
      exposing client to fines and liability.
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:subprocessor_data_leakage
    ref_id: subprocessor_data_leakage
    name: Sub-processor data leakage
    description: Unauthorized exposure, uncontrolled transfer, or security compromise originating from vendor fourth parties
      and subcontractors.
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:ai_data_leakage
    ref_id: ai_data_leakage
    name: AI prompt and intellectual property exposure
    description: Unauthorized retention, training use, or leakage of sensitive prompts, intellectual property, or confidential
      assets through vendor AI capabilities.
  - urn: urn:intuitem:risk:threat:vendor-due-diligence:vendor_lockin_loss
    ref_id: vendor_lockin_loss
    name: Vendor lock-in and termination data loss
    description: Inability to extract organizational data in open formats upon contract termination, vendor insolvency, or
      discontinuation of service.
  reference_controls:
  - urn: urn:intuitem:risk:control:vendor-due-diligence:require_security_certifications
    ref_id: require_security_certifications
    name: Require ISO 27001 / SOC 2 Type II certification and formal governance
    description: Mandate verifiable third-party certification (ISO 27001, SOC 2 Type II) and designated cybersecurity leadership.
    annotation: Validates the foundational security posture and independent external assurance of the vendor.
    typical_evidence: '- Valid ISO/IEC 27001 certificate

      - Unqualified SOC 2 Type II assurance report

      - Cybersecurity leadership appointment letter'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    is_recurrent: true
    cadence: annually
    task:
      name: "Annual Vendor Security Certification and Governance Verification"
      description: "Request, review, and archive updated ISO/IEC 27001 certificates, SOC 2 Type II assurance reports, bridge letters, and designated security officer contacts."
      frequency: "YEARLY"
      interval: 1
  - urn: urn:intuitem:risk:control:vendor-due-diligence:enforce_mfa_sso_pam
    ref_id: enforce_mfa_sso_pam
    name: Enforce MFA, SAML/OIDC SSO, and privileged access management
    description: Mandate strong multi-factor authentication, enterprise Single Sign-On integration, and strict least-privilege
      session management.
    annotation: Prevents unauthorized lateral movement and account takeover across vendor administrative interfaces.
    typical_evidence: '- SSO / IdP federation configuration screenshot

      - SCIM 2.0 / IGA integration documentation and automated user provisioning logs

      - MFA enforcement policy across administrative portals

      - Privileged access review and session recording logs'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:credential_compromise
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    is_recurrent: true
    cadence: quarterly
    task:
      name: "Quarterly Vendor Access and Federation Review"
      description: "Review vendor administrative accounts, SSO/MFA enforcement, SCIM synchronization logs, and privileged access grants across vendor extranets."
      frequency: "MONTHLY"
      interval: 3
  - urn: urn:intuitem:risk:control:vendor-due-diligence:harden_infrastructure_and_perimeter
    ref_id: harden_infrastructure_and_perimeter
    name: Harden cloud infrastructure, WAF, and DDoS mitigation
    description: Deploy robust network perimeter filtering, Web Application Firewalls (WAF), automated DDoS defenses, and
      centralized logging.
    annotation: Mitigates external perimeter attacks, brute-force disruption, and distributed denial of service.
    typical_evidence: '- Cloud architecture topology showing WAF / CDN edge protection

      - DDoS mitigation SLA confirmation

      - SIEM ingestion audit reports'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:service_disruption
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    is_recurrent: true
    cadence: quarterly
    task:
      name: "Quarterly Infrastructure Hardening and Perimeter Defense Review"
      description: "Evaluate vendor perimeter defense reports, WAF/DDoS configurations, edge CDN filtering rules, and patch management compliance metrics."
      frequency: "MONTHLY"
      interval: 3
  - urn: urn:intuitem:risk:control:vendor-due-diligence:implement_secure_sdlc_and_sbom
    ref_id: implement_secure_sdlc_and_sbom
    name: Implement secure SDLC, automated scanning, and SBOM
    description: Enforce automated SAST/DAST/SCA security testing in CI/CD pipelines, maintain an up-to-date SBOM, and enforce
      strict environment segregation.
    annotation: Prevents the introduction of known software vulnerabilities and tainted supply chain dependencies.
    typical_evidence: '- CycloneDX or SPDX format SBOM artifact

      - CI/CD automated SAST/SCA pipeline gate configuration

      - Vulnerability disclosure and remediation SLA policy'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:supply_chain_compromise
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    is_recurrent: true
    cadence: quarterly
    task:
      name: "Quarterly Software Supply Chain and SBOM Verification"
      description: "Obtain and analyze the updated Software Bill of Materials (SBOM) for known vulnerabilities, component obsolescence, and verify secure SDLC pipeline gates."
      frequency: "MONTHLY"
      interval: 3
  - urn: urn:intuitem:risk:control:vendor-due-diligence:require_third_party_pentesting
    ref_id: require_third_party_pentesting
    name: Require annual independent penetration testing
    description: Mandate regular third-party penetration testing of vendor systems and prompt remediation of identified vulnerabilities.
    annotation: Ensures external validation of security posture against real-world attack techniques.
    typical_evidence: '- Executive summary of annual third-party penetration test

      - Remediation verification attestation from testing firm'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:supply_chain_compromise
    is_recurrent: true
    cadence: annually
    task:
      name: "Annual Third-Party Penetration Test Report Audit"
      description: "Collect and evaluate the executive summary and attestation letter of the vendor's annual independent penetration test and track remediations."
      frequency: "YEARLY"
      interval: 1
  - urn: urn:intuitem:risk:control:vendor-due-diligence:contract_incident_notification_sla
    ref_id: contract_incident_notification_sla
    name: Contractually mandate 24-72h incident notification SLAs
    description: Establish formal incident response plans with contractual commitments to notify clients within 24 to 72 hours
      of a confirmed breach.
    annotation: Enables compliance with statutory reporting obligations under GDPR, NIS2, and DORA.
    typical_evidence: '- Executed Master Services Agreement (MSA) containing breach notification SLA

      - Incident response plan (IRP) workflow

      - 24/7 dedicated security contact details'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    is_recurrent: true
    cadence: annually
    task:
      name: "Annual Incident Response and Breach Notification SLA Review"
      description: "Confirm validity of vendor 24-72h breach notification commitments, update 24/7 security escalation contacts, and test communication channels."
      frequency: "YEARLY"
      interval: 1
  - urn: urn:intuitem:risk:control:vendor-due-diligence:implement_bcp_dr_and_backups
    ref_id: implement_bcp_dr_and_backups
    name: Implement tested BCP/DR, immutable backups, and defined RTO/RPO
    description: Enforce automated, immutable, air-gapped backups and tested business continuity and disaster recovery plans
      meeting documented RTO/RPO.
    annotation: Guarantees rapid service and data restoration following ransomware, cloud failure, or physical catastrophe.
    typical_evidence: '- Disaster recovery drill executive summary

      - Backup immutability policy (WORM/air-gap configuration)

      - Documented RTO and RPO metrics in service contract'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:service_disruption
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_lockin_loss
    is_recurrent: true
    cadence: annually
    task:
      name: "Annual Vendor BCP/DR and Backup Restoration Drill Review"
      description: "Review vendor business continuity drill results, immutable backup configurations, and verify adherence to contractual RTO and RPO metrics."
      frequency: "YEARLY"
      interval: 1
  - urn: urn:intuitem:risk:control:vendor-due-diligence:mandate_encryption_and_tenant_isolation
    ref_id: mandate_encryption_and_tenant_isolation
    name: Mandate end-to-end encryption, tenant isolation, and data residency
    description: Enforce AES-256 encryption at rest, TLS 1.3 in transit, strict multi-tenant customer isolation, and documented
      geographic data residency.
    annotation: Protects confidentiality and regulatory compliance across data storage, transmission, and tenant domains.
    typical_evidence: '- Transparent Data Encryption (TDE) / KMS key policy verification

      - TLS 1.3 cipher suite validation report

      - Data residency commitment in Data Processing Addendum (DPA)'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    is_recurrent: true
    cadence: biannually
    task:
      name: "Biannual Data Encryption and Tenant Isolation Audit"
      description: "Verify tenant data isolation mechanisms, KMS key rotation procedures, encryption-at-rest standards (AES-256), and geographic residency commitments."
      frequency: "MONTHLY"
      interval: 6
  - urn: urn:intuitem:risk:control:vendor-due-diligence:secure_application_apis_and_rbac
    ref_id: secure_application_apis_and_rbac
    name: Secure application APIs, rate limiting, and centralized secrets
    description: Enforce strict API authentication, automated rate limiting, granular Role-Based Access Control (RBAC), and
      centralized secrets management.
    annotation: Shields application endpoints against abuse, token theft, automated scraping, and unauthorized privilege escalation.
    typical_evidence: '- API gateway authentication policy (OAuth 2.0 / mTLS)

      - Rate limiting and throttling threshold configuration

      - HashiCorp Vault / AWS Secrets Manager deployment proof'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:credential_compromise
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    is_recurrent: true
    cadence: quarterly
    task:
      name: "Quarterly API Security and Credential Hygiene Review"
      description: "Audit vendor API endpoint authentication, rate limiting metrics, OAuth scopes, and verify automated rotation of service account secrets."
      frequency: "MONTHLY"
      interval: 3
  - urn: urn:intuitem:risk:control:vendor-due-diligence:manage_subprocessors_and_flowdown
    ref_id: manage_subprocessors_and_flowdown
    name: Maintain sub-processor register, change notice, and contractual flow-down
    description: Maintain an accurate sub-processor register, provide 30-day prior written notice for subcontractor changes,
      and flow down security obligations.
    annotation: Controls fourth-party supply chain risk and prevents unvetted subcontractors from handling client data.
    typical_evidence: '- Public or customer-facing authorized sub-processor list

      - DPA clause specifying 30-day objection notice for new sub-processors

      - Standard vendor flow-down agreement templates'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:subprocessor_data_leakage
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    is_recurrent: true
    cadence: biannually
    task:
      name: "Biannual Fourth-Party Sub-processor Registry Review"
      description: "Inspect the vendor's updated sub-processor register, verify 30-day change notification compliance, and review downstream contractual flow-down."
      frequency: "MONTHLY"
      interval: 6
  - urn: urn:intuitem:risk:control:vendor-due-diligence:govern_ai_usage_and_zdr
    ref_id: govern_ai_usage_and_zdr
    name: Enforce AI Zero-Data-Retention and model training prohibition
    description: Enforce contractual zero-data-retention on foundation models, prohibit model training on customer data, and
      implement prompt security guardrails.
    annotation: Protects trade secrets and customer communications from being stored, leaked, or ingested by foundation LLMs.
    typical_evidence: '- Third-party LLM Zero-Data-Retention (ZDR) enterprise agreement

      - Contractual guarantee prohibiting customer data training

      - AI security guardrail and prompt injection filtering specification'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:ai_data_leakage
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    is_recurrent: true
    cadence: biannually
    task:
      name: "Biannual AI Zero-Data-Retention and Guardrails Compliance Check"
      description: "Verify third-party AI/LLM Zero-Data-Retention agreements, audit model usage, confirm customer data training prohibitions, and review prompt guardrails."
      frequency: "MONTHLY"
      interval: 6
  - urn: urn:intuitem:risk:control:vendor-due-diligence:guarantee_sla_data_exit_and_escrow
    ref_id: guarantee_sla_data_exit_and_escrow
    name: Guarantee availability SLAs, data export tooling, deletion certificates, and escrow
    description: Contractually guarantee 99.9%+ availability, automated non-proprietary data extraction, certified post-termination
      data deletion, and software escrow.
    annotation: Eliminates vendor lock-in and protects ongoing operations against vendor insolvency or termination disputes.
    typical_evidence: '- SLA document with uptime tiers and financial remedies

      - Documented API / bulk export capability (JSON/CSV/SQL)

      - Certificate of destruction template and software escrow agreement'
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:service_disruption
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_lockin_loss
    is_recurrent: true
    cadence: annually
    task:
      name: "Annual Exit Management, SLA Verification, and Escrow Audit"
      description: "Validate availability SLA uptime records, test bulk data extraction tooling, and verify active status of software escrow agreements."
      frequency: "YEARLY"
      interval: 1
  vulnerabilities:
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:weak_governance_certification
    ref_id: weak_governance_certification
    name: Lack of independent security certification and governance
    description: Absence of formal ISO 27001 or SOC 2 certification, unassigned security leadership, and missing cybersecurity
      policies.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:require_security_certifications
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:require_security_certifications
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:inadequate_access_controls
    ref_id: inadequate_access_controls
    name: Weak identity and access management controls
    description: Absence of mandatory MFA, lack of enterprise SSO integration, unreviewed access privileges, and delayed account
      deprovisioning.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:credential_compromise
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:enforce_mfa_sso_pam
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:enforce_mfa_sso_pam
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:unhardened_infrastructure
    ref_id: unhardened_infrastructure
    name: Unhardened cloud and network infrastructure
    description: Absence of automated DDoS mitigation, missing Web Application Firewall (WAF), and inadequate centralized
      log monitoring.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:service_disruption
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:harden_infrastructure_and_perimeter
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:harden_infrastructure_and_perimeter
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:insecure_sdlc_and_dependencies
    ref_id: insecure_sdlc_and_dependencies
    name: Insecure software development lifecycle and untracked dependencies
    description: Lack of automated SAST/DAST/SCA security scans, missing Software Bill of Materials (SBOM), and failure to
      separate dev/prod environments.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:supply_chain_compromise
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:implement_secure_sdlc_and_sbom
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:implement_secure_sdlc_and_sbom
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:untested_security_posture
    ref_id: untested_security_posture
    name: Untested security defenses and lack of independent assurance
    description: Failure to conduct regular third-party penetration testing and lack of annual independent audit verification.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:supply_chain_compromise
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:require_third_party_pentesting
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:require_third_party_pentesting
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:deficient_incident_response
    ref_id: deficient_incident_response
    name: Deficient incident response and delayed notification
    description: Absence of a 24/7 CSIRT, undefined incident classification, and lack of contractual commitment to notify
      clients within 24-72 hours.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:contract_incident_notification_sla
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:contract_incident_notification_sla
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:inadequate_bcp_dr
    ref_id: inadequate_bcp_dr
    name: Untested business continuity and unverified backups
    description: Lack of immutable backups, untested disaster recovery failover, and undefined or unmeasured RTO and RPO metrics.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:service_disruption
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_lockin_loss
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:implement_bcp_dr_and_backups
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:implement_bcp_dr_and_backups
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:weak_data_protection
    ref_id: weak_data_protection
    name: Inadequate data encryption, multi-tenancy, and lifecycle governance
    description: Absence of strong encryption at rest/in transit, unverified tenant data isolation, non-compliant data residency,
      or missing destruction SOP.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:vendor_data_breach
    - urn:intuitem:risk:threat:vendor-due-diligence:regulatory_sanction
    associated_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:mandate_encryption_and_tenant_isolation
    reference_controls:
    - urn:intuitem:risk:control:vendor-due-diligence:mandate_encryption_and_tenant_isolation
  - urn: urn:intuitem:risk:vulnerability:vendor-due-diligence:insecure_application_apis
    ref_id: insecure_application_apis
    name: Insecure application endpoints and unprotected API secrets
    description: Exposed APIs without strict rate limiting, lack of centralized secrets management, and missing granular role-based
      authorization.
    threats:
    - urn:intuitem:risk:threat:vendor-due-diligence:credential_compromise
