    - urn: urn:intuitem:risk:req_node:vendor-due-diligence:instructions_splash
      assessable: false
      display_mode: splash
      depth: 1
      ref_id: instructions_splash
      name: Vendor Assessment Instructions & Guidance
      description: 'Welcome to the Third-Party Vendor Due Diligence (VDD) Security Assessment.


        This assessment evaluates vendor cybersecurity maturity, data privacy compliance, infrastructure security, supply
        chain governance, and operational resilience.


        How to complete this assessment:

        1. Answer accurately: Complete all assessable questions reflecting the vendor''s actual verified controls.

        2. Vendor Classification & Availability: Select the data sensitivity tier (Confidentiality) and required service availability
        (MTD/SLA) in Chapter 1 to establish baseline impact.

        3. Audit Evidence: Provide supporting documentation (e.g. ISO 27001 certificate, SOC 2 Type II report, pentest summary,
        DPA) for auditor review.

        4. Dynamic Risk Calculation: Responses automatically drive quantitative likelihood scoring and populate mitigating
        controls across risk scenarios.'
      implementation_groups:
      - info
