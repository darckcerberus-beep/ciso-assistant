# ============================================================================
# Application Security Assessment Framework Common Objects (AppSec) - CISO Assistant Library
# ============================================================================
# This YAML library defines shared, common non-framework objects for Application
# Security Assessment Frameworks (AppSec and AppSec Manual):
# - Risk Matrix (4x4 likelihood & impact)
# - Threats (9 core application security threats)
# - Vulnerabilities (18 core application security weaknesses)
# - Reference Controls (26 core application security reference controls)
# - Risk Scenarios (25 application security threat scenarios)
# ============================================================================

urn: urn:intuitem:risk:library:appsec_objects
locale: en
ref_id: "appsec_objects"
name: "Application Security Common Objects Library (AppSec)"
description: >
  Common risk matrix, threats, vulnerabilities, reference controls, and risk scenarios
  shared between Application Security Assessment Frameworks (AppSec and AppSec Manual).
copyright: DCME Corp
version: 2
publication_date: 2026-11-06
provider: DCME Corp
packager: DCME Corp

objects:
  # ========================================================================
  # RISK SCENARIOS - Threat scenarios covering application risks
  # ========================================================================
  risk_scenarios:
    # 1. Unencrypted data in transit (from newDPP)
    - urn: urn:intuitem:risk:scenario:appsec:unencrypted_data_in_transit
      ref_id: unencrypted_data_in_transit
      name: "Exposure of unencrypted data in transit"
      description: >
        Sensitive information is exposed during network transmission due to
        missing or deprecated cryptographic transport protocols.
      likelihood: urn:intuitem:risk:req_node:appsec:data_in_transit
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:lack_of_encryption
      reference_controls:
        - urn:intuitem:risk:control:appsec:encrypt_data_in_transit
      frameworks: ["appsec", "appsec_manual"]

    # 2. Unencrypted data at rest (from newDPP)
    - urn: urn:intuitem:risk:scenario:appsec:unencrypted_data_at_rest
      ref_id: unencrypted_data_at_rest
      name: "Exposure of unencrypted data at rest"
      description: >
        Sensitive information is exposed in databases, object stores, or storage volumes
        due to missing encryption-at-rest controls.
      likelihood: urn:intuitem:risk:req_node:appsec:data_at_rest
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:lack_of_encryption
      reference_controls:
        - urn:intuitem:risk:control:appsec:encrypt_data_at_rest

    # 3. Non-production & sandbox data disclosure
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:nonprod_data_disclosure
      ref_id: nonprod_data_disclosure
      name: "Disclosure of production data in non-production environments"
      description: >
        Production data used in development, staging, test environments, or SaaS sandbox tenants is exposed
        because sanitization, pseudonymisation, or masking measures are not implemented, or test data is not purged.
      likelihood: urn:intuitem:risk:req_node:appsec:non_prod_data
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:unprotected_non_prod
      reference_controls:
        - urn:intuitem:risk:control:appsec:protect_prod_data_in_non_prod


    # 4. Third-party data leakage (from newDPP)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:third_party_data_leakage
      ref_id: third_party_data_leakage
      name: "Third-party data leakage"
      description: >
        Sensitive information is disclosed or misused by an external partner
        due to inadequate contractual data-sharing and confidentiality terms.
      likelihood: urn:intuitem:risk:req_node:appsec:data_exchange
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:contractual_gap
      reference_controls:
        - urn:intuitem:risk:control:appsec:information_exchange_contract

    # 5. SaaS provider data leakage (from newDPP)
    - urn: urn:intuitem:risk:scenario:appsec:saas_provider_data_leakage
      ref_id: saas_provider_data_leakage
      name: "SaaS provider data leakage"
      description: >
        Sensitive information is disclosed or misused by an external SaaS provider
        due to inadequate contractual safeguards, lack of audit rights, or missing DPAs.
      likelihood: urn:intuitem:risk:req_node:appsec:saas_contract_compliance
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:contractual_gap
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_contract
        - urn:intuitem:risk:control:appsec:saas_resilience_and_data_portability

    # 6. Missing application stakeholders (from newDPP)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:missing_stakeholders
      ref_id: missing_stakeholders
      name: "Missing application stakeholders"
      description: >
        Unclear accountability and missing business, IT, or data owner designations
        delay security patch decisions, incident response, and governance approvals.
      likelihood: urn:intuitem:risk:req_node:appsec:stakeholder_identification
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_loss
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:unclear_accountability
        - urn:intuitem:risk:vulnerability:appsec:lack_of_data_classification
      reference_controls:
        - urn:intuitem:risk:control:appsec:stakeholder_designation
        - urn:intuitem:risk:control:appsec:identify_data_classification

    # 7. Improper data retention (from newDPP)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:improper_data_retention
      ref_id: improper_data_retention
      name: "Excessive retention of sensitive data"
      description: >
        Sensitive information is retained indefinitely beyond business or statutory
        requirements due to the absence of a compliant data purge/destruction process.
      likelihood: urn:intuitem:risk:req_node:appsec:data_destruction
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:uncontrolled_data_retention
      reference_controls:
        - urn:intuitem:risk:control:appsec:data_destruction_process

    # 8. Account takeover via weak authentication (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:account_takeover_via_weak_auth
      ref_id: account_takeover_via_weak_auth
      name: "Account takeover via weak authentication"
      description: >
        Adversaries compromise user or administrative accounts via brute-force,
        credential stuffing, or session hijacking due to missing MFA or weak auth controls.
      likelihood: urn:intuitem:risk:req_node:appsec:authentication_and_mfa
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:account_takeover
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:weak_authentication_controls
      reference_controls:
        - urn:intuitem:risk:control:appsec:enforce_mfa_and_strong_auth
        - urn:intuitem:risk:control:appsec:centralized_identity_sso

    # 9. Unauthorized data access via broken authorization (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:privilege_escalation_broken_access_control
      ref_id: privilege_escalation_broken_access_control
      name: "Unauthorized data access via broken authorization"
      description: >
        Flaws in access control logic allow malicious actors to escalate privileges,
        access unauthorized administrative functions, or bypass tenant isolation (BOLA/IDOR).
      likelihood: urn:intuitem:risk:req_node:appsec:access_control_and_rbac
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:broken_authorization_rbac
      reference_controls:
        - urn:intuitem:risk:control:appsec:enforce_least_privilege_rbac

    # 10. Application compromise via injection attack (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:injection_flaw_exploitation
      ref_id: injection_flaw_exploitation
      name: "Application compromise via injection attack"
      description: >
        Adversaries exploit unvalidated user inputs to execute SQL injection,
        remote command execution, or cross-site scripting (XSS), compromising application integrity.
      likelihood: urn:intuitem:risk:req_node:appsec:owasp_top_10_defenses
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:injection_attacks
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:flawed_input_validation
      reference_controls:
        - urn:intuitem:risk:control:appsec:secure_input_validation_and_encoding

    # 11. Credential leakage via hardcoded secrets (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:hardcoded_secrets_exposure
      ref_id: hardcoded_secrets_exposure
      name: "Credential leakage via hardcoded secrets"
      description: >
        Database credentials, API keys, or private cryptographic keys hardcoded
        in source code repositories or build scripts are exposed to unauthorized parties.
      likelihood: urn:intuitem:risk:req_node:appsec:secrets_management
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:secrets_compromise
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:hardcoded_secrets
      reference_controls:
        - urn:intuitem:risk:control:appsec:centralized_secrets_management

    # 12. Supply chain compromise via vulnerable dependencies (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:supply_chain_dependency_compromise
      ref_id: supply_chain_dependency_compromise
      name: "Supply chain compromise via vulnerable dependency"
      description: >
        Adversaries exploit unpatched critical CVEs in open-source third-party libraries,
        container base images, or software dependencies integrated into the application.
      likelihood: urn:intuitem:risk:req_node:appsec:supply_chain_and_dependencies
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:supply_chain_tampering
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:vulnerable_dependencies
      reference_controls:
        - urn:intuitem:risk:control:appsec:supply_chain_dependency_management
        - urn:intuitem:risk:control:appsec:automated_devsecops_testing

    # 13. API abuse and denial of service (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:api_abuse_and_denial_of_service
      ref_id: api_abuse_and_denial_of_service
      name: "API abuse and denial of service"
      description: >
        Exposed API endpoints are overwhelmed by abusive requests, scraping, or brute-force
        attacks due to the absence of rate limiting and traffic throttling controls.
      likelihood: urn:intuitem:risk:req_node:appsec:api_security_and_rate_limiting
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:service_disruption
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:unmitigated_api_abuse
      reference_controls:
        - urn:intuitem:risk:control:appsec:api_security_and_rate_limiting

    # 14. Undetected breach due to missing security logging (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:undetected_security_breach
      ref_id: undetected_security_breach
      name: "Undetected breach due to missing security logging"
      description: >
        An active application intrusion or unauthorized data exfiltration remains undetected
        for an extended period because security events are not logged or forwarded to a central SIEM.
      likelihood: urn:intuitem:risk:req_node:appsec:centralized_monitoring_and_alerting
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:undetected_intrusion
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:insufficient_security_logging
      reference_controls:
        - urn:intuitem:risk:control:appsec:centralized_security_logging

    # 15. Catastrophic data loss due to unverified backups (AppSec addition)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:prolonged_outage_data_loss
      ref_id: prolonged_outage_data_loss
      name: "Catastrophic data loss due to unverified backups"
      description: >
        Infrastructure failure, ransomware, or corruption causes irreversible data loss
        or extended downtime because backups and disaster recovery plans are not regularly tested.
      likelihood: urn:intuitem:risk:req_node:appsec:backup_and_disaster_recovery
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_loss
        - urn:intuitem:risk:threat:appsec:service_disruption
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:inadequate_resilience_backup
      reference_controls:
        - urn:intuitem:risk:control:appsec:backup_and_disaster_recovery

    # 16. Exploitation of unpatched vulnerability (Hosted applications)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:unpatched_vulnerability_exploitation
      ref_id: unpatched_vulnerability_exploitation
      name: "Exploitation of unpatched vulnerability"
      description: >
        Known security vulnerabilities remain unaddressed in self-hosted production environments due to the absence
        of regular independent penetration testing and formal remediation SLAs.
      likelihood: urn:intuitem:risk:req_node:appsec:penetration_testing_and_vulnerability_management
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:injection_attacks
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:untested_application_security
      reference_controls:
        - urn:intuitem:risk:control:appsec:regular_penetration_testing

    # 17. Exploitation of unpatched SaaS vulnerability (SaaS applications)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:saas_unpatched_vulnerability_exploitation
      ref_id: saas_unpatched_vulnerability_exploitation
      name: "Exploitation of unpatched SaaS vulnerability"
      description: >
        Known security vulnerabilities in the third-party SaaS platform remain unaddressed due to the absence
        of contractually binding vulnerability remediation SLAs.
      likelihood: urn:intuitem:risk:req_node:appsec:saas_vulnerability_remediation_sla
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:injection_attacks
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:untested_application_security
      reference_controls:
        - urn:intuitem:risk:control:appsec:regular_penetration_testing

    # 18. SaaS tenant isolation breach & cross-tenant data leakage (SaaS applications)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:saas_tenant_isolation_breach
      ref_id: saas_tenant_isolation_breach
      name: "SaaS tenant isolation breach and cross-border leakage"
      description: >
        Flaws in the multi-tenant architecture allow unauthorized tenants to access,
        modify, or exfiltrate customer data across virtual boundaries or violate residency laws.
      likelihood: urn:intuitem:risk:req_node:appsec:saas_environment_isolation
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:weak_tenant_isolation
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_tenant_isolation_and_residency
        - urn:intuitem:risk:control:appsec:saas_cryptographic_sovereignty

    # 19. SaaS vendor privilege abuse and sub-processor leakage (SaaS applications)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:saas_vendor_privilege_abuse_and_subprocessor_leakage
      ref_id: saas_vendor_privilege_abuse_and_subprocessor_leakage
      name: "SaaS vendor privilege abuse and sub-processor leakage"
      description: >
        Unauthorized vendor personnel access customer data without Lockbox approval,
        or fourth-party sub-processors suffer an uncontained breach compromising customer data.
      likelihood: urn:intuitem:risk:req_node:appsec:saas_entitlements_and_privileges
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:data_exfiltration
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:uncontrolled_vendor_access
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_vendor_access_governance
        - urn:intuitem:risk:control:appsec:saas_subprocessor_and_supply_chain
        - urn:intuitem:risk:control:appsec:saas_telemetry_and_audit_export

    # 20. Reliance on unverified SaaS security posture (SaaS applications)
      frameworks: ["appsec", "appsec_manual"]
    - urn: urn:intuitem:risk:scenario:appsec:saas_unverified_security_posture
      ref_id: saas_unverified_security_posture
      name: "Reliance on unverified SaaS security posture"
      description: >
        The organization relies on an external SaaS solution without independent third-party
        audit assurance reports (SOC 2 Type II, ISO 27001), leaving systemic flaws undetected.
      likelihood: urn:intuitem:risk:req_node:appsec:saas_audit_and_compliance
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:undetected_intrusion
        - urn:intuitem:risk:threat:appsec:data_loss
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:unverified_saas_security
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_third_party_assurance
        - urn:intuitem:risk:control:appsec:saas_contract

      frameworks: ["appsec", "appsec_manual"]
    # 21. Host or OS compromise via unpatched system vulnerabilities (Infrastructure)
    - urn: urn:intuitem:risk:scenario:appsec:os_and_host_unpatched_vulnerability
      ref_id: os_and_host_unpatched_vulnerability
      name: "Host or OS compromise via unpatched system vulnerabilities"
      description: >
        Adversaries exploit unpatched operating system, kernel, or container host vulnerabilities,
        or patching causes unplanned outages due to single-point-of-failure architecture.
      likelihood: urn:intuitem:risk:req_node:appsec:os_patching
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:service_disruption
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:untested_application_security
        - urn:intuitem:risk:vulnerability:appsec:inadequate_resilience_backup
      reference_controls:
        - urn:intuitem:risk:control:appsec:regular_penetration_testing
        - urn:intuitem:risk:control:appsec:backup_and_disaster_recovery
      frameworks: ["appsec", "appsec_manual"]

    # 22. Compromise via unhardened or End-of-Life (EOL) COTS deployment (COTS applications)
    - urn: urn:intuitem:risk:scenario:appsec:cots_misconfiguration_or_eol_exploitation
      ref_id: cots_misconfiguration_or_eol_exploitation
      name: "Compromise via unhardened or End-of-Life (EOL) COTS deployment"
      description: >
        Adversaries exploit default vendor credentials, unhardened COTS configurations,
        or unpatched CVEs in End-of-Life (EOL) commercial software packages.
      likelihood: urn:intuitem:risk:req_node:appsec:cots_deployment_hardening
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:unauthorized_access
        - urn:intuitem:risk:threat:appsec:service_disruption
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:untested_application_security
        - urn:intuitem:risk:vulnerability:appsec:contractual_gap
      reference_controls:
        - urn:intuitem:risk:control:appsec:regular_penetration_testing
      frameworks: ["appsec", "appsec_manual"]

    # 23. Application or storage compromise via unrestricted file upload (Custom applications)
    - urn: urn:intuitem:risk:scenario:appsec:malicious_file_upload_compromise
      ref_id: malicious_file_upload_compromise
      name: "Application or storage compromise via unrestricted file upload"
      description: >
        Adversaries upload webshells, malware, or path-traversal payloads due to missing
        magic-byte validation, lack of malware scanning, or executable storage permissions.
      likelihood: urn:intuitem:risk:req_node:appsec:file_upload_security
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:injection_attacks
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:flawed_input_validation
      reference_controls:
        - urn:intuitem:risk:control:appsec:secure_input_validation_and_encoding
      frameworks: ["appsec", "appsec_manual"]

    # 24. SaaS tenant takeover via unprotected administrative console (SaaS applications)
    - urn: urn:intuitem:risk:scenario:appsec:saas_admin_console_takeover
      ref_id: saas_admin_console_takeover
      name: "SaaS tenant takeover via unprotected administrative console"
      description: >
        Adversaries compromise root, administrative, or break-glass accounts on the SaaS tenant
        management console due to missing Multi-Factor Authentication (MFA).
      likelihood: urn:intuitem:risk:req_node:appsec:saas_iam
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:account_takeover
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:weak_authentication_controls
      reference_controls:
        - urn:intuitem:risk:control:appsec:enforce_mfa_and_strong_auth
      frameworks: ["appsec", "appsec_manual"]

    # 25. SaaS customer data exposure due to missing contractual encryption or NDA safeguards (SaaS applications)
    - urn: urn:intuitem:risk:scenario:appsec:saas_unencrypted_or_unauthorized_data_exposure
      ref_id: saas_unencrypted_or_unauthorized_data_exposure
      name: "SaaS customer data exposure due to missing encryption or NDA safeguards"
      description: >
        Customer data processed in the SaaS platform is exposed due to missing contractual
        encryption mandates (in transit and at rest) or unrestricted vendor staff access without NDAs.
      likelihood: urn:intuitem:risk:req_node:appsec:saas_confidentiality_and_data_protection
      impact: urn:intuitem:risk:req_node:appsec:data_classification
      threats:
        - urn:intuitem:risk:threat:appsec:data_exfiltration
        - urn:intuitem:risk:threat:appsec:unauthorized_access
      vulnerabilities:
        - urn:intuitem:risk:vulnerability:appsec:contractual_gap
        - urn:intuitem:risk:vulnerability:appsec:lack_of_encryption
      reference_controls:
        - urn:intuitem:risk:control:appsec:saas_cryptographic_sovereignty
        - urn:intuitem:risk:control:appsec:encrypt_data_in_transit
        - urn:intuitem:risk:control:appsec:encrypt_data_at_rest
      frameworks: ["appsec", "appsec_manual"]

  # ========================================================================
  # RISK MATRIX - 4x4 probability/impact matrix with risk levels
  # ========================================================================
  risk_matrix:
    - urn: urn:intuitem:risk:matrix:appsec
      ref_id: risk-matrix-4x4-appsec
      name: Application Security Risk Matrix
      description: 4x4 Risk Matrix for Application Security Assessment
      # Probability levels (4 levels: unlikely to very likely)
      probability:
      - id: 0
        abbreviation: '1'
        name: 1 - unlikely
        description: The likelihood of the risk scenario is very low
      - id: 1
        abbreviation: '2'
        name: 2 - rather unlikely
        description: The likelihood of the risk scenario is low
      - id: 2
        abbreviation: '3'
        name: 3 - likely
        description: The likelihood of the risk scenario is significant
      - id: 3
        abbreviation: '4'
        name: 4 - very likely
        description: The likelihood of the risk scenario is high
      # Impact levels (4 levels: minor to critical)
      impact:
      - id: 0
        abbreviation: '1'
        name: 1 - minor
        description: Negligible consequences for the organization
      - id: 1
        abbreviation: '2'
        name: 2 - significant
        description: Significant but limited consequences for the organization
      - id: 2
        abbreviation: '3'
        name: 3 - serious
        description: Substantial consequences for the organization
      - id: 3
        abbreviation: '4'
        name: 4 - critical
        description: Disastrous consequences for the organization
      # Risk levels (5 levels: very low to very high)
      risk:
      - id: 0
        abbreviation: '1'
        name: 1 - very low
        description: very low - acceptable risk
        hexcolor: '#D3FF4E'
      - id: 1
        abbreviation: '2'
        name: 2 - low
        description: low - acceptable risk
        hexcolor: '#02A45A'
      - id: 2
        abbreviation: '3'
        name: 3 - medium
        description: medium - tolerable risk
        hexcolor: '#FFA600'
      - id: 3
        abbreviation: '4'
        name: 4 - high
        description: high - unacceptable risk
        hexcolor: '#FF1A00'
      - id: 4
        abbreviation: '5'
        name: 5 - very high
        description: very high - unacceptable risk
        hexcolor: '#C00000'
      # Risk calculation grid: maps probability x impact to risk level
      grid:
      - - 0
        - 0
        - 1
        - 1
      - - 0
        - 1
        - 1
        - 2
      - - 1
        - 1
        - 2
        - 3
      - - 1
        - 2
        - 3
        - 4

  # ========================================================================
  # THREATS - Application security threat agents and events
  # ========================================================================
  threats:
    - urn: urn:intuitem:risk:threat:appsec:data_exfiltration
      ref_id: data_exfiltration
      name: "Data exfiltration"
      description: "Unauthorized extraction or transfer of sensitive data to an untrusted external entity."
    - urn: urn:intuitem:risk:threat:appsec:data_loss
      ref_id: data_loss
      name: "Data loss"
      description: "Accidental or malicious destruction, corruption, or irreversible loss of data."
    - urn: urn:intuitem:risk:threat:appsec:unauthorized_access
      ref_id: unauthorized_access
      name: "Unauthorized access"
      description: "Access to sensitive information, functionality, or administrative commands by an unprivileged entity."
    - urn: urn:intuitem:risk:threat:appsec:injection_attacks
      ref_id: injection_attacks
      name: "Injection attacks"
      description: "Exploitation of interpreter flaws via untrusted input (SQL injection, OS command injection, XSS)."
    - urn: urn:intuitem:risk:threat:appsec:account_takeover
      ref_id: account_takeover
      name: "Account takeover"
      description: "Hijacking legitimate user or privileged accounts via credential stuffing, brute force, or session compromise."
    - urn: urn:intuitem:risk:threat:appsec:supply_chain_tampering
      ref_id: supply_chain_tampering
      name: "Software supply chain tampering"
      description: "Malicious manipulation or exploitation of open-source packages, libraries, or build pipelines."
    - urn: urn:intuitem:risk:threat:appsec:secrets_compromise
      ref_id: secrets_compromise
      name: "Secrets compromise"
      description: "Unauthorized discovery or theft of cryptographic keys, API tokens, database passwords, or credentials."
    - urn: urn:intuitem:risk:threat:appsec:service_disruption
      ref_id: service_disruption
      name: "Service disruption"
      description: "Denial of service, volumetric flooding, resource exhaustion, or failure degrading system availability."
    - urn: urn:intuitem:risk:threat:appsec:undetected_intrusion
      ref_id: undetected_intrusion
      name: "Undetected intrusion"
      description: "Prolonged adversarial access persisting undetected due to missing or inadequate security telemetry."

